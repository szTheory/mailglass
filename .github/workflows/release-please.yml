name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        # DO NOT bump to v5 until Phase 13 release ceremony (per .planning/phases/08-release-engineering-hardening/08-CONTEXT.md D-08-26)
        # Rehearsed 2026-04-28: stay on the pinned v4 path for the v0.2.0 cut.
        # `secrets.GITHUB_TOKEN` is acceptable for release/tag creation here,
        # but maintainers must treat publish/smoke workflow_dispatch from the
        # release tag as the canonical fallback if downstream release fan-out
        # does not occur automatically.
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Path 2 fix: release-please's `extra-files` generic updater silently
      # no-ops on a mix.exs already managed by the elixir release-type, so
      # the {:mailglass, "== <ver>"} pin in mailglass_admin/mix.exs never
      # gets rewritten. We sync it ourselves on the release-please PR branch
      # after the action runs. Idempotent — exits clean if the pin is already
      # correct or if there's no release-please PR pending.
      # Ceremony rule: review this generated PR diff before merge. The repo's
      # linked-version dep pin is custom, so the release PR is not a vanilla
      # release-please artifact.
      #
      # Recursion-safe: pushes authenticated with GITHUB_TOKEN do NOT trigger
      # further workflow runs (GitHub anti-recursion guarantee).
      - name: Checkout main for sync step
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Sync sibling package -> mailglass dep pin on release-please branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          set -euo pipefail
          BRANCH=release-please--branches--main

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "No $BRANCH on origin — nothing to sync."
            exit 0
          fi

          git fetch origin "$BRANCH":"$BRANCH"
          git checkout "$BRANCH"

          # Both mailglass_admin and mailglass_inbound pin to CORE'S manifest version,
          # not their own. Read .["."] directly; do NOT use a fallback chain (would
          # return inbound's unlinked version after the linked-versions split).
          CORE_VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          if [ -z "$CORE_VERSION" ] || [ "$CORE_VERSION" = "null" ]; then
            echo "ERROR: could not read core version (.[\".\"]) from .release-please-manifest.json" >&2
            exit 1
          fi
          echo "Target dep pin: {:mailglass, \"== $CORE_VERSION\"}"

          # REL-05: Bash-loop generalization keyed on (path, dep_atom) pairs.
          # Keep the linked sibling packages explicit in the release PR diff.
          PINS=(
            "mailglass_admin/mix.exs:mailglass"
            "mailglass_inbound/mix.exs:mailglass"
          )

          for entry in "${PINS[@]}"; do
            path="${entry%:*}"
            dep="${entry##*:}"

            # REL-05: exit-1 guard — catches the case where the dep tuple was
            # renamed and the sed would silently no-op. Two layers of protection:
            # (1) this guard, (2) mix_config_test.exs sed-anchor stability test.
            matches=$(grep -cE "\{:${dep}, \"== [0-9]+\.[0-9]+\.[0-9]+\"\}" "$path" || true)
            if [ "$matches" -eq 0 ]; then
              echo "ERROR: sed anchor regex matched zero lines in $path." >&2
              echo "The dep tuple shape may have been renamed — see CONTRIBUTING.md REL-05 section." >&2
              exit 1
            fi

            sed -i -E "s/\{:${dep}, \"== [0-9]+\.[0-9]+\.[0-9]+\"\}/{:${dep}, \"== ${CORE_VERSION}\"}/" "$path"
          done

          if git diff --quiet -- mailglass_admin/mix.exs mailglass_inbound/mix.exs; then
            echo "Pin already at $CORE_VERSION — nothing to commit."
            exit 0
          fi

          echo "Pin updated; diff follows:"
          git --no-pager diff -- mailglass_admin/mix.exs mailglass_inbound/mix.exs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mailglass_admin/mix.exs mailglass_inbound/mix.exs
          git commit -m "chore(release-please): sync sibling mailglass dep pins to == $CORE_VERSION"
          git push origin "$BRANCH"
