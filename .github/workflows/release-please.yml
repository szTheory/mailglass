name: release-please

on:
  push:
    branches:
      - main
  # Pushes, digest-free manual runs, and the hourly schedule are proposal-only.
  # They may create or synchronize the release PR, but cannot merge it or create
  # tags/releases. Only a later protected workflow_dispatch carrying the exact
  # dual-authorized candidate digest may cross that boundary.
  workflow_dispatch:
    inputs:
      candidate_digest:
        description: "Protected exact candidate digest after dual authorization"
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Every trigger reads release policy from the protected default branch.
      # In particular, workflow_dispatch callers cannot select a branch whose
      # release-target ledger authorizes itself.
      - name: Checkout protected main for release preflight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0

      # Policy wrappers are Mix programs. Install the pinned runtime and deps
      # before any wrapper is called so their stdout is policy output only.
      - name: Set up OTP + Elixir for policy
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Install deps for policy
        run: mix deps.get
      - name: Compile policy runtime
        run: mix compile

      # release-please reruns on a merged release PR can be stale if the
      # release was already tagged/published by an earlier run. That is the
      # current failure mode for PR #34: the PR has already been labeled
      # `autorelease: tagged`, so re-running release-please against the merge
      # commit would recreate the same GitHub release tag and fail with
      # `already_exists`.
      #
      # We only skip when the pushed commit is clearly the merge of a release
      # PR that already has the tagged label. Future release PRs still run:
      # before tagging, they stay `autorelease: pending`, so the guard passes.
      - name: Detect already-tagged release PR
        id: release-preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The scheduled/manual paths have no checkout, so gh cannot infer a
          # remote. Pin it to this workflow's repository for every preflight
          # query rather than treating failed lookups as absent releases.
          GH_REPO: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_DIGEST: ${{ github.event.inputs.candidate_digest }}
        run: |
          set -euo pipefail

          manifest=.release-please-manifest.json
          target=.planning/release-target.json
          if [ ! -r "$manifest" ]; then
            echo "ERROR: release manifest is missing or unreadable: $manifest" >&2
            exit 1
          fi

          if [ -z "${CANDIDATE_DIGEST:-}" ]; then
            echo "Proposal mode bypasses historical baseline tag recovery."
            echo "should_run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${CANDIDATE_DIGEST:-}" ]; then
            if ! expected_tags_text=$(scripts/release_policy_expected_tags.sh "$manifest" "$target"); then
              echo "ERROR: protected release target is invalid: $target" >&2
              exit 1
            fi
            echo "Protected release target owns these tags: ${expected_tags_text//$'\n'/,}"
          elif ! expected_tags_text=$(scripts/release_policy_expected_tags.sh "$manifest"); then
            echo "ERROR: release manifest is invalid: $manifest" >&2
            exit 1
          fi

          mapfile -t expected_tags <<<"$expected_tags_text"
          if [ "${#expected_tags[@]}" -eq 0 ] || [ -z "${expected_tags[0]:-}" ]; then
            echo "ERROR: release manifest yielded no expected release tags" >&2
            exit 1
          fi

          missing_tags=()
          present_tags=()
          for tag in "${expected_tags[@]}"; do
            release_response=$(mktemp)
            if gh api --include "repos/${GH_REPO}/releases/tags/${tag}" >"$release_response" 2>&1; then
              present_tags+=("$tag")
            elif grep -qE '^HTTP/[0-9.]+ 404 ' "$release_response"; then
              missing_tags+=("$tag")
            else
              echo "ERROR: could not determine release state for tag $tag" >&2
              cat "$release_response" >&2
              rm -f "$release_response"
              exit 1
            fi
            rm -f "$release_response"
          done

          if [ "${#present_tags[@]}" -gt 0 ] && [ "${#missing_tags[@]}" -gt 0 ]; then
            printf 'Partial release state detected. Present: %s. Missing: %s.\n' \
              "$(IFS=,; echo "${present_tags[*]}")" \
              "$(IFS=,; echo "${missing_tags[*]}")" >&2
            exit 1
          fi

          if [ "${#missing_tags[@]}" -eq 0 ]; then
            printf 'All expected release tags already exist: %s\n' "$(IFS=,; echo "${present_tags[*]}")"
            echo "should_run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # Every expected tag is authoritatively absent. Only now may a
          # schedule/manual run without a push commit start release-please.
          pr_number=""
          if [[ "${COMMIT_MESSAGE:-}" =~ Merge\ pull\ request\ #([0-9]+) ]]; then
            pr_number="${BASH_REMATCH[1]}"
          fi

          if [ -z "$pr_number" ]; then
            echo "No merge PR number found after confirming all release tags are absent; running release-please."
            echo "should_run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if ! labels=$(gh pr view "$pr_number" --json labels --jq '.labels[].name'); then
            echo "ERROR: could not determine labels for release PR #$pr_number" >&2
            exit 1
          fi
          if grep -qx 'autorelease: tagged' <<<"$labels"; then
            echo "Release PR #$pr_number is already tagged; skipping release-please rerun."
            echo "should_run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release PR #$pr_number is not fully published yet; running release-please."
          echo "should_run=true" >>"$GITHUB_OUTPUT"

      - name: Validate protected exact candidate dispatch
        id: protected-dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_digest != '' }}
        env:
          CANDIDATE_DIGEST: ${{ github.event.inputs.candidate_digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          current_main_sha=$(git rev-parse origin/main)
          [ "$(git rev-parse HEAD)" = "$current_main_sha" ]
          control_target=$(mktemp)
          cp .planning/release-target.json "$control_target"

          policy=$(mktemp)
          mix run --no-start --no-compile --no-deps-check --require scripts/release_policy.exs -e 'Mailglass.ReleasePolicy.cli(System.argv())' -- validate-protected-dispatch "$control_target" "$CANDIDATE_DIGEST" > "$policy"
          candidate_digest=$(awk -F= '$1 == "candidate_digest" {print $2}' "$policy")
          content_digest=$(awk -F= '$1 == "content_digest" {print $2}' "$policy")
          proposal_head=$(awk -F= '$1 == "proposal_head" {print $2}' "$policy")
          source_sha=$(awk -F= '$1 == "source_sha" {print $2}' "$policy")
          authorized_versions=$(mktemp)
          mix run --no-start --no-compile --no-deps-check --require scripts/release_policy.exs -e 'Mailglass.ReleasePolicy.cli(System.argv())' -- authorized-versions "$control_target" > "$authorized_versions"
          core=$(awk -F= '$1 == "core" {print $2}' "$authorized_versions")
          admin=$(awk -F= '$1 == "admin" {print $2}' "$authorized_versions")
          inbound=$(awk -F= '$1 == "inbound" {print $2}' "$authorized_versions")
          [ "$candidate_digest" = "$CANDIDATE_DIGEST" ]
          [[ "$candidate_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$content_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$proposal_head" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          prs=$(gh pr list --head release-please--branches--main --base main --state open --json number,headRefOid,baseRefOid)
          [ "$(jq -er 'length' <<<"$prs")" -eq 1 ]
          pr=$(jq -cer '.[0]' <<<"$prs")
          number=$(jq -er '.number' <<<"$pr")
          head=$(jq -er '.headRefOid' <<<"$pr")
          base=$(jq -er '.baseRefOid' <<<"$pr")
          [[ "$number" =~ ^[0-9]+$ ]]
          [ "$head" = "$proposal_head" ]
          [ "$base" = "$current_main_sha" ]
          git fetch --no-tags origin "$source_sha" "$proposal_head"
          git merge-base --is-ancestor "$source_sha" "$current_main_sha"
          # Planning/authorization commits may advance main; package content may
          # not. A changed publishable set requires a newly captured candidate.
          source_content_digest=$(scripts/release_policy_content_digest.sh --ref "$source_sha")
          main_content_digest=$(scripts/release_policy_content_digest.sh --ref "$current_main_sha")
          [ "$source_content_digest" = "$main_content_digest" ]

          # GitHub enforces required checks and strict base freshness when the
          # exact-head merge below reaches the protected branch. Avoid a brittle
          # branch-protection API read that GITHUB_TOKEN cannot reliably perform.
          git checkout --detach "$proposal_head"
          actual_digest=$(scripts/release_policy_content_digest.sh)
          [ "$actual_digest" = "$content_digest" ]
          proposal_versions=$(mktemp)
          scripts/release_policy_validate_target.sh "$control_target" "mailglass-v${core}" . > "$proposal_versions"
          grep -Fqx "core=$core" "$proposal_versions"
          grep -Fqx "admin=$admin" "$proposal_versions"
          grep -Fqx "inbound=$inbound" "$proposal_versions"
          printf 'authorized=true\ncandidate_digest=%s\ncontent_digest=%s\nproposal_head=%s\nsource_sha=%s\nnumber=%s\ncontent_verified=true\n' "$candidate_digest" "$content_digest" "$proposal_head" "$source_sha" "$number" >> "$GITHUB_OUTPUT"

      - name: Protected exact candidate dispatch may merge only the validated release PR
        id: protected-merge
        if: ${{ steps.protected-dispatch.outputs.authorized == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.protected-dispatch.outputs.number }}
          PROPOSAL_HEAD: ${{ steps.protected-dispatch.outputs.proposal_head }}
          CANDIDATE_DIGEST: ${{ steps.protected-dispatch.outputs.candidate_digest }}
          CONTENT_DIGEST: ${{ steps.protected-dispatch.outputs.content_digest }}
        run: |
          set -euo pipefail
          gh pr merge "$NUMBER" --squash --match-head-commit "$PROPOSAL_HEAD" --repo "$GITHUB_REPOSITORY"
          git fetch --no-tags origin main
          git checkout --detach origin/main
          merged_digest=$(scripts/release_policy_content_digest.sh)
          [ "$merged_digest" = "$CONTENT_DIGEST" ]
          mix run --no-start --no-compile --no-deps-check --require scripts/release_policy.exs -e 'Mailglass.ReleasePolicy.cli(System.argv())' -- validate-protected-dispatch .planning/release-target.json "$CANDIDATE_DIGEST" >/dev/null
          echo "merge_tree_verified=true" >> "$GITHUB_OUTPUT"

      - id: release
        # DO NOT bump to v5 until Phase 13 release ceremony (per .planning/phases/08-release-engineering-hardening/08-CONTEXT.md D-08-26)
        # Rehearsed 2026-04-28: stay on the pinned v4 path for the v0.2.0 cut.
        # Release creation uses RELEASE_PLEASE_PAT so the downstream
        # release/published fan-out can trigger publish/smoke workflows.
        # Maintainers must still treat tag-pinned workflow_dispatch from the
        # release tag as the canonical fallback if downstream fan-out fails.
        if: ${{ steps.release-preflight.outputs.should_run == 'true' && (github.event.inputs.candidate_digest == '' || (steps.protected-dispatch.outputs.authorized == 'true' && steps.protected-dispatch.outputs.content_verified == 'true' && steps.protected-merge.outputs.merge_tree_verified == 'true' && steps.protected-merge.outcome == 'success')) }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Proposal mode only. This workflow may update a release PR but cannot
          # create a GitHub release or tag from an unreviewed candidate.
          skip-github-release: ${{ github.event.inputs.candidate_digest == '' }}

      # Path 2 fix: release-please's `extra-files` generic updater silently
      # no-ops on a mix.exs already managed by the elixir release-type, so
      # the {:mailglass, "== <ver>"} pin in mailglass_admin/mix.exs never
      # gets rewritten. We sync it ourselves on the release-please PR branch
      # after the action runs. Idempotent — exits clean if the pin is already
      # correct or if there's no release-please PR pending.
      # Note: the release PR auto-merges on green (see "Arm auto-merge" below),
      # so review the generated diff during the CI window if needed. The repo's
      # linked-version dep pin is custom, so the release PR is not a vanilla
      # release-please artifact.
      #
      # CI trigger: this checkout uses RELEASE_PLEASE_PAT so the sync
      # commit pushed below is authored by a non-GITHUB_TOKEN identity. That makes
      # GitHub fire `pull_request: synchronize` -> ci.yml on the synced head, so the
      # release PR's required checks actually report. A GITHUB_TOKEN push would be
      # suppressed by anti-recursion, leaving the PR with "no checks reported" and
      # auto-merge unable to fire.
      - name: Checkout main for sync step
        if: ${{ steps.release-preflight.outputs.should_run == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_PAT }}

      - name: Sync sibling package -> mailglass dep pin on release-please branch
        if: ${{ steps.release-preflight.outputs.should_run == 'true' && steps.release.outputs.prs_created == 'true' }}
        run: |
          set -euo pipefail
          BRANCH=release-please--branches--main

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "No $BRANCH on origin — nothing to sync."
            exit 0
          fi

          git fetch origin "$BRANCH":"$BRANCH"
          git checkout "$BRANCH"

          # Read the linked core/admin manifest version. Read .["."] directly;
          # do NOT use a fallback chain (which could return inbound's independent
          # version instead).
          CORE_VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          if [ -z "$CORE_VERSION" ] || [ "$CORE_VERSION" = "null" ]; then
            echo "ERROR: could not read core version (.[\".\"]) from .release-please-manifest.json" >&2
            exit 1
          fi

          # Inbound is independently versioned. Compare the release branch's
          # manifest entry with main before changing any inbound self-version.
          # Its core compatibility docs/evidence still follow every linked core
          # release even when inbound itself is not versioned or published.
          INBOUND_VERSION=$(jq -r '.["mailglass_inbound"]' .release-please-manifest.json)
          MAIN_INBOUND_VERSION=$(git show origin/main:.release-please-manifest.json | jq -r '.["mailglass_inbound"]')
          if [ -z "$INBOUND_VERSION" ] || [ "$INBOUND_VERSION" = "null" ] || \
             [ -z "$MAIN_INBOUND_VERSION" ] || [ "$MAIN_INBOUND_VERSION" = "null" ]; then
            echo "ERROR: could not read inbound manifest version on release branch or origin/main" >&2
            exit 1
          fi

          INBOUND_CHANGED=false
          if [ "$INBOUND_VERSION" != "$MAIN_INBOUND_VERSION" ]; then
            INBOUND_CHANGED=true
          fi

          # Sync the core + admin README `{:mailglass, "~> X.Y"}` and
          # `{:mailglass_admin, "~> X.Y"}` install pins to the CORE major.minor.
          # core + admin are LINKED, so both packages share the core version.
          # The docs-contract tests (test/mailglass/docs_contract_test.exs and
          # mailglass_admin/test/.../stability_contract_test.exs) assert README
          # pin major.minor == @version major.minor, which would otherwise fail
          # on the PR branch the moment release-please bumps @version.
          CORE_MM=$(echo "$CORE_VERSION" | cut -d. -f1,2)
          INBOUND_MM=$(echo "$INBOUND_VERSION" | cut -d. -f1,2)
          echo "Target core/admin README pins: ~> $CORE_MM"
          for readme in README.md mailglass_admin/README.md; do
            sed -i -E "s/\{:mailglass, \"~> [0-9]+\.[0-9]+\"/{:mailglass, \"~> ${CORE_MM}\"/" "$readme"
            sed -i -E "s/\{:mailglass_admin, \"~> [0-9]+\.[0-9]+\"/{:mailglass_admin, \"~> ${CORE_MM}\"/" "$readme"
          done

          # Inbound stays on its independent version line, but its install docs
          # and committed compatibility evidence must describe the new core.
          sed -i -E "s/\{:mailglass, \"~> [0-9]+\.[0-9]+\"/{:mailglass, \"~> ${CORE_MM}\"/" mailglass_inbound/README.md
          sed -i -E "s/\{:mailglass_admin, \"~> [0-9]+\.[0-9]+\"/{:mailglass_admin, \"~> ${CORE_MM}\"/" mailglass_inbound/README.md

          INSTALL=mailglass_inbound/docs/inbound-install.md
          if [ -f "$INSTALL" ]; then
            sed -i -E "s/(\{:mailglass,[[:space:]]+\"~> )[0-9]+\.[0-9]+(\")/\1${CORE_MM}\2/" "$INSTALL"
          fi

          SUMMARY=.planning/publish/mailglass_inbound-publish-summary.json
          if [ -f "$SUMMARY" ]; then
            tmp=$(mktemp)
            jq --arg v "$INBOUND_VERSION" --arg pin "~> ${CORE_MM} and >= ${CORE_VERSION}" --arg core "$CORE_VERSION" --argjson inbound_changed "$INBOUND_CHANGED" \
              '.mailglass_inbound_publish_pin=$pin | .linked_versions.mailglass=$core | .linked_versions.mailglass_admin=$core | .linked_versions.mailglass_inbound=$v | if $inbound_changed then .version=$v | .manifest_version=$v | .source_ref=("v"+$v) else . end' \
              "$SUMMARY" >"$tmp" && mv "$tmp" "$SUMMARY"
          fi

          if [ "$INBOUND_CHANGED" = true ]; then
            # Only an actual inbound release changes inbound's own install pin.
            echo "Target inbound README pin: {:mailglass_inbound, \"~> $INBOUND_MM\"}"
            sed -i -E "s/\{:mailglass_inbound, \"~> [0-9]+\.[0-9]+\"\}/{:mailglass_inbound, \"~> ${INBOUND_MM}\"}/" mailglass_inbound/README.md
            if [ -f "$INSTALL" ]; then
              sed -i -E "s/(\{:mailglass_inbound,[[:space:]]+\"~> )[0-9]+\.[0-9]+(\")/\1${INBOUND_MM}\2/" "$INSTALL"
            fi
          fi

          SYNC_PATHS=(
            README.md
            mailglass_admin/README.md
            mailglass_inbound/README.md
            mailglass_inbound/docs/inbound-install.md
            .planning/publish/mailglass_inbound-publish-summary.json
          )
          COMMIT_MESSAGE="chore(release-please): sync linked package pins to core $CORE_VERSION"
          if [ "$INBOUND_CHANGED" = true ]; then
            COMMIT_MESSAGE="chore(release-please): sync inbound README \`~>\` pin + publish-summary to core $CORE_VERSION"
          fi
          if git diff --quiet -- "${SYNC_PATHS[@]}"; then
            echo "Pins + README already synced — nothing to commit."
            exit 0
          fi

          echo "Pins/README updated; diff follows:"
          git --no-pager diff -- "${SYNC_PATHS[@]}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${SYNC_PATHS[@]}"
          git commit -m "$COMMIT_MESSAGE"
          git push origin "$BRANCH"

      - name: Capture Release Please proposal identity without activation
        id: capture-proposal
        if: ${{ steps.release-preflight.outputs.should_run == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Capture proposal/source identity only after the sibling-pin sync
          # has settled the release branch; its publishable-content digest is
          # Plan 05 input.
          prs=$(gh pr list --head release-please--branches--main --base main --state open --json number,headRefOid,baseRefOid)
          [ "$(jq -er 'length' <<<"$prs")" -le 1 ]
          [ "$(jq -er 'length' <<<"$prs")" -eq 1 ] || exit 0
          proposal=$(jq -cer '.[0]' <<<"$prs")
          proposal_head=$(jq -er '.headRefOid' <<<"$proposal")
          source_sha=$(jq -er '.baseRefOid' <<<"$proposal")
          [[ "$proposal_head" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$source_sha" "$proposal_head"
          source_target=$(mktemp)
          git show "$source_sha":.planning/release-target.json > "$source_target"
          mkdir -p .planning/release-candidates
          target_status=$(jq -er '.status' "$source_target")

          case "$target_status" in
            inactive)
              git checkout --detach "$proposal_head"
              digest=$(scripts/release_policy_content_digest.sh)
              mix run --no-start --no-compile --no-deps-check --require scripts/release_policy.exs -e 'Mailglass.ReleasePolicy.cli(System.argv())' -- capture-candidate "$source_target" . "$proposal_head" "$source_sha" "$digest" > .planning/release-candidates/proposal-candidate.json
              ;;
            captured|authorized)
              # Plan 05 advances main only to record the already-reviewed
              # candidate. Preserve that exact proposal instead of trying to
              # recapture it through the inactive-only CLI.
              recorded_head=$(jq -er '.proposal_identity.head_sha' "$source_target")
              recorded_source_sha=$(jq -er '.proposal_identity.source_sha' "$source_target")
              recorded_digest=$(jq -er '.publishable_content.digest' "$source_target")
              core=$(jq -er '.candidate_versions.mailglass' "$source_target")
              [[ "$recorded_head" =~ ^[0-9a-f]{40}$ ]]
              [[ "$recorded_source_sha" =~ ^[0-9a-f]{40}$ ]]
              [[ "$recorded_digest" =~ ^[0-9a-f]{64}$ ]]
              [ "$proposal_head" = "$recorded_head" ]
              git merge-base --is-ancestor "$recorded_source_sha" "$source_sha"
              [ "$(scripts/release_policy_content_digest.sh --ref "$recorded_source_sha")" = "$(scripts/release_policy_content_digest.sh --ref "$source_sha")" ]
              git checkout --detach "$proposal_head"
              [ "$(scripts/release_policy_content_digest.sh)" = "$recorded_digest" ]
              scripts/release_policy_validate_target.sh "$source_target" "mailglass-v${core}" . >/dev/null
              jq -e '{candidate_versions, proposal_identity, publishable_content}' "$source_target" > .planning/release-candidates/proposal-candidate.json
              ;;
            completed)
              echo "Completed release target needs no proposal capture."
              exit 0
              ;;
            *)
              echo "ERROR: unsupported release target status for proposal capture: $target_status" >&2
              exit 1
              ;;
          esac

          jq -e '.candidate_versions.mailglass == .candidate_versions.mailglass_admin' .planning/release-candidates/proposal-candidate.json >/dev/null
          echo "captured=true" >> "$GITHUB_OUTPUT"
          printf '%s\n' "proposal candidate captured after sibling synchronization"

      - name: Upload sanitized release proposal candidate
        if: ${{ steps.capture-proposal.outputs.captured == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-proposal-candidate-${{ github.run_id }}
          path: .planning/release-candidates/proposal-candidate.json
          if-no-files-found: error
          retention-days: 30

      # Preserve the historical step identity for workflow compatibility while
      # explicitly disarming ordinary auto-merge. The protected exact-digest
      # dispatch above is the sole merge/tag boundary.
      - name: Arm auto-merge on the release PR
        if: ${{ steps.release-preflight.outputs.should_run == 'true' && steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Disarmed ordinary auto-merge; a later protected exact candidate-digest dispatch is required."
