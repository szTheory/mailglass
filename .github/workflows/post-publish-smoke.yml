name: post-publish-smoke

on:
  release:
    types: [published]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    # Protected post-publication proof. Candidate release events are deliberate
    # no-ops because the three linked packages are published later by the
    # explicit protected release path. The scheduled canary alone consumes a
    # completed target; protected dispatch consumes the exact authorized target
    # or its published, adoption-retry-safe successor.
    inputs:
      core_version:
        description: "Exact published mailglass version from the protected target"
        required: true
        type: string
      admin_version:
        description: "Exact published mailglass_admin version from the protected target"
        required: true
        type: string
      inbound_version:
        description: "Exact published mailglass_inbound version from the protected target"
        required: true
        type: string
      target_ref:
        description: "Immutable 40-character tag SHA validated by the protected publisher"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mailglass-linked-release-smoke
  cancel-in-progress: false

jobs:
  resolve-completed-target:
    name: Resolve immutable completed release target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      completed: ${{ steps.target.outputs.completed }}
      authorized: ${{ steps.target.outputs.authorized }}
      core: ${{ steps.target.outputs.core }}
      admin: ${{ steps.target.outputs.admin }}
      inbound: ${{ steps.target.outputs.inbound }}
      target_ref: ${{ steps.target.outputs.target_ref }}
    steps:
      - name: Classify trigger
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET_REF: ${{ github.event.inputs.target_ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          write_resolution() {
            local status="$1" reason="$2" lifecycle="$3" ledger_status="$4" publication_status="$5" target_ref="$6" core="$7" admin="$8" inbound="$9"
            local resolution_path="$RUNNER_TEMP/post-publish-resolution.json"
            local temporary_path
            temporary_path=$(mktemp "$RUNNER_TEMP/post-publish-resolution.XXXXXX")

            printf '{"status":"%s","reason":"%s","event_name":"%s","run_id":"%s","lifecycle":"%s","ledger_status":"%s","publication_status":"%s","target_ref":"%s","core":"%s","admin":"%s","inbound":"%s"}\n' \
              "$status" "$reason" "$EVENT_NAME" "$RUN_ID" "$lifecycle" "$ledger_status" "$publication_status" "$target_ref" "$core" "$admin" "$inbound" \
              > "$temporary_path"
            mv "$temporary_path" "$resolution_path"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_TARGET_REF" =~ ^[0-9a-f]{40}$ ]]; then
              write_resolution "cannot-check" "invalid_protected_target_ref" "invalid" "" "" "" "" "" ""
              exit 1
            fi
          fi
          case "$EVENT_NAME" in
            release)
              write_resolution "pending" "release_event_noop" "not_applicable" "" "" "" "" "" ""
              printf 'resolve=false\n' >> "$GITHUB_OUTPUT"
              echo "Candidate release event is intentionally a no-op; protected dispatch starts exact proof after publication."
              ;;
            schedule|workflow_dispatch)
              write_resolution "cannot-check" "resolver_not_started" "pending" "" "" "" "" "" ""
              printf 'resolve=true\n' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported post-publish smoke trigger: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
      - name: Checkout immutable workflow control plane
        if: ${{ steps.trigger.outputs.resolve == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - name: Checkout immutable published target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.target_ref }}
          path: immutable-target
      - name: Set up OTP + Elixir
        if: ${{ steps.trigger.outputs.resolve == 'true' }}
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Install deps for policy
        if: ${{ steps.trigger.outputs.resolve == 'true' }}
        run: mix deps.get
      - name: Compile policy runtime
        if: ${{ steps.trigger.outputs.resolve == 'true' }}
        run: mix compile
      - name: Resolve protected target versions
        if: ${{ steps.trigger.outputs.resolve == 'true' }}
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CORE: ${{ github.event.inputs.core_version }}
          INPUT_ADMIN: ${{ github.event.inputs.admin_version }}
          INPUT_INBOUND: ${{ github.event.inputs.inbound_version }}
          INPUT_TARGET_REF: ${{ github.event.inputs.target_ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          command="authorized-versions"
          if [ "$EVENT_NAME" = "schedule" ]; then command="completed-versions"; fi
          control_target=.planning/release-target.json
          target="$control_target"
          target_repo=.
          resolved=$(mktemp)
          resolution_path="$RUNNER_TEMP/post-publish-resolution.json"
          resolution_finalized=false

          write_resolution() {
            local status="$1" reason="$2" lifecycle="$3" ledger_status="$4" publication_status="$5" target_ref="$6" core="$7" admin="$8" inbound="$9"
            local temporary_path
            temporary_path=$(mktemp "$RUNNER_TEMP/post-publish-resolution.XXXXXX")

            printf '{"status":"%s","reason":"%s","event_name":"%s","run_id":"%s","lifecycle":"%s","ledger_status":"%s","publication_status":"%s","target_ref":"%s","core":"%s","admin":"%s","inbound":"%s"}\n' \
              "$status" "$reason" "$EVENT_NAME" "$RUN_ID" "$lifecycle" "$ledger_status" "$publication_status" "$target_ref" "$core" "$admin" "$inbound" \
              > "$temporary_path"
            mv "$temporary_path" "$resolution_path"
          }

          trap 'exit_status=$?; trap - EXIT; if [ "$resolution_finalized" != true ]; then write_resolution "cannot-check" "resolver_failed" "error" "" "" "" "" "" ""; fi; exit "$exit_status"' EXIT

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            target=immutable-target/.planning/release-target.json
            target_repo=immutable-target
            control_resolved=$(mktemp)
            mix run --no-start --no-compile --no-deps-check --require scripts/release_policy.exs -e 'Mailglass.ReleasePolicy.cli(System.argv())' -- "authorized-versions" "$control_target" > "$control_resolved"
          fi
          set +e
          mix run --no-start --no-compile --no-deps-check --require scripts/release_policy.exs -e 'Mailglass.ReleasePolicy.cli(System.argv())' -- "$command" "$target" > "$resolved"
          resolution_status=$?
          set -e

          if [ "$resolution_status" -ne 0 ]; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              authorized_resolved=$(mktemp)

              if mix run --no-start --no-compile --no-deps-check --require scripts/release_policy.exs -e 'Mailglass.ReleasePolicy.cli(System.argv())' -- "authorized-versions" "$control_target" > "$authorized_resolved"; then
                ledger_status=$(awk -F= '$1 == "status" {print $2}' "$authorized_resolved")
                publication_status=$(mix run --no-start --no-compile --no-deps-check -e 'target = File.read!(".planning/release-target.json") |> Jason.decode!(); IO.write(target["states"]["publication"])')

                if [ "$ledger_status" = "authorized" ] && [ "$publication_status" = "not_started" ]; then
                  core=$(awk -F= '$1 == "core" {print $2}' "$authorized_resolved")
                  admin=$(awk -F= '$1 == "admin" {print $2}' "$authorized_resolved")
                  inbound=$(awk -F= '$1 == "inbound" {print $2}' "$authorized_resolved")
                  target_ref=""
                  write_resolution "blocked" "scheduled_target_not_published" "authorized" "$ledger_status" "$publication_status" "$target_ref" "$core" "$admin" "$inbound"
                  resolution_finalized=true
                  echo "Scheduled target is authorized but unpublished; wrote blocked resolution evidence." >&2
                  exit 1
                fi
              fi
            fi

            exit "$resolution_status"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            for identity_key in core admin inbound candidate_digest content_digest proposal_head source_sha; do
              control_value=$(awk -F= -v key="$identity_key" '$1 == key {print $2}' "$control_resolved")
              target_value=$(awk -F= -v key="$identity_key" '$1 == key {print $2}' "$resolved")
              [ -n "$control_value" ]
              [ "$control_value" = "$target_value" ]
            done

            control_status=$(awk -F= '$1 == "status" {print $2}' "$control_resolved")
            control_tag_sha=$(awk -F= '$1 == "tag_sha" {print $2}' "$control_resolved")
            case "$control_status" in
              authorized) [ -z "$control_tag_sha" ] ;;
              published) [ "$control_tag_sha" = "$INPUT_TARGET_REF" ] ;;
              *) echo "Unsupported protected target state: $control_status" >&2; exit 1 ;;
            esac
          fi
          completed=$(awk -F= '$1 == "completed" {print $2}' "$resolved")
          authorized=$(awk -F= '$1 == "authorized" {print $2}' "$resolved")
          core=$(awk -F= '$1 == "core" {print $2}' "$resolved")
          admin=$(awk -F= '$1 == "admin" {print $2}' "$resolved")
          inbound=$(awk -F= '$1 == "inbound" {print $2}' "$resolved")
          target_ref=""
          [[ "$core" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$admin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$inbound" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$EVENT_NAME" = "schedule" ]; then
            [ "$completed" = true ]
            target_ref=$(awk -F= '$1 == "target_ref" {print $2}' "$resolved")
          else
            [ "$authorized" = true ]
            [ -n "$INPUT_CORE" ]
            [ -n "$INPUT_ADMIN" ]
            [ -n "$INPUT_INBOUND" ]
            [ "$INPUT_CORE" = "$core" ]
            [ "$INPUT_ADMIN" = "$admin" ]
            [ "$INPUT_INBOUND" = "$inbound" ]
            [[ "$INPUT_TARGET_REF" =~ ^[0-9a-f]{40}$ ]]
            target_ref="$INPUT_TARGET_REF"
          fi
          [[ "$target_ref" =~ ^[0-9a-f]{40}$ ]]
          bash scripts/check_post_publish_target.sh \
            --repo "$target_repo" \
            --target "$target" \
            --target-ref "$target_ref" \
            --core "$core" \
            --admin "$admin" \
            --inbound "$inbound"
          lifecycle="completed"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then lifecycle="$control_status"; fi
          write_resolution "pass" "exact_target_verified" "$lifecycle" "$lifecycle" "published" "$target_ref" "$core" "$admin" "$inbound"
          resolution_finalized=true
          printf 'completed=%s\nauthorized=%s\ncore=%s\nadmin=%s\ninbound=%s\ntarget_ref=%s\n' "$completed" "$authorized" "$core" "$admin" "$inbound" "$target_ref" >> "$GITHUB_OUTPUT"
      - name: Summarize post-publish resolution
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/post-publish-resolution.json" ]; then
            {
              echo "## post-publish resolution"
              echo
              echo '```json'
              cat "$RUNNER_TEMP/post-publish-resolution.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload post-publish resolution
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: post-publish-resolution-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/post-publish-resolution.json

  cron-guard:
    name: Cron 7-day window guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve-completed-target]
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      release_ref: ${{ steps.guard.outputs.release_ref }}
      version_core: ${{ needs.resolve-completed-target.outputs.core }}
      version_admin: ${{ needs.resolve-completed-target.outputs.admin }}
      version_inbound: ${{ needs.resolve-completed-target.outputs.inbound }}
    steps:
      - name: Determine if smoke should run
        id: guard
        env:
          COMPLETED: ${{ needs.resolve-completed-target.outputs.completed }}
          AUTHORIZED: ${{ needs.resolve-completed-target.outputs.authorized }}
          COMPLETED_CORE: ${{ needs.resolve-completed-target.outputs.core }}
          COMPLETED_ADMIN: ${{ needs.resolve-completed-target.outputs.admin }}
          COMPLETED_INBOUND: ${{ needs.resolve-completed-target.outputs.inbound }}
          TARGET_REF: ${{ needs.resolve-completed-target.outputs.target_ref }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const eventName = context.eventName;

            if (eventName === 'release') {
              core.setOutput('should_run', 'false');
              core.setOutput('release_ref', '');
              core.info('Candidate release event is intentionally a no-op; exact proof waits for protected post-publication dispatch.');
              return;
            }

            if (eventName === 'schedule' && process.env.COMPLETED !== 'true') {
              core.setFailed('Scheduled smoke requires an immutable completed target.');
              return;
            }

            if (eventName === 'workflow_dispatch' && process.env.AUTHORIZED !== 'true') {
              core.setFailed('Protected post-publication dispatch requires its exact authorized or published target.');
              return;
            }

            const completedCore = process.env.COMPLETED_CORE || '';
            const completedAdmin = process.env.COMPLETED_ADMIN || '';
            const completedInbound = process.env.COMPLETED_INBOUND || '';
            if (![completedCore, completedAdmin, completedInbound].every((version) => /^\d+\.\d+\.\d+$/.test(version))) {
              core.setFailed('Immutable completed target did not provide three exact stable versions.');
              return;
            }

            if (eventName === 'schedule' || eventName === 'workflow_dispatch') {
              if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_REF || '')) {
                core.setFailed('Protected target did not provide an immutable 40-character ref.');
                return;
              }
              core.setOutput('should_run', 'true');
              core.setOutput('release_ref', process.env.TARGET_REF);
              return;
            }
            core.setOutput('should_run', 'false');
            core.setOutput('release_ref', '');

  wait-for-index:
    name: Wait for Hex.pm index
    runs-on: ubuntu-latest
    needs: [cron-guard]
    if: ${{ needs.cron-guard.outputs.should_run == 'true' }}
    timeout-minutes: 8
    env:
      VERSION_CORE: ${{ needs.cron-guard.outputs.version_core }}
      VERSION_ADMIN: ${{ needs.cron-guard.outputs.version_admin }}
      VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.cron-guard.outputs.release_ref }}
      - name: Validate exact package versions
        run: |
          for version in "$VERSION_CORE" "$VERSION_ADMIN" "$VERSION_INBOUND"; do
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::Invalid exact stable version '$version'."
              exit 1
            }
          done
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Wait for mailglass index
        run: |
          DEADLINE=$(( SECONDS + 300 ))
          until mix hex.info mailglass "${VERSION_CORE}" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: Hex.pm did not index mailglass ${VERSION_CORE} within 5 minutes."
              exit 1
            fi
            echo "Waiting for Hex.pm to index mailglass ${VERSION_CORE}..."
            sleep 30
          done
          echo "Hex.pm indexed mailglass ${VERSION_CORE}."
      - name: Wait for mailglass_admin index
        run: |
          DEADLINE=$(( SECONDS + 300 ))
          until mix hex.info mailglass_admin "${VERSION_ADMIN}" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: Hex.pm did not index mailglass_admin ${VERSION_ADMIN} within 5 minutes."
              exit 1
            fi
            echo "Waiting for Hex.pm to index mailglass_admin ${VERSION_ADMIN}..."
            sleep 30
          done
          echo "Hex.pm indexed mailglass_admin ${VERSION_ADMIN}."
      - name: Wait for mailglass_inbound index
        run: |
          DEADLINE=$(( SECONDS + 300 ))
          until mix hex.info mailglass_inbound "${VERSION_INBOUND}" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: Hex.pm did not index mailglass_inbound ${VERSION_INBOUND} within 5 minutes."
              exit 1
            fi
            echo "Waiting for Hex.pm to index mailglass_inbound ${VERSION_INBOUND}..."
            sleep 30
          done
          echo "Hex.pm indexed mailglass_inbound ${VERSION_INBOUND}."

  wait-for-hexdocs:
    name: Wait for HexDocs build
    runs-on: ubuntu-latest
    needs: [cron-guard, wait-for-index]
    if: ${{ needs.cron-guard.outputs.should_run == 'true' }}
    timeout-minutes: 12
    env:
      VERSION_CORE: ${{ needs.cron-guard.outputs.version_core }}
      VERSION_ADMIN: ${{ needs.cron-guard.outputs.version_admin }}
      VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
    steps:
      - name: Wait for mailglass HexDocs
        run: |
          DEADLINE=$(( SECONDS + 600 ))
          until curl -fsI "https://hexdocs.pm/mailglass/${VERSION_CORE}/" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: HexDocs did not build mailglass ${VERSION_CORE} within 10 minutes."
              exit 1
            fi
            echo "Waiting for HexDocs to build mailglass ${VERSION_CORE}..."
            sleep 60
          done
          echo "HexDocs built mailglass ${VERSION_CORE}."
      - name: Wait for mailglass_admin HexDocs
        run: |
          DEADLINE=$(( SECONDS + 600 ))
          until curl -fsI "https://hexdocs.pm/mailglass_admin/${VERSION_ADMIN}/" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: HexDocs did not build mailglass_admin ${VERSION_ADMIN} within 10 minutes."
              exit 1
            fi
            echo "Waiting for HexDocs to build mailglass_admin ${VERSION_ADMIN}..."
            sleep 60
          done
          echo "HexDocs built mailglass_admin ${VERSION_ADMIN}."
      - name: Wait for mailglass_inbound HexDocs
        run: |
          DEADLINE=$(( SECONDS + 600 ))
          until curl -fsI "https://hexdocs.pm/mailglass_inbound/${VERSION_INBOUND}/" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: HexDocs did not build mailglass_inbound ${VERSION_INBOUND} within 10 minutes."
              exit 1
            fi
            echo "Waiting for HexDocs to build mailglass_inbound ${VERSION_INBOUND}..."
            sleep 60
          done
          echo "HexDocs built mailglass_inbound ${VERSION_INBOUND}."

  consumer-install:
    name: Consumer install (Phoenix host)
    # Keep this job aligned with the committed repo-local proof in
    # test/mailglass/install/install_first_preview_smoke_test.exs:
    # add deps -> install -> compile -> boot -> GET /dev/mail/.
    # This remains the canonical release-window gate. The deeper Ecto-backed
    # "first send" proof stays repo-local and guide-backed so the fast smoke
    # path can preserve a quick 60-minute revert decision loop.
    runs-on: ubuntu-latest
    # cron-guard listed explicitly: GitHub Actions `needs.<job>.outputs`
    # propagates only through DIRECT dependencies, not transitively. Without
    # cron-guard here, VERSION resolved to empty and consumer-install ran
    # `mix deps.get` against `{:mailglass, "== "}` (invalid).
    needs: [cron-guard, wait-for-hexdocs]
    if: ${{ needs.cron-guard.outputs.should_run == 'true' }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VERSION_CORE: ${{ needs.cron-guard.outputs.version_core }}
      VERSION_ADMIN: ${{ needs.cron-guard.outputs.version_admin }}
      VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
      VERSION: ${{ needs.cron-guard.outputs.version_core }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.cron-guard.outputs.release_ref }}
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
      - name: Check published sibling compatibility
        id: inbound-compat
        run: |
          INFO_ADMIN=$(mix hex.info mailglass_admin "${VERSION_ADMIN}" 2>&1) || {
            echo "mailglass_admin ${VERSION_ADMIN} is not available on Hex.pm."
            exit 1
          }
          echo "${INFO_ADMIN}"

          INFO=$(mix hex.info mailglass_inbound "${VERSION_INBOUND}" 2>&1) || {
            echo "mailglass_inbound ${VERSION_INBOUND} is not available on Hex.pm."
            exit 1
          }
          echo "${INFO}"

          # ~>-aware compatibility check: matches both the legacy exact form
          # (mailglass == X.Y.Z) and the loosened sibling-pin form
          # (mailglass ~> ... and >= ...) introduced by the Phase 125 pin
          # loosening (LD-2). Anchored on the `mailglass` dep name to avoid
          # false matches on `mailglass_inbound` or `mailglass_admin` lines.
          if echo "${INFO}" | grep -E "^[[:space:]]*mailglass (~> 2\\.0|== 2\\.[0-9]+\\.[0-9]+|>= 2\\.0\\.0)" >/dev/null; then
            echo "mailglass_inbound ${VERSION_INBOUND} has a recognized compatible mailglass constraint for ${VERSION}."
          else
            echo "mailglass_inbound ${VERSION_INBOUND} has no recognized compatible mailglass constraint for ${VERSION}."
            exit 1
          fi
      - name: Run consumer-install smoke (published Hex versions)
        # Shared body with the PR-time `Installer Host Smoke` job in ci.yml —
        # phx.new -> install -> OPS-01 guard -> compile --warnings-as-errors ->
        # boot -> GET /dev/mail/. Here DEP_MODE=hex pins the published versions.
        env:
          DEP_MODE: hex
          WORK_DIR: ${{ runner.temp }}
          VERSION: ${{ needs.cron-guard.outputs.version_core }}
          VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
          INCLUDE_INBOUND: true
        run: bash scripts/consumer_install_smoke.sh

  published-trust-journey:
    name: Published-version trust journey
    runs-on: ubuntu-latest
    needs: [cron-guard, consumer-install]
    if: ${{ needs.cron-guard.outputs.should_run == 'true' }}
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      VERSION_CORE: ${{ needs.cron-guard.outputs.version_core }}
      VERSION_ADMIN: ${{ needs.cron-guard.outputs.version_admin }}
      VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
      MAILGLASS_EXPECTED_CORE_VERSION: ${{ needs.cron-guard.outputs.version_core }}
      MAILGLASS_EXPECTED_ADMIN_VERSION: ${{ needs.cron-guard.outputs.version_admin }}
      MAILGLASS_EXPECTED_INBOUND_VERSION: ${{ needs.cron-guard.outputs.version_inbound }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.cron-guard.outputs.release_ref }}
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Install deps
        run: mix deps.get
      - name: Build disposable host with exact Hex siblings
        env:
          HOST_ROOT: ${{ runner.temp }}/mailglass-published-host-${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf "${HOST_ROOT}"
          cp -R reference/host_app "${HOST_ROOT}"
          rm -rf "${HOST_ROOT}/deps" "${HOST_ROOT}/_build" "${HOST_ROOT}/mix.lock"
          export CORE_DEP="{:mailglass, \"== ${VERSION_CORE}\"}"
          export ADMIN_DEP="{:mailglass_admin, \"== ${VERSION_ADMIN}\"}"
          export INBOUND_DEP="{:mailglass_inbound, \"== ${VERSION_INBOUND}\"}"
          cd "${HOST_ROOT}"
          elixir -e '
            source = File.read!("mix.exs")

            exact = [
              {~r/\{:mailglass,\s*"[^"]+"\}/, System.fetch_env!("CORE_DEP")},
              {~r/\{:mailglass_admin,\s*"[^"]+"\}/, System.fetch_env!("ADMIN_DEP")},
              {~r/\{:mailglass_inbound,\s*"[^"]+"\}/, System.fetch_env!("INBOUND_DEP")}
            ]

            updated =
              Enum.reduce(exact, source, fn {pattern, replacement}, content ->
                if length(Regex.scan(pattern, content)) != 1,
                  do: raise("expected exactly one sibling dependency for #{inspect(pattern)}")

                Regex.replace(pattern, content, replacement)
              end)

            File.write!("mix.exs", updated)
          '
          if grep -Eq '^[[:space:]]*config :swoosh, :api_client,' config/runtime.exs; then
            echo "Disposable host already defines a Swoosh API client; refusing an ambiguous override."
            exit 1
          fi
          printf '\n# Fresh --no-mailer adopter hosts do not resolve an HTTP client.\nconfig :swoosh, :api_client, false\n' >> config/runtime.exs
          MIX_ENV=dev mix deps.get
          bash "${GITHUB_WORKSPACE}/scripts/check_clean_baseline_hex_only.sh" mix.lock
          MIX_ENV=dev mix compile --warnings-as-errors
          rm -rf "${GITHUB_WORKSPACE}/reference/host_app/_build"
          ln -s "${HOST_ROOT}/_build" "${GITHUB_WORKSPACE}/reference/host_app/_build"
      - name: Boot disposable exact-Hex host and run nonvisual compatibility gate
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/mailglass_published_host
          HOST_ROOT: ${{ runner.temp }}/mailglass-published-host-${{ github.run_id }}
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          until pg_isready -h localhost -U postgres; do sleep 1; done
          cd "${HOST_ROOT}"
          MIX_ENV=dev mix ecto.create --quiet
          MIX_ENV=dev mix run --no-start -e '
            expected = %{
              mailglass: System.fetch_env!("VERSION_CORE"),
              mailglass_admin: System.fetch_env!("VERSION_ADMIN"),
              mailglass_inbound: System.fetch_env!("VERSION_INBOUND")
            }

            Enum.each(expected, fn {app, version} ->
              case Application.load(app) do
                :ok -> :ok
                {:error, {:already_loaded, ^app}} -> :ok
              end

              actual = Application.spec(app, :vsn) |> List.to_string()
              if actual != version, do: raise("#{app} version mismatch: #{actual} != #{version}")
            end)

            {:ok, _started} = Application.ensure_all_started(:mailglass_reference_host)
            %{rows: [[1]]} = MailglassReferenceHost.Repo.query!("SELECT 1")
            IO.puts("Exact-Hex host booted with core, admin, and inbound compatibility loaded.")
          '
      - name: Execute 20-stage exact-Hex generated-host proof
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/mailglass_generated_ecto_host_published_${{ github.run_id }}
          MAILGLASS_PACKAGE_MODE: exact_hex
          MAILGLASS_EXACT_CORE_VERSION: ${{ needs.cron-guard.outputs.version_core }}
          MAILGLASS_EXACT_ADMIN_VERSION: ${{ needs.cron-guard.outputs.version_admin }}
          MAILGLASS_EXACT_INBOUND_VERSION: ${{ needs.cron-guard.outputs.version_inbound }}
          MAILGLASS_GENERATED_HOST_CHECKPOINT_OUT: ${{ github.workspace }}/tmp/published-adoption-evidence/generated-host-checkpoint.txt
        run: |
          set -euo pipefail
          until pg_isready -h localhost -U postgres; do sleep 1; done
          bash scripts/generated_ecto_host_proof.sh
      - name: Execute exact-Hex trust journey
        env:
          HOST_ROOT: ${{ runner.temp }}/mailglass-published-host-${{ github.run_id }}
        run: |
          set -euo pipefail
          export MAILGLASS_REFERENCE_HOST_PACKAGE_MODE=prepublication
          export MAILGLASS_CORE_WORKSPACE_EBIN="${HOST_ROOT}/_build/dev/lib/mailglass/ebin"
          export MAILGLASS_INBOUND_WORKSPACE_EBIN="${HOST_ROOT}/_build/dev/lib/mailglass_inbound/ebin"
          test -d "$MAILGLASS_CORE_WORKSPACE_EBIN"
          test -d "$MAILGLASS_INBOUND_WORKSPACE_EBIN"
          mix verify.reference_host.journey --host-root "${HOST_ROOT}"
      - name: Validate trust checkpoint contract
        run: |
          set -euo pipefail
          bash scripts/check_trust_runner_checkpoint.sh --require-completed
          evidence_dir=tmp/published-adoption-evidence
          mkdir -p "$evidence_dir"
          cp tmp/mailglass_trust_runner/checkpoint.json "$evidence_dir/trust-runner-checkpoint.json"
          test -s "$evidence_dir/generated-host-checkpoint.txt"
          test -s "$evidence_dir/trust-runner-checkpoint.json"
          (
            cd "$evidence_dir"
            shasum -a 256 generated-host-checkpoint.txt trust-runner-checkpoint.json > SHA256SUMS
          )
          [ "$(wc -l < "$evidence_dir/SHA256SUMS" | tr -d ' ')" -eq 2 ]
      - name: Upload published adoption evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: published-adoption-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: tmp/published-adoption-evidence

  retracted-check:
    name: Verify package not retracted
    runs-on: ubuntu-latest
    needs: [cron-guard, consumer-install]
    if: ${{ needs.cron-guard.outputs.should_run == 'true' }}
    timeout-minutes: 5
    env:
      VERSION_CORE: ${{ needs.cron-guard.outputs.version_core }}
      VERSION_ADMIN: ${{ needs.cron-guard.outputs.version_admin }}
      VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.cron-guard.outputs.release_ref }}
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Check mailglass not retired
        run: |
          INFO=$(mix hex.info mailglass "${VERSION_CORE}" 2>&1)
          echo "${INFO}"
          if echo "${INFO}" | grep -F "Retired"; then
            echo "Smoke failed: mailglass ${VERSION_CORE} is retired between publish and smoke."
            exit 1
          fi
      - name: Check mailglass_admin not retired
        run: |
          INFO=$(mix hex.info mailglass_admin "${VERSION_ADMIN}" 2>&1)
          echo "${INFO}"
          if echo "${INFO}" | grep -F "Retired"; then
            echo "Smoke failed: mailglass_admin ${VERSION_ADMIN} is retired between publish and smoke."
            exit 1
          fi
      - name: Check mailglass_inbound not retracted
        run: |
          INFO=$(mix hex.info mailglass_inbound "${VERSION_INBOUND}" 2>&1)
          echo "${INFO}"
          if echo "${INFO}" | grep -F "Retired"; then
            echo "Smoke failed: mailglass_inbound ${VERSION_INBOUND} is retired between publish and smoke."
            exit 1
          fi

  notify-on-failure:
    name: Open issue on smoke failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    needs: [cron-guard, wait-for-index, wait-for-hexdocs, consumer-install, published-trust-journey, retracted-check]
    if: failure() && needs.cron-guard.outputs.should_run == 'true'
    continue-on-error: true
    steps:
      - name: Add post-publish-smoke failure summary
        run: |
          {
            echo "## post-publish-smoke failure"
            echo
            echo "Post-publish smoke failed for v${{ needs.cron-guard.outputs.version_core }}."
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update post-publish-smoke failure issue
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = "publish-smoke-failed";
            const issueTitle = "publish-smoke failure tracker";
            const version = "${{ needs.cron-guard.outputs.version_core }}";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `post-publish-smoke failure detected for v${version}.`,
              "",
              `- Workflow run: ${runUrl}`,
              `- Ref: \`${context.ref}\``,
              `- SHA: \`${context.sha}\``,
              `- Trigger: \`${context.eventName}\``
            ].join("\n");

            try {
              await github.rest.issues.getLabel({owner, repo, name: label});
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: "B60205",
                  description: "Tracked failures for post-publish-smoke workflow"
                });
              } else {
                throw error;
              }
            }

            const {data: openIssues} = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 100
            });

            const existing = openIssues.find((issue) => issue.title === issueTitle);

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body,
                labels: [label]
              });
            }

  close-publish-smoke-tracker-on-success:
    name: Close issue on smoke success
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    needs: [cron-guard, wait-for-index, wait-for-hexdocs, consumer-install, published-trust-journey, retracted-check]
    if: >-
      ${{
        needs.cron-guard.outputs.should_run == 'true' &&
        needs.wait-for-index.result == 'success' &&
        needs.wait-for-hexdocs.result == 'success' &&
        needs.consumer-install.result == 'success' &&
        needs.published-trust-journey.result == 'success' &&
        needs.retracted-check.result == 'success'
      }}
    continue-on-error: true
    steps:
      - name: Close post-publish-smoke failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = "publish-smoke-failed";
            const issueTitle = "publish-smoke failure tracker";
            const version = "${{ needs.cron-guard.outputs.version_core }}";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const artifactName = `published-adoption-evidence-${context.runId}`;

            const {data: openIssues} = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 100
            });

            const existing = openIssues.find((issue) => issue.title === issueTitle);

            if (!existing) {
              core.info("No open post-publish-smoke failure tracker found; nothing to close.");
              return;
            }

            const body = [
              `Resolved: post-publish-smoke green for v${version}.`,
              "",
              `- Workflow run: ${runUrl}`,
              `- Ref: \`${context.ref}\``,
              `- SHA: \`${context.sha}\``,
              `- OPS-01 guard: \`consumer-install\` succeeded`,
              `- EVID-03 journey: \`published-trust-journey\` succeeded`,
              `- Evidence artifact: \`${artifactName}\``
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: existing.number,
              state: "closed",
              state_reason: "completed"
            });
