name: post-publish-smoke

on:
  release:
    types: [published]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    # Trigger contract (per Phase 27, D-27-05/06/07):
    #   - release: types: [published] is the CANONICAL release-day path; version
    #     is resolved from `github.event.release.tag_name`.
    #   - workflow_dispatch is FALLBACK-ONLY for manual recovery or rehearsal;
    #     supply the published tag (e.g. `mailglass-vX.Y.Z`) via `inputs.tag`.
    #   - schedule (`cron`) is an INDEPENDENT health-check that resolves the
    #     latest published release on its own; it must not gate release-day
    #     correctness.
    inputs:
      tag:
        description: "Tag to smoke-test (e.g. mailglass-vX.Y.Z); fallback path only"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: post-publish-smoke-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  cron-guard:
    name: Cron 7-day window guard
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      version: ${{ steps.guard.outputs.version }}
      release_ref: ${{ steps.guard.outputs.release_ref }}
      version_inbound: ${{ steps.read-inbound-version.outputs.version_inbound }}
    steps:
      - name: Determine if smoke should run
        id: guard
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const normalizeVersion = (value) => {
              if (!value) return "";
              const raw = String(value).trim();
              const match = raw.match(/(?:^|[-/])v?(\d+\.\d+\.\d+(?:[-\w.+]+)?)/);
              return match ? match[1] : raw.replace(/^v/, "");
            };
            const isCoreReleaseTag = (value) =>
              /^mailglass-v\d+\.\d+\.\d+(?:[-\w.+]+)?$/.test(String(value || "").trim());

            const eventName = context.eventName;

            if (eventName === 'release') {
              const tagName = context.payload?.release?.tag_name || "";
              if (!isCoreReleaseTag(tagName)) {
                core.setOutput('should_run', 'false');
                core.setOutput('version', '');
                core.setOutput('release_ref', '');
                core.info(`Skipping non-core release tag '${tagName}'.`);
                return;
              }
              const version = normalizeVersion(tagName);
              if (version) {
                core.setOutput('should_run', 'true');
                core.setOutput('version', version);
                core.setOutput('release_ref', tagName);
                core.info(`Smoke triggered by release event; should_run=true; version='${version}'`);
                return;
              }
              core.setOutput('should_run', 'false');
              core.setOutput('version', '');
              core.setOutput('release_ref', '');
              core.warning(`Release event with unparseable tag_name='${tagName}'; skipping smoke.`);
              return;
            }

            const inputTag = context.payload?.inputs?.tag || "";
            const inputVersion = normalizeVersion(inputTag);

            if (eventName === 'workflow_dispatch' && inputVersion && isCoreReleaseTag(inputTag)) {
              core.setOutput('should_run', 'true');
              core.setOutput('version', inputVersion);
              core.setOutput('release_ref', inputTag);
              core.info(`Smoke triggered by workflow_dispatch; should_run=true; version='${inputVersion}'`);
              return;
            }

            // Historical note (2026-04-28 rehearsal, archived in
            // .planning/milestones/v0.3-phases/18-ship-v0-3-0/): an older
            // workflow_run-triggered path resolved VERSION=main and stalled on
            // `mix hex.info mailglass main`. Per Phase 27 D-27-05/06: the
            // fallback dispatch path stays tag-based so version resolution is
            // deterministic from the supplied input.

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const {data: releases} = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 20
            });

            const latest = releases.find((release) => isCoreReleaseTag(release.tag_name));

            if (!latest) {
              core.setOutput('should_run', 'false');
              core.setOutput('version', '');
              core.setOutput('release_ref', '');
              core.info('No core package releases found; skipping scheduled smoke.');
              return;
            }
            const releasedAt = new Date(latest.published_at);
            const ageDays = (Date.now() - releasedAt.getTime()) / (1000 * 60 * 60 * 24);
            const version = normalizeVersion(latest.tag_name);

            if (eventName === 'schedule' && ageDays > 7) {
              core.setOutput('should_run', 'false');
              core.setOutput('version', version);
              core.setOutput('release_ref', latest.tag_name);
              core.info(`Latest release ${latest.tag_name} is ${ageDays.toFixed(1)} days old; skipping scheduled smoke.`);
              return;
            }

            if (eventName === 'schedule' && version) {
              const response = await fetch('https://hex.pm/api/packages/mailglass');
              if (!response.ok) {
                core.warning(`Hex API lookup failed with status ${response.status}; skipping scheduled smoke for safety.`);
                core.setOutput('should_run', 'false');
                core.setOutput('version', version);
                core.setOutput('release_ref', latest.tag_name);
                return;
              }

              const hexPackage = await response.json();
              const hexReleases = Array.isArray(hexPackage.releases) ? hexPackage.releases : [];
              const onHex = hexReleases.some((release) => release.version === version);

              if (!onHex) {
                core.setOutput('should_run', 'false');
                core.setOutput('version', version);
                core.setOutput('release_ref', latest.tag_name);
                core.warning(`Latest GitHub release ${latest.tag_name} is not on Hex.pm; skipping scheduled smoke until a public package exists.`);
                return;
              }
            }

            core.setOutput('should_run', 'true');
            core.setOutput('version', version);
            core.setOutput('release_ref', latest.tag_name);
            core.info(`Latest release ${latest.tag_name} is ${ageDays.toFixed(1)} days old; running smoke for v${version}.`);
      - name: Checkout release ref
        if: ${{ steps.guard.outputs.should_run == 'true' && steps.guard.outputs.release_ref != '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ steps.guard.outputs.release_ref }}
      - name: Read mailglass_inbound version
        id: read-inbound-version
        if: ${{ steps.guard.outputs.should_run == 'true' && steps.guard.outputs.release_ref != '' }}
        run: |
          if [ -f mailglass_inbound/mix.exs ]; then
            VERSION_INBOUND=$(grep -E '@version "[0-9]' mailglass_inbound/mix.exs | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            echo "version_inbound=${VERSION_INBOUND}" >> "$GITHUB_OUTPUT"
            echo "Resolved mailglass_inbound version: ${VERSION_INBOUND}"
          else
            echo "version_inbound=" >> "$GITHUB_OUTPUT"
            echo "mailglass_inbound/mix.exs not present at this ref; downstream inbound steps will skip."
          fi

  wait-for-index:
    name: Wait for Hex.pm index
    runs-on: ubuntu-latest
    needs: [cron-guard]
    if: ${{ needs.cron-guard.outputs.should_run == 'true' }}
    timeout-minutes: 8
    steps:
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - name: Wait for mailglass index
        env:
          VERSION: ${{ needs.cron-guard.outputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "No version resolved; skipping."
            exit 0
          fi
          DEADLINE=$(( SECONDS + 300 ))
          until mix hex.info mailglass "${VERSION}" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: Hex.pm did not index mailglass ${VERSION} within 5 minutes."
              exit 1
            fi
            echo "Waiting for Hex.pm to index mailglass ${VERSION}..."
            sleep 30
          done
          echo "Hex.pm indexed mailglass ${VERSION}."
      - name: Wait for mailglass_admin index
        env:
          VERSION: ${{ needs.cron-guard.outputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "No version resolved; skipping."
            exit 0
          fi
          DEADLINE=$(( SECONDS + 300 ))
          until mix hex.info mailglass_admin "${VERSION}" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: Hex.pm did not index mailglass_admin ${VERSION} within 5 minutes."
              exit 1
            fi
            echo "Waiting for Hex.pm to index mailglass_admin ${VERSION}..."
            sleep 30
          done
          echo "Hex.pm indexed mailglass_admin ${VERSION}."
      - name: Wait for mailglass_inbound index
        env:
          VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
        run: |
          if [ -z "${VERSION_INBOUND}" ]; then
            echo "No inbound version resolved; skipping."
            exit 0
          fi
          DEADLINE=$(( SECONDS + 300 ))
          until mix hex.info mailglass_inbound "${VERSION_INBOUND}" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: Hex.pm did not index mailglass_inbound ${VERSION_INBOUND} within 5 minutes."
              exit 1
            fi
            echo "Waiting for Hex.pm to index mailglass_inbound ${VERSION_INBOUND}..."
            sleep 30
          done
          echo "Hex.pm indexed mailglass_inbound ${VERSION_INBOUND}."

  wait-for-hexdocs:
    name: Wait for HexDocs build
    runs-on: ubuntu-latest
    needs: [cron-guard, wait-for-index]
    if: ${{ needs.cron-guard.outputs.should_run == 'true' }}
    timeout-minutes: 12
    steps:
      - name: Wait for mailglass HexDocs
        env:
          VERSION: ${{ needs.cron-guard.outputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "No version resolved; skipping."
            exit 0
          fi
          DEADLINE=$(( SECONDS + 600 ))
          until curl -fsI "https://hexdocs.pm/mailglass/${VERSION}/" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: HexDocs did not build mailglass ${VERSION} within 10 minutes."
              exit 1
            fi
            echo "Waiting for HexDocs to build mailglass ${VERSION}..."
            sleep 60
          done
          echo "HexDocs built mailglass ${VERSION}."
      - name: Wait for mailglass_admin HexDocs
        env:
          VERSION: ${{ needs.cron-guard.outputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "No version resolved; skipping."
            exit 0
          fi
          DEADLINE=$(( SECONDS + 600 ))
          until curl -fsI "https://hexdocs.pm/mailglass_admin/${VERSION}/" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: HexDocs did not build mailglass_admin ${VERSION} within 10 minutes."
              exit 1
            fi
            echo "Waiting for HexDocs to build mailglass_admin ${VERSION}..."
            sleep 60
          done
          echo "HexDocs built mailglass_admin ${VERSION}."
      - name: Wait for mailglass_inbound HexDocs
        env:
          VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
        run: |
          if [ -z "${VERSION_INBOUND}" ]; then
            echo "No inbound version resolved; skipping."
            exit 0
          fi
          DEADLINE=$(( SECONDS + 600 ))
          until curl -fsI "https://hexdocs.pm/mailglass_inbound/${VERSION_INBOUND}/" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: HexDocs did not build mailglass_inbound ${VERSION_INBOUND} within 10 minutes."
              exit 1
            fi
            echo "Waiting for HexDocs to build mailglass_inbound ${VERSION_INBOUND}..."
            sleep 60
          done
          echo "HexDocs built mailglass_inbound ${VERSION_INBOUND}."

  consumer-install:
    name: Consumer install (Phoenix host)
    # Keep this job aligned with the committed repo-local proof in
    # test/mailglass/install/install_first_preview_smoke_test.exs:
    # add deps -> install -> compile -> boot -> GET /dev/mail/.
    # This remains the canonical release-window gate. The deeper Ecto-backed
    # "first send" proof stays repo-local and guide-backed so the fast smoke
    # path can preserve a quick 60-minute revert decision loop.
    runs-on: ubuntu-latest
    # cron-guard listed explicitly: GitHub Actions `needs.<job>.outputs`
    # propagates only through DIRECT dependencies, not transitively. Without
    # cron-guard here, VERSION resolved to empty and consumer-install ran
    # `mix deps.get` against `{:mailglass, "== "}` (invalid).
    needs: [cron-guard, wait-for-hexdocs]
    if: ${{ needs.cron-guard.outputs.should_run == 'true' }}
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.cron-guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
      - name: Install hex + rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Check published inbound compatibility
        id: inbound-compat
        env:
          VERSION: ${{ needs.cron-guard.outputs.version }}
          VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
        run: |
          if [ -z "${VERSION_INBOUND}" ]; then
            echo "include_inbound=false" >> "$GITHUB_OUTPUT"
            echo "No inbound version resolved; consumer install will skip inbound."
            exit 0
          fi

          INFO=$(mix hex.info mailglass_inbound "${VERSION_INBOUND}" 2>&1)
          echo "${INFO}"

          if echo "${INFO}" | grep -F "mailglass == ${VERSION}" >/dev/null; then
            echo "include_inbound=true" >> "$GITHUB_OUTPUT"
            echo "mailglass_inbound ${VERSION_INBOUND} is compatible with mailglass ${VERSION}."
          else
            echo "include_inbound=false" >> "$GITHUB_OUTPUT"
            echo "Skipping inbound consumer dependency: mailglass_inbound ${VERSION_INBOUND} is not compatible with mailglass ${VERSION}."
          fi
      - name: Install phx_new archive
        run: mix archive.install hex phx_new --force
      - name: Generate Phoenix host project
        working-directory: ${{ runner.temp }}
        run: |
          mix phx.new sandbox --module Sandbox --app sandbox --no-ecto --no-mailer --install
      - name: Add mailglass deps
        working-directory: ${{ runner.temp }}/sandbox
        env:
          VERSION: ${{ needs.cron-guard.outputs.version }}
          VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
          INCLUDE_INBOUND: ${{ steps.inbound-compat.outputs.include_inbound }}
        run: |
          elixir -e '
            version = System.get_env("VERSION")
            version_inbound = System.get_env("VERSION_INBOUND")
            include_inbound = System.get_env("INCLUDE_INBOUND") == "true"
            mix_path = "mix.exs"
            content = File.read!(mix_path)
            inbound_entry =
              if include_inbound && version_inbound && version_inbound != "" do
                "      {:mailglass_inbound, \"== #{version_inbound}\"},\n"
              else
                ""
              end
            entries = "      {:mailglass, \"== #{version}\"},\n      {:mailglass_admin, \"== #{version}\"},\n" <> inbound_entry
            updated = String.replace(content, ~r/(defp deps do\n\s*\[\n)/, "\\1" <> entries, global: false)
            File.write!(mix_path, updated)
          '
          grep -F "mailglass" mix.exs
      - name: mix deps.get
        working-directory: ${{ runner.temp }}/sandbox
        run: mix deps.get
      - name: Run mix mailglass.install
        working-directory: ${{ runner.temp }}/sandbox
        run: mix mailglass.install
      - name: Compile, fail on warnings
        working-directory: ${{ runner.temp }}/sandbox
        run: |
          set -o pipefail
          mix compile --warnings-as-errors 2>&1 | tee compile.log
          if grep -F "UndefinedFunctionError" compile.log; then
            echo "Smoke failed: UndefinedFunctionError detected in compile output (literal G-1 regression on published artifact)."
            exit 1
          fi
      - name: Boot endpoint and curl /dev/mail/
        working-directory: ${{ runner.temp }}/sandbox
        env:
          MIX_ENV: dev
        run: |
          mix phx.server &
          SERVER_PID=$!
          # shellcheck disable=SC2064
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          DEADLINE=$(( SECONDS + 30 ))
          until curl -fsI http://localhost:4000/dev/mail/ >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke failed: endpoint did not respond on /dev/mail/ within 30s."
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done

          STATUS=$(curl -fs -o /dev/null -w "%{http_code}" http://localhost:4000/dev/mail/)
          echo "GET /dev/mail/ → HTTP ${STATUS}"
          if [ "${STATUS}" != "200" ]; then
            echo "Smoke failed: /dev/mail/ returned ${STATUS}, expected 200."
            exit 1
          fi
          echo "Endpoint smoke passed."

  retracted-check:
    name: Verify package not retracted
    runs-on: ubuntu-latest
    needs: [cron-guard, consumer-install]
    if: ${{ needs.cron-guard.outputs.should_run == 'true' }}
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.cron-guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - name: Check mailglass not retired
        run: |
          if [ -z "${VERSION}" ]; then
            echo "No version resolved; skipping."
            exit 0
          fi
          INFO=$(mix hex.info mailglass "${VERSION}" 2>&1)
          echo "${INFO}"
          if echo "${INFO}" | grep -F "Retired"; then
            echo "Smoke failed: mailglass ${VERSION} is retired between publish and smoke."
            exit 1
          fi
      - name: Check mailglass_admin not retired
        run: |
          if [ -z "${VERSION}" ]; then
            echo "No version resolved; skipping."
            exit 0
          fi
          INFO=$(mix hex.info mailglass_admin "${VERSION}" 2>&1)
          echo "${INFO}"
          if echo "${INFO}" | grep -F "Retired"; then
            echo "Smoke failed: mailglass_admin ${VERSION} is retired between publish and smoke."
            exit 1
          fi
      - name: Check mailglass_inbound not retracted
        env:
          VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
        run: |
          if [ -z "${VERSION_INBOUND}" ]; then
            echo "No inbound version resolved; skipping."
            exit 0
          fi
          INFO=$(mix hex.info mailglass_inbound "${VERSION_INBOUND}" 2>&1)
          echo "${INFO}"
          if echo "${INFO}" | grep -F "Retired"; then
            echo "Smoke failed: mailglass_inbound ${VERSION_INBOUND} is retired between publish and smoke."
            exit 1
          fi

  notify-on-failure:
    name: Open issue on smoke failure
    runs-on: ubuntu-latest
    needs: [cron-guard, wait-for-index, wait-for-hexdocs, consumer-install, retracted-check]
    if: failure() && needs.cron-guard.outputs.should_run == 'true'
    continue-on-error: true
    steps:
      - name: Add post-publish-smoke failure summary
        run: |
          {
            echo "## post-publish-smoke failure"
            echo
            echo "Post-publish smoke failed for v${{ needs.cron-guard.outputs.version }}."
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update post-publish-smoke failure issue
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = "publish-smoke-failed";
            const issueTitle = "publish-smoke failure tracker";
            const version = "${{ needs.cron-guard.outputs.version }}";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `post-publish-smoke failure detected for v${version}.`,
              "",
              `- Workflow run: ${runUrl}`,
              `- Ref: \`${context.ref}\``,
              `- SHA: \`${context.sha}\``,
              `- Trigger: \`${context.eventName}\``
            ].join("\n");

            try {
              await github.rest.issues.getLabel({owner, repo, name: label});
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: "B60205",
                  description: "Tracked failures for post-publish-smoke workflow"
                });
              } else {
                throw error;
              }
            }

            const {data: openIssues} = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 100
            });

            const existing = openIssues.find((issue) => issue.title === issueTitle);

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body,
                labels: [label]
              });
            }
