name: post-publish-smoke

on:
  release:
    types: [published]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    # Trigger contract (per Phase 27, D-27-05/06/07):
    #   - release: types: [published] is the CANONICAL release-day path; version
    #     is resolved from `github.event.release.tag_name`.
    #   - workflow_dispatch is FALLBACK-ONLY for manual recovery or rehearsal;
    #     supply the published tag (e.g. `mailglass-vX.Y.Z`) via `inputs.tag`.
    #   - schedule (`cron`) is an INDEPENDENT health-check that resolves the
    #     latest published release on its own; it must not gate release-day
    #     correctness.
    inputs:
      tag:
        description: "Tag to smoke-test (e.g. mailglass-vX.Y.Z); fallback path only"
        required: false
        type: string
      core_version:
        description: "Exact published mailglass version from an immutable completed target"
        required: false
        type: string
      admin_version:
        description: "Exact published mailglass_admin version from an immutable completed target"
        required: false
        type: string
      inbound_version:
        description: "Exact published mailglass_inbound version from an immutable completed target"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mailglass-linked-release-smoke
  cancel-in-progress: false

jobs:
  resolve-completed-target:
    name: Resolve immutable completed release target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      completed: ${{ steps.target.outputs.completed }}
      authorized: ${{ steps.target.outputs.authorized }}
      core: ${{ steps.target.outputs.core }}
      admin: ${{ steps.target.outputs.admin }}
      inbound: ${{ steps.target.outputs.inbound }}
      tag_sha: ${{ steps.target.outputs.tag_sha }}
    steps:
      - name: Checkout immutable release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.sha }}
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Resolve completed target versions
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          command=completed-versions
          if [ "$EVENT_NAME" != "schedule" ]; then command=authorized-versions; fi
          if mix run --no-start --require scripts/release_policy.exs -e 'Mailglass.ReleasePolicy.cli(System.argv())' -- "$command" .planning/release-target.json >> "$GITHUB_OUTPUT"; then
            exit 0
          fi
          echo "completed=false" >> "$GITHUB_OUTPUT"

  cron-guard:
    name: Cron 7-day window guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve-completed-target]
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      version: ${{ steps.guard.outputs.version }}
      release_ref: ${{ steps.guard.outputs.release_ref }}
      version_inbound: ${{ needs.resolve-completed-target.outputs.inbound }}
      version_admin: ${{ needs.resolve-completed-target.outputs.admin }}
    steps:
      # Release/scheduled smoke must resolve all package versions from an
      # immutable completed target; never from package latest. The policy owner
      # validates this through `validate_completed_target` before any consumer
      # install uses the values below.
      - name: Determine if smoke should run
        id: guard
        env:
          COMPLETED: ${{ needs.resolve-completed-target.outputs.completed }}
          AUTHORIZED: ${{ needs.resolve-completed-target.outputs.authorized }}
          COMPLETED_CORE: ${{ needs.resolve-completed-target.outputs.core }}
          COMPLETED_ADMIN: ${{ needs.resolve-completed-target.outputs.admin }}
          COMPLETED_INBOUND: ${{ needs.resolve-completed-target.outputs.inbound }}
          COMPLETED_TAG_SHA: ${{ needs.resolve-completed-target.outputs.tag_sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const eventName = context.eventName;

            if (eventName === 'schedule' && process.env.COMPLETED !== 'true') {
              core.setOutput('should_run', 'false');
              core.setOutput('version', '');
              core.setOutput('release_ref', '');
              core.info('No immutable completed release target; skipping smoke.');
              return;
            }

            const completedCore = process.env.COMPLETED_CORE || '';
            const completedAdmin = process.env.COMPLETED_ADMIN || '';
            const completedInbound = process.env.COMPLETED_INBOUND || '';
            if (![completedCore, completedAdmin, completedInbound].every((version) => /^\d+\.\d+\.\d+$/.test(version))) {
              core.setFailed('Immutable completed target did not provide three exact stable versions.');
              return;
            }

            const requestedRef = context.payload?.release?.tag_name || context.payload?.inputs?.tag || '';
            if (eventName === 'release' || eventName === 'workflow_dispatch') {
              if (process.env.AUTHORIZED !== 'true') {
                core.setFailed('Release-day smoke requires an authorized immutable target.');
                return;
              }
              if (requestedRef !== `mailglass-v${completedCore}`) {
                core.setFailed(`Ref '${requestedRef}' does not match immutable completed target mailglass-v${completedCore}.`);
                return;
              }
              core.setOutput('should_run', 'true');
              core.setOutput('version', completedCore);
              core.setOutput('release_ref', requestedRef);
              return;
            }

            if (eventName === 'schedule') {
              core.setOutput('should_run', 'true');
              core.setOutput('version', completedCore);
              core.setOutput('release_ref', process.env.COMPLETED_TAG_SHA);
              return;
            }
            core.setOutput('should_run', 'false');
            core.setOutput('version', '');
            core.setOutput('release_ref', '');
      - name: Checkout release ref
        if: ${{ steps.guard.outputs.should_run == 'true' && steps.guard.outputs.release_ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.guard.outputs.release_ref }}

  wait-for-index:
    name: Wait for Hex.pm index
    runs-on: ubuntu-latest
    needs: [cron-guard]
    if: ${{ needs.cron-guard.outputs.should_run == 'true' }}
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Validate VERSION is semver
        env:
          VERSION: ${{ needs.cron-guard.outputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]]; then
            echo "::error::VERSION='$VERSION' is not valid semver; refusing to run smoke. Check cron-guard version resolution."
            exit 1
          fi
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Wait for mailglass index
        env:
          VERSION: ${{ needs.cron-guard.outputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "No version resolved; skipping."
            exit 0
          fi
          DEADLINE=$(( SECONDS + 300 ))
          until mix hex.info mailglass "${VERSION}" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: Hex.pm did not index mailglass ${VERSION} within 5 minutes."
              exit 1
            fi
            echo "Waiting for Hex.pm to index mailglass ${VERSION}..."
            sleep 30
          done
          echo "Hex.pm indexed mailglass ${VERSION}."
      - name: Wait for mailglass_admin index
        env:
          VERSION: ${{ needs.cron-guard.outputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "No version resolved; skipping."
            exit 0
          fi
          DEADLINE=$(( SECONDS + 300 ))
          until mix hex.info mailglass_admin "${VERSION}" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: Hex.pm did not index mailglass_admin ${VERSION} within 5 minutes."
              exit 1
            fi
            echo "Waiting for Hex.pm to index mailglass_admin ${VERSION}..."
            sleep 30
          done
          echo "Hex.pm indexed mailglass_admin ${VERSION}."
      - name: Wait for mailglass_inbound index
        env:
          VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
        run: |
          if [ -z "${VERSION_INBOUND}" ]; then
            echo "No inbound version resolved; skipping."
            exit 0
          fi
          DEADLINE=$(( SECONDS + 300 ))
          until mix hex.info mailglass_inbound "${VERSION_INBOUND}" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: Hex.pm did not index mailglass_inbound ${VERSION_INBOUND} within 5 minutes."
              exit 1
            fi
            echo "Waiting for Hex.pm to index mailglass_inbound ${VERSION_INBOUND}..."
            sleep 30
          done
          echo "Hex.pm indexed mailglass_inbound ${VERSION_INBOUND}."

  wait-for-hexdocs:
    name: Wait for HexDocs build
    runs-on: ubuntu-latest
    needs: [cron-guard, wait-for-index]
    if: ${{ needs.cron-guard.outputs.should_run == 'true' }}
    timeout-minutes: 12
    steps:
      - name: Wait for mailglass HexDocs
        env:
          VERSION: ${{ needs.cron-guard.outputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "No version resolved; skipping."
            exit 0
          fi
          DEADLINE=$(( SECONDS + 600 ))
          until curl -fsI "https://hexdocs.pm/mailglass/${VERSION}/" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: HexDocs did not build mailglass ${VERSION} within 10 minutes."
              exit 1
            fi
            echo "Waiting for HexDocs to build mailglass ${VERSION}..."
            sleep 60
          done
          echo "HexDocs built mailglass ${VERSION}."
      - name: Wait for mailglass_admin HexDocs
        env:
          VERSION: ${{ needs.cron-guard.outputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "No version resolved; skipping."
            exit 0
          fi
          DEADLINE=$(( SECONDS + 600 ))
          until curl -fsI "https://hexdocs.pm/mailglass_admin/${VERSION}/" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: HexDocs did not build mailglass_admin ${VERSION} within 10 minutes."
              exit 1
            fi
            echo "Waiting for HexDocs to build mailglass_admin ${VERSION}..."
            sleep 60
          done
          echo "HexDocs built mailglass_admin ${VERSION}."
      - name: Wait for mailglass_inbound HexDocs
        env:
          VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
        run: |
          if [ -z "${VERSION_INBOUND}" ]; then
            echo "No inbound version resolved; skipping."
            exit 0
          fi
          DEADLINE=$(( SECONDS + 600 ))
          until curl -fsI "https://hexdocs.pm/mailglass_inbound/${VERSION_INBOUND}/" >/dev/null 2>&1; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Smoke aborted: HexDocs did not build mailglass_inbound ${VERSION_INBOUND} within 10 minutes."
              exit 1
            fi
            echo "Waiting for HexDocs to build mailglass_inbound ${VERSION_INBOUND}..."
            sleep 60
          done
          echo "HexDocs built mailglass_inbound ${VERSION_INBOUND}."

  consumer-install:
    name: Consumer install (Phoenix host)
    # Keep this job aligned with the committed repo-local proof in
    # test/mailglass/install/install_first_preview_smoke_test.exs:
    # add deps -> install -> compile -> boot -> GET /dev/mail/.
    # This remains the canonical release-window gate. The deeper Ecto-backed
    # "first send" proof stays repo-local and guide-backed so the fast smoke
    # path can preserve a quick 60-minute revert decision loop.
    runs-on: ubuntu-latest
    # cron-guard listed explicitly: GitHub Actions `needs.<job>.outputs`
    # propagates only through DIRECT dependencies, not transitively. Without
    # cron-guard here, VERSION resolved to empty and consumer-install ran
    # `mix deps.get` against `{:mailglass, "== "}` (invalid).
    needs: [cron-guard, wait-for-hexdocs]
    if: ${{ needs.cron-guard.outputs.should_run == 'true' }}
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.cron-guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
      - name: Check published inbound compatibility
        id: inbound-compat
        env:
          VERSION: ${{ needs.cron-guard.outputs.version }}
          VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
        run: |
          if [ -z "${VERSION_INBOUND}" ]; then
            echo "Published consumer proof could not resolve mailglass_inbound from the release ref."
            exit 1
          fi

          INFO=$(mix hex.info mailglass_inbound "${VERSION_INBOUND}" 2>&1) || {
            echo "mailglass_inbound ${VERSION_INBOUND} is not available on Hex.pm."
            exit 1
          }
          echo "${INFO}"

          # ~>-aware compatibility check: matches both the legacy exact form
          # (mailglass == X.Y.Z) and the loosened sibling-pin form
          # (mailglass ~> ... and >= ...) introduced by the Phase 125 pin
          # loosening (LD-2). Anchored on the `mailglass` dep name to avoid
          # false matches on `mailglass_inbound` or `mailglass_admin` lines.
          if echo "${INFO}" | grep -E "^[[:space:]]*mailglass (~> 2\\.0|== 2\\.[0-9]+\\.[0-9]+|>= 2\\.0\\.0)" >/dev/null; then
            echo "mailglass_inbound ${VERSION_INBOUND} has a recognized compatible mailglass constraint for ${VERSION}."
          else
            echo "mailglass_inbound ${VERSION_INBOUND} has no recognized compatible mailglass constraint for ${VERSION}."
            exit 1
          fi
      - name: Run consumer-install smoke (published Hex versions)
        # Shared body with the PR-time `Installer Host Smoke` job in ci.yml —
        # phx.new -> install -> OPS-01 guard -> compile --warnings-as-errors ->
        # boot -> GET /dev/mail/. Here DEP_MODE=hex pins the published versions.
        env:
          DEP_MODE: hex
          WORK_DIR: ${{ runner.temp }}
          VERSION: ${{ needs.cron-guard.outputs.version }}
          VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
          INCLUDE_INBOUND: true
        run: bash scripts/consumer_install_smoke.sh

  published-trust-journey:
    name: Published-version trust journey
    runs-on: ubuntu-latest
    needs: [cron-guard, consumer-install]
    if: ${{ needs.cron-guard.outputs.should_run == 'true' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.cron-guard.outputs.release_ref }}
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Install deps
        run: mix deps.get
      - name: Wait for postgres + create test DB
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres; do sleep 1; done
          mix ecto.create -r Mailglass.TestRepo --quiet
      - name: Build reference host (dev) so the journey can load sibling beams
        working-directory: reference/host_app
        env:
          MIX_ENV: dev
        run: mix deps.get && mix compile
      - name: Guard reference host resolves siblings from Hex
        working-directory: reference/host_app
        run: bash ../../scripts/check_clean_baseline_hex_only.sh
      - name: Run published reference-host trust journey
        run: mix verify.reference_host.journey --host-root reference/host_app
      - name: Validate trust checkpoint contract
        run: bash scripts/check_trust_runner_checkpoint.sh
      - name: Upload trust-runner published artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trust-runner-published-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: tmp/mailglass_trust_runner/checkpoint.json

  retracted-check:
    name: Verify package not retracted
    runs-on: ubuntu-latest
    needs: [cron-guard, consumer-install]
    if: ${{ needs.cron-guard.outputs.should_run == 'true' }}
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.cron-guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Check mailglass not retired
        run: |
          if [ -z "${VERSION}" ]; then
            echo "No version resolved; skipping."
            exit 0
          fi
          INFO=$(mix hex.info mailglass "${VERSION}" 2>&1)
          echo "${INFO}"
          if echo "${INFO}" | grep -F "Retired"; then
            echo "Smoke failed: mailglass ${VERSION} is retired between publish and smoke."
            exit 1
          fi
      - name: Check mailglass_admin not retired
        run: |
          if [ -z "${VERSION}" ]; then
            echo "No version resolved; skipping."
            exit 0
          fi
          INFO=$(mix hex.info mailglass_admin "${VERSION}" 2>&1)
          echo "${INFO}"
          if echo "${INFO}" | grep -F "Retired"; then
            echo "Smoke failed: mailglass_admin ${VERSION} is retired between publish and smoke."
            exit 1
          fi
      - name: Check mailglass_inbound not retracted
        env:
          VERSION_INBOUND: ${{ needs.cron-guard.outputs.version_inbound }}
        run: |
          if [ -z "${VERSION_INBOUND}" ]; then
            echo "No inbound version resolved; skipping."
            exit 0
          fi
          INFO=$(mix hex.info mailglass_inbound "${VERSION_INBOUND}" 2>&1)
          echo "${INFO}"
          if echo "${INFO}" | grep -F "Retired"; then
            echo "Smoke failed: mailglass_inbound ${VERSION_INBOUND} is retired between publish and smoke."
            exit 1
          fi

  notify-on-failure:
    name: Open issue on smoke failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    needs: [cron-guard, wait-for-index, wait-for-hexdocs, consumer-install, published-trust-journey, retracted-check]
    if: failure() && needs.cron-guard.outputs.should_run == 'true'
    continue-on-error: true
    steps:
      - name: Add post-publish-smoke failure summary
        run: |
          {
            echo "## post-publish-smoke failure"
            echo
            echo "Post-publish smoke failed for v${{ needs.cron-guard.outputs.version }}."
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update post-publish-smoke failure issue
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = "publish-smoke-failed";
            const issueTitle = "publish-smoke failure tracker";
            const version = "${{ needs.cron-guard.outputs.version }}";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `post-publish-smoke failure detected for v${version}.`,
              "",
              `- Workflow run: ${runUrl}`,
              `- Ref: \`${context.ref}\``,
              `- SHA: \`${context.sha}\``,
              `- Trigger: \`${context.eventName}\``
            ].join("\n");

            try {
              await github.rest.issues.getLabel({owner, repo, name: label});
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: "B60205",
                  description: "Tracked failures for post-publish-smoke workflow"
                });
              } else {
                throw error;
              }
            }

            const {data: openIssues} = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 100
            });

            const existing = openIssues.find((issue) => issue.title === issueTitle);

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body,
                labels: [label]
              });
            }

  close-publish-smoke-tracker-on-success:
    name: Close issue on smoke success
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    needs: [cron-guard, wait-for-index, wait-for-hexdocs, consumer-install, published-trust-journey, retracted-check]
    if: >-
      ${{
        needs.cron-guard.outputs.should_run == 'true' &&
        needs.wait-for-index.result == 'success' &&
        needs.wait-for-hexdocs.result == 'success' &&
        needs.consumer-install.result == 'success' &&
        needs.published-trust-journey.result == 'success' &&
        needs.retracted-check.result == 'success'
      }}
    continue-on-error: true
    steps:
      - name: Close post-publish-smoke failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = "publish-smoke-failed";
            const issueTitle = "publish-smoke failure tracker";
            const version = "${{ needs.cron-guard.outputs.version }}";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const artifactName = `trust-runner-published-${context.runId}`;

            const {data: openIssues} = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 100
            });

            const existing = openIssues.find((issue) => issue.title === issueTitle);

            if (!existing) {
              core.info("No open post-publish-smoke failure tracker found; nothing to close.");
              return;
            }

            const body = [
              `Resolved: post-publish-smoke green for v${version}.`,
              "",
              `- Workflow run: ${runUrl}`,
              `- Ref: \`${context.ref}\``,
              `- SHA: \`${context.sha}\``,
              `- OPS-01 guard: \`consumer-install\` succeeded`,
              `- EVID-03 journey: \`published-trust-journey\` succeeded`,
              `- Evidence artifact: \`${artifactName}\``
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: existing.number,
              state: "closed",
              state_reason: "completed"
            });
