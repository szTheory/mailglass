name: repo-hygiene

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
      - name: Install deps
        run: mix deps.get
      - name: Compile repo hygiene task
        run: mix compile
      - name: Run repo hygiene audit
        id: hygiene
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mix mailglass.repo.hygiene --check --format json | tee repo-hygiene.json
      - name: Write readiness summary
        if: always()
        run: |
          {
            echo "## repo hygiene"
            echo
            if [ -f repo-hygiene.json ]; then
              jq -r '.checks[] | "- \(.status) `\(.name)`: \(.message)"' repo-hygiene.json
            else
              echo "Repo hygiene did not produce an artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload hygiene artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: repo-hygiene
          path: repo-hygiene.json
          if-no-files-found: error
