name: Gate Self-Test

# Manual workflow that proves the required CI Green gate blocks failing PRs.
# Creates a temporary branch with a synthetic failing test, opens a draft PR,
# polls until the CI Green required check completes, asserts it returned
# FAILURE, then closes the PR and deletes the branch.
#
# Run via the Actions tab → Gate Self-Test → Run workflow whenever you want
# to confirm the CI Green gate is still enforcing halt-on-failure.
# The check_name input defaults to "CI Green" — the aggregate required context.

on:
  workflow_dispatch:
    inputs:
      cleanup_only:
        description: "Only clean up stale gate-self-test branches/PRs (no new run)"
        type: boolean
        default: false
      check_name:
        description: "Required-check name prefix to poll. Default is 'CI Green' (the aggregate required context). Use 'Trust Lane Repo Head (' to poll a specific leaf lane."
        type: string
        default: "CI Green"
      required_only:
        description: "Poll only branch-protection-required contexts (default, preserves today's behaviour). Set to false to observe an advisory-matrix lane — branch protection's required set is exactly {CI Green, Guard Release Trigger} (required_checks_test.exs:45-58), so a matrix lane like 'Core Full Suite (' will never appear when this stays true."
        type: boolean
        default: true
      deadline_minutes:
        description: "Poll deadline in minutes. Default 25. A cold-cache Core Full Suite leg runs roughly ten and a half minutes, so the default leaves headroom."
        type: string
        default: "25"

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  self-test:
    name: Verify CI Green gate blocks failing PRs
    runs-on: ubuntu-latest
    # Derived from the poll deadline, never a standalone constant. A fixed cap
    # silently truncates any larger deadline_minutes: dispatching with 40
    # against a hardcoded 30 cancelled run 30596060407 at the cap, so the poll
    # loop produced no `result=` value and the probe reported nothing at all.
    # +5 covers checkout, branch push, PR open and cleanup around the loop.
    timeout-minutes: ${{ fromJSON(inputs.deadline_minutes || '25') + 5 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clean up stale gate-self-test branches and PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Close any open gate-self-test PRs and delete their branches.
          for PR in $(gh pr list --search "head:gate-self-test/" --state open --json number --jq '.[].number'); do
            echo "Closing stale PR #${PR}"
            gh pr close "$PR" --delete-branch --comment "gate-self-test cleanup" || true
          done
          # Delete any orphaned gate-self-test branches with no open PR.
          for BRANCH in $(git ls-remote --heads origin "gate-self-test/*" | awk '{print $2}' | sed 's|refs/heads/||'); do
            echo "Deleting orphan branch ${BRANCH}"
            git push origin --delete "$BRANCH" || true
          done

      - name: Stop here if cleanup_only
        if: ${{ inputs.cleanup_only }}
        run: |
          echo "cleanup_only=true — skipping self-test run"
          exit 0

      - name: Create synthetic-failure branch
        if: ${{ !inputs.cleanup_only }}
        id: create-branch
        run: |
          BRANCH="gate-self-test/$(date -u +%s)-${GITHUB_RUN_ID}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"

          # Add a tiny synthetic-failure test. Self-removing on cleanup.
          mkdir -p test/gate_self_test
          cat > test/gate_self_test/intentional_failure_test.exs <<'EOF'
          defmodule Mailglass.GateSelfTest.IntentionalFailureTest do
            @moduledoc """
            Intentional failure injected by .github/workflows/gate-self-test.yml.
            If you see this file outside that workflow, delete it — the test
            is meant to live for the duration of one self-test run only.
            """
            use ExUnit.Case, async: true

            test "this test always fails — verifies the Tests gate blocks PRs" do
              assert false, "intentional failure for gate-self-test"
            end
          end
          EOF

          git add test/gate_self_test/intentional_failure_test.exs
          git commit -m "test(gate-self-test): inject intentional failure to verify gate blocks"
          git push origin "$BRANCH"

      - name: Open draft PR
        if: ${{ !inputs.cleanup_only }}
        id: open-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=$(gh pr create \
            --base main \
            --head "${{ steps.create-branch.outputs.branch }}" \
            --title "[gate-self-test] verify CI Green gate blocks failing PRs" \
            --body "Auto-generated by gate-self-test.yml. Will be closed automatically." \
            --draft \
            | grep -oE '[0-9]+$')
          echo "pr=${PR_NUM}" >> "$GITHUB_OUTPUT"

      - name: Poll for CI Green check completion
        if: ${{ !inputs.cleanup_only }}
        id: poll
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.open-pr.outputs.pr }}
          BRANCH: ${{ steps.create-branch.outputs.branch }}
          CHECK_NAME: ${{ inputs.check_name }}
          REQUIRED_ONLY: ${{ inputs.required_only }}
          DEADLINE_MINUTES: ${{ inputs.deadline_minutes }}
        run: |
          # required_only=false is needed to observe an advisory-matrix lane (e.g.
          # Core Full Suite): branch protection's required set is exactly
          # {CI Green, Guard Release Trigger} (required_checks_test.exs:45-58), so
          # a matrix lane never appears in a --required query and this probe would
          # never see it. Build the flag conditionally rather than always passing it.
          REQUIRED_FLAG=""
          if [ "$REQUIRED_ONLY" = "true" ]; then
            REQUIRED_FLAG="--required"
          fi

          SEEN=0
          ALL_CHECKS="[]"
          DEADLINE=$((SECONDS + DEADLINE_MINUTES * 60))
          while [ $SECONDS -lt $DEADLINE ]; do
            # Capture the full observed check list once per iteration (honouring
            # the same required flag) so a never-appeared outcome can print what
            # the probe actually saw, and so SEEN can be set from a non-empty
            # filtered result without a second API call.
            # `gh pr checks` exits non-zero with "no checks reported on the
            # '<branch>' branch" during the window between opening the PR and
            # the first check registering. The default shell is `bash -e`, so an
            # untolerated failure here aborts the step before the loop can poll
            # even once — observed live on run 30595556100, which produced no
            # `result=` value at all. Tolerating it is NOT a weakening: the
            # deadline still bounds the loop, and an outcome that never resolves
            # still exits non-zero as `never-appeared` below. A probe that
            # cannot observe its subject must fail visibly, and it still does.
            ALL_CHECKS=$(gh pr checks "$PR" $REQUIRED_FLAG --json name,state 2>/dev/null) || ALL_CHECKS="[]"
            STATUS=$(echo "$ALL_CHECKS" | jq -r --arg name "$CHECK_NAME" \
              '.[] | select(.name | startswith($name)) | .state' | head -1)

            if [ -n "$STATUS" ]; then
              SEEN=1
            fi

            case "$STATUS" in
              FAILURE|FAILED|CANCELLED|TIMED_OUT)
                echo "${CHECK_NAME}check returned ${STATUS} — gate is enforcing halt-on-failure"
                echo "result=blocked" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              SUCCESS)
                echo "ERROR: ${CHECK_NAME}check returned SUCCESS on a synthetic-failure PR"
                echo "The gate is NOT enforcing halt-on-failure."
                echo "result=leaked" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
              *)
                echo "${CHECK_NAME}check still running (status=${STATUS:-pending})..."
                sleep 30
                ;;
            esac
          done

          if [ "$SEEN" = "1" ]; then
            echo "ERROR: ${CHECK_NAME}check did not complete within ${DEADLINE_MINUTES} minutes"
            echo "result=timeout" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "ERROR: ${CHECK_NAME}check never appeared within ${DEADLINE_MINUTES} minutes — the polled check was never observed on this PR at all (not pending, not failed, not passed)."
          echo "Checks actually observed on this PR (last poll):"
          echo "$ALL_CHECKS" | jq -r '.[] | "  - \(.name): \(.state)"'
          echo "result=never-appeared" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Close PR + delete branch
        if: always() && steps.create-branch.outputs.branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.open-pr.outputs.pr }}
        run: |
          if [ -n "${PR:-}" ]; then
            gh pr close "$PR" --delete-branch \
              --comment "gate-self-test complete — result=${{ steps.poll.outputs.result || 'unknown' }}" || true
          fi

      - name: Summary
        if: ${{ !inputs.cleanup_only }}
        env:
          CHECK_NAME: ${{ inputs.check_name }}
          REQUIRED_ONLY: ${{ inputs.required_only }}
          DEADLINE_MINUTES: ${{ inputs.deadline_minutes }}
        run: |
          {
            echo "## CI Green Gate Self-Test Result"
            echo ""
            echo "- PR: #${{ steps.open-pr.outputs.pr }}"
            echo "- Branch: ${{ steps.create-branch.outputs.branch }}"
            echo "- Required check polled: ${CHECK_NAME}"
            echo "- required_only: ${REQUIRED_ONLY}"
            echo "- deadline_minutes: ${DEADLINE_MINUTES}"
            echo "- Result: ${{ steps.poll.outputs.result }}"
            echo ""
            if [ "${{ steps.poll.outputs.result }}" = "blocked" ]; then
              echo "CI Green gate enforces halt-on-failure (intended)."
            elif [ "${{ steps.poll.outputs.result }}" = "never-appeared" ]; then
              echo "Delivery blocked: the polled check '${CHECK_NAME}' never appeared on this PR — see the job log above for every check that was actually observed."
              echo ""
              echo "Recovery: if the check name is a non-required (advisory-matrix) lane, re-dispatch with:"
              echo ""
              echo "    gh workflow run gate-self-test.yml -f check_name=\"${CHECK_NAME}\" -f required_only=false -f deadline_minutes=${DEADLINE_MINUTES}"
            else
              echo "Delivery blocked: CI Green gate did NOT block the failing PR — the gate has regressed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
