name: Advisory Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "21 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core_full_suite_advisory:
    name: Core Full Suite Advisory (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }} / schema ${{ matrix.schema }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # REL-06: Elixir 1.17 removed — mailglass requires elixir "~> 1.18" (mix.exs).
          # 1.17 was never a supported target; the matrix row existed only as advisory
          # coverage and failed on every push due to 1.18-only stdlib usage in the codebase.
          # Remove when re-adding any future advisory-only version row.
          #
          # D-06 / Success Criterion 7: the `schema` axis runs the full core suite
          # under BOTH the default `public` schema and the isolated `mailglass`
          # schema. The mailglass row exercises the Phase 134 migration entrypoint
          # (CREATE SCHEMA + schema-qualified raw DDL) end-to-end; MAILGLASS_SCHEMA
          # is exported to the run step below, read by config/runtime.exs.
          - elixir: "1.18"
            otp: "27"
            schema: "public"
          - elixir: "1.18"
            otp: "27"
            schema: "mailglass"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      - name: Install deps
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Wait for postgres + create test DB
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres -d postgres; do sleep 1; done
          mix ecto.create -r Mailglass.TestRepo --quiet
      - name: Run advisory full suite
        # Runs the complete core `lib/` test suite (the ~120 core test files no
        # required lane covers — only the narrow verify.support_contract.core /
        # provider-compat file lists run as required checks).
        # `--exclude requires_workspace`: a handful of maintainer dev-tooling tests
        # (reference-host trust journey, demo_app fixtures, post-publish smoke)
        # need the full multi-package workspace (sibling MailglassInbound compiled,
        # reference/demo apps with fetched deps) which this isolated-core lane does
        # not set up. They fail here structurally — not real lib regressions — and
        # are covered by the dedicated Trust Lane / Demo Browser Evidence /
        # publish-hex post-publish-smoke lanes. Excluding them lets this lane be a
        # meaningful green canary instead of permanently red.
        #
        # MAILGLASS_SCHEMA (D-06): config/runtime.exs reads this in the :test env
        # to override `config :mailglass, :schema`, so the whole suite runs under
        # the matrix schema (public or mailglass). The `--exclude requires_workspace`
        # flag is preserved unchanged.
        #
        # Phase 138 GATE-02: this dual-schema full-suite job is a broad canary,
        # not the fail-closed proof for schema-prefix correctness. The test
        # harness aligns Config.schema/0 with MAILGLASS_SCHEMA and also puts the
        # matrix schema on the connection search_path, so search_path-dependent
        # runtime calls can still pass here. The focused no-search-path proof is
        # `mix verify.schema_prefix`, which runs hostile runtime tests plus the
        # raw-repo prefix guard and strict Credo.
        env:
          MAILGLASS_SCHEMA: ${{ matrix.schema }}
        run: mix test --warnings-as-errors --exclude requires_workspace
      - name: Install inbound deps for focused schema-prefix proof
        # `mix verify.schema_prefix` is a root alias but delegates one focused
        # contract test into mailglass_inbound, whose deps are managed separately.
        working-directory: mailglass_inbound
        run: |
          mix deps.get
          mix ecto.create -r MailglassInbound.TestRepo --quiet
      - name: Run focused schema-prefix proof
        env:
          MAILGLASS_SCHEMA: ${{ matrix.schema }}
        run: mix verify.schema_prefix

  # LD-13 floor-coincidence invariant:
  # This row tests the LATEST Elixir/OTP line (advisory, non-blocking, push+cron only).
  # INVARIANT: whenever the required pin advances past 1.18, either add a 1.18 floor
  # row to the required lane OR raise the declared `elixir:` floor in mix.exs —
  # never let the tested version outrun the declared `~> 1.18` floor.
  # See .planning/research/milestone-cicd/SYNTHESIS.md LD-13.
  core_latest_elixir_advisory:
    name: Core Full Suite Advisory (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }} / schema ${{ matrix.schema }})
    # Job-level if is the ONLY mechanism to exclude a matrix row from PR events —
    # GitHub Actions does not support per-matrix-row if conditions. This guarantees
    # the 1.19/OTP28 row NEVER runs on a PR, NEVER blocks a PR, and NEVER appears in
    # a PR's required-checks context (SUPPLY-05). push + cron + dispatch only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest Elixir/OTP advisory line. If setup-beam cannot resolve "1.19" /
          # "28" on ubuntu-latest, this row fails at setup — advisory-acceptable
          # (a red advisory, never a blocked PR or publish).
          #
          # D-06 / Success Criterion 7: schema axis (public + mailglass), same as
          # the 1.18 job above. MAILGLASS_SCHEMA is exported to the run step.
          - elixir: "1.19"
            otp: "28"
            schema: "public"
          - elixir: "1.19"
            otp: "28"
            schema: "mailglass"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          # advisory-matrix.yml is EXEMPT from the Phase 129 version-file contract:
          # its purpose is to test SPECIFIC named toolchains, so the matrix drives
          # elixir/otp directly rather than reading .tool-versions.
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          # Toolchain-parameterized key prevents cross-toolchain artifact bleed
          # (Pitfall 4): OTP27 build artifacts must never be restored for the
          # OTP28 row.
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-
      - name: Install deps
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Wait for postgres + create test DB
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres -d postgres; do sleep 1; done
          mix ecto.create -r Mailglass.TestRepo --quiet
      - name: Run advisory full suite
        # MAILGLASS_SCHEMA (D-06): runs the full suite under the matrix schema
        # (public or mailglass) via config/runtime.exs. `--exclude requires_workspace`
        # preserved unchanged.
        #
        # Phase 138 GATE-02: broad canary only. Because this lane aligns
        # Config.schema/0 and the connection search_path to the matrix schema,
        # use `mix verify.schema_prefix` for the focused no-search-path proof.
        env:
          MAILGLASS_SCHEMA: ${{ matrix.schema }}
        run: mix test --warnings-as-errors --exclude requires_workspace

  provider_compatibility_advisory:
    name: Provider Compatibility Advisory (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      - name: Install deps
        run: mix deps.get
      - name: Wait for postgres + create test DB
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres -d postgres; do sleep 1; done
          mix ecto.create -r Mailglass.TestRepo --quiet
      - name: Run provider compatibility advisory
        run: mix verify.provider_compatibility

  mailglass_inbound_dual_schema_advisory:
    name: Inbound Full Suite Advisory (schema ${{ matrix.schema }})
    # D-13 / INB-03: runs the FULL inbound suite under BOTH the default
    # `public` schema and the isolated `mailglass` schema. Advisory / non-blocking
    # — this workflow is never a required PR check (fake-adapter-is-the-gate DNA).
    # The `schema` matrix axis mirrors core_full_suite_advisory's D-06 axis.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
            schema: "public"
          - elixir: "1.18"
            otp: "27"
            schema: "mailglass"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    defaults:
      run:
        working-directory: mailglass_inbound
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: mailglass_inbound/deps
          key: inbound-${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mailglass_inbound/mix.lock') }}
          restore-keys: |
            inbound-${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-
      - name: Install deps
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Wait for postgres + create test DB
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres -d postgres; do sleep 1; done
          mix ecto.create -r MailglassInbound.TestRepo --quiet
      - name: Run inbound dual-schema advisory full suite
        # MAILGLASS_SCHEMA (D-12 / INB-03): test_helper.exs reads this env var
        # to align BOTH Migration.up(prefix:) AND Config.schema/0 to the matrix
        # schema, then sets search_path on the TestRepo connections so unqualified
        # raw SQL in tests also targets the configured schema.
        #
        # Phase 138 GATE-02: this inbound matrix is broad canary coverage, not
        # the milestone's fail-closed proof. It intentionally aligns the inbound
        # Config.schema/0 value and connection search_path, so search_path-masked
        # raw repo calls can pass here. The focused no-search-path proof is
        # `mix verify.schema_prefix`, which delegates to the inbound schema prefix
        # contract test after hostile core runtime tests and the raw-repo guard.
        # `--seed 0` pins the test ordering to dodge the phase-45 property-test
        # pool flake (tcp recv: closed) deterministically (D-13 anti-flake).
        env:
          MAILGLASS_SCHEMA: ${{ matrix.schema }}
        run: mix test --seed 0
