name: Advisory Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "21 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core_full_suite_advisory:
    name: Core Full Suite Advisory (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # REL-06: Elixir 1.17 removed — mailglass requires elixir "~> 1.18" (mix.exs).
          # 1.17 was never a supported target; the matrix row existed only as advisory
          # coverage and failed on every push due to 1.18-only stdlib usage in the codebase.
          # Remove when re-adding any future advisory-only version row.
          - elixir: "1.18"
            otp: "27"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      - name: Install deps
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Wait for postgres + create test DB
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres -d postgres; do sleep 1; done
          mix ecto.create -r Mailglass.TestRepo --quiet
      - name: Run advisory full suite
        # Runs the complete core `lib/` test suite (the ~120 core test files no
        # required lane covers — only the narrow verify.support_contract.core /
        # provider-compat file lists run as required checks).
        # `--exclude requires_workspace`: a handful of maintainer dev-tooling tests
        # (reference-host trust journey, demo_app fixtures, post-publish smoke)
        # need the full multi-package workspace (sibling MailglassInbound compiled,
        # reference/demo apps with fetched deps) which this isolated-core lane does
        # not set up. They fail here structurally — not real lib regressions — and
        # are covered by the dedicated Trust Lane / Demo Browser Evidence /
        # publish-hex post-publish-smoke lanes. Excluding them lets this lane be a
        # meaningful green canary instead of permanently red.
        run: mix test --warnings-as-errors --exclude requires_workspace

  # LD-13 floor-coincidence invariant:
  # This row tests the LATEST Elixir/OTP line (advisory, non-blocking, push+cron only).
  # INVARIANT: whenever the required pin advances past 1.18, either add a 1.18 floor
  # row to the required lane OR raise the declared `elixir:` floor in mix.exs —
  # never let the tested version outrun the declared `~> 1.18` floor.
  # See .planning/research/milestone-cicd/SYNTHESIS.md LD-13.
  core_latest_elixir_advisory:
    name: Core Full Suite Advisory (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    # Job-level if is the ONLY mechanism to exclude a matrix row from PR events —
    # GitHub Actions does not support per-matrix-row if conditions. This guarantees
    # the 1.19/OTP28 row NEVER runs on a PR, NEVER blocks a PR, and NEVER appears in
    # a PR's required-checks context (SUPPLY-05). push + cron + dispatch only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest Elixir/OTP advisory line. If setup-beam cannot resolve "1.19" /
          # "28" on ubuntu-latest, this row fails at setup — advisory-acceptable
          # (a red advisory, never a blocked PR or publish).
          - elixir: "1.19"
            otp: "28"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          # advisory-matrix.yml is EXEMPT from the Phase 129 version-file contract:
          # its purpose is to test SPECIFIC named toolchains, so the matrix drives
          # elixir/otp directly rather than reading .tool-versions.
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          # Toolchain-parameterized key prevents cross-toolchain artifact bleed
          # (Pitfall 4): OTP27 build artifacts must never be restored for the
          # OTP28 row.
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-
      - name: Install deps
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Wait for postgres + create test DB
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres -d postgres; do sleep 1; done
          mix ecto.create -r Mailglass.TestRepo --quiet
      - name: Run advisory full suite
        run: mix test --warnings-as-errors --exclude requires_workspace

  provider_compatibility_advisory:
    name: Provider Compatibility Advisory (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      - name: Install deps
        run: mix deps.get
      - name: Wait for postgres + create test DB
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres -d postgres; do sleep 1; done
          mix ecto.create -r Mailglass.TestRepo --quiet
      - name: Run provider compatibility advisory
        run: mix verify.provider_compatibility
