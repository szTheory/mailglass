name: Provider Live

on:
  schedule:
    - cron: "33 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: provider-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider_live:
    name: Provider Live Advisory (Elixir 1.18 / OTP 27)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - name: Install deps
        run: mix deps.get
      - name: Wait for postgres + create test DB
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres -d postgres; do sleep 1; done
          mix ecto.create -r Mailglass.TestRepo --quiet
      - name: Detect provider-live tests
        id: provider-live-tests
        run: |
          if rg -n '@tag\s+:provider_live|@moduletag\s+:provider_live' test >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No :provider_live-tagged tests found; skipping advisory run."
          fi
      - name: Run provider-live tests
        if: ${{ steps.provider-live-tests.outputs.present == 'true' }}
        run: mix test --only provider_live --warnings-as-errors

  notify_provider_live_failure:
    name: provider-live failure notification
    runs-on: ubuntu-latest
    needs: [provider_live]
    if: failure()
    continue-on-error: true
    steps:
      - name: Add provider-live failure summary
        run: |
          {
            echo "## provider-live failure"
            echo
            echo "Provider-live advisory tests failed."
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update provider-live failure issue
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = "ci/provider-live";
            const issueTitle = "provider-live failure tracker";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "provider-live failure detected.",
              "",
              `- Workflow run: ${runUrl}`,
              `- Ref: \`${context.ref}\``,
              `- SHA: \`${context.sha}\``
            ].join("\n");

            try {
              await github.rest.issues.getLabel({owner, repo, name: label});
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: "B60205",
                  description: "Tracked failures for provider-live advisory workflow"
                });
              } else {
                throw error;
              }
            }

            const {data: openIssues} = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 100
            });

            const existing = openIssues.find((issue) => issue.title === issueTitle);

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body,
                labels: [label]
              });
            }
