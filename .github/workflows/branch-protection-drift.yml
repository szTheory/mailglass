name: Branch Protection Apply

# Owner-controlled re-assertion of the desired branch-protection ruleset.
# CI performs read-only verification separately; this workflow is the only
# repo-owned path allowed to mutate live protection settings.
#
# Requires the BRANCH_PROTECTION_PAT secret — a fine-grained PAT scoped
# to this repo with "Administration: Read and write" permission.
# A missing credential or unavailable verifier is a visibly failing outcome;
# green means a canonical read-only comparison actually succeeded.

on:
  schedule:
    - cron: "37 6 * * *"  # 06:37 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reassert-protection:
    name: Re-assert branch protection on main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for BRANCH_PROTECTION_PAT secret
        id: check-pat
        env:
          PAT_SET: ${{ secrets.BRANCH_PROTECTION_PAT != '' }}
        run: |
          if [ "$PAT_SET" = "true" ]; then
            echo "pat_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "pat_present=false" >> "$GITHUB_OUTPUT"
            echo "classification=cannot_check" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify and re-assert branch protection
        id: verify-protection
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          classification=$(./scripts/branch-protection-outcome.sh probe --reassert main)
          echo "classification=$classification" >> "$GITHUB_OUTPUT"

      - name: Report branch protection outcome
        if: always()
        run: ./scripts/branch-protection-outcome.sh report "${{ steps.verify-protection.outputs.classification || steps.check-pat.outputs.classification || 'unknown' }}"
