name: Branch Protection Apply

# Owner-controlled re-assertion of the desired branch-protection ruleset.
# CI performs read-only verification separately; this workflow is the only
# repo-owned path allowed to mutate live protection settings.
#
# Requires the BRANCH_PROTECTION_PAT secret — a fine-grained PAT scoped
# to this repo with "Administration: Read and write" permission.
# If the secret is unset, the job no-ops and posts a notice in the
# workflow summary.

on:
  schedule:
    - cron: "37 6 * * *"  # 06:37 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reassert-protection:
    name: Re-assert branch protection on main
    runs-on: ubuntu-latest
    steps:
      - name: Check for BRANCH_PROTECTION_PAT secret
        id: check-pat
        env:
          PAT_SET: ${{ secrets.BRANCH_PROTECTION_PAT != '' }}
        run: |
          if [ "$PAT_SET" = "true" ]; then
            echo "pat_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "pat_present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Branch Protection Apply — Skipped"
              echo ""
              echo "BRANCH_PROTECTION_PAT secret not set."
              echo "Configure a fine-grained PAT with 'Administration: Read and write'"
              echo "and add it as a repo secret to enable owner-applied re-assertion."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.check-pat.outputs.pat_present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Re-assert branch protection
        if: steps.check-pat.outputs.pat_present == 'true'
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/setup_branch_protection.sh main
