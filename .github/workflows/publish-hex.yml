name: publish-hex

on:
  release:
    types: [published]
  workflow_dispatch:
    # Trigger contract (per Phase 27, D-27-05/06):
    #   - release: types: [published] is the CANONICAL publish path;
    #     `github.event.release.tag_name` resolves the tag/ref to publish.
    #   - workflow_dispatch is FALLBACK-ONLY for manual recovery; supply the
    #     published tag (e.g. `mailglass-vX.Y.Z`) via `inputs.tag`. Never
    #     dispatch against `main` — version resolution is tag-based.
    inputs:
      tag:
        description: "Git tag/ref to publish from; fallback-only (e.g. mailglass-vX.Y.Z)"
        required: true
        type: string
      dry_run:
        description: "Run mix hex.publish --dry-run instead of --yes"
        required: false
        type: boolean
        default: false
      package:
        description: "Package(s) to publish"
        required: false
        type: choice
        options:
          - mailglass
          - mailglass_admin
          - mailglass_inbound
          - all
        default: all
      candidate_digest:
        description: "Protected candidate digest from dual authorization"
        required: false
        type: string
      # The Core Full Suite gate's pressure valve (Phase 143 / D-23). It exists
      # because gating those two legs also gates three steps that are network- and
      # service-dependent — the inbound `mix deps.get`, the inbound
      # `mix ecto.create`, and `mix verify.schema_prefix` — so a Hex outage or a
      # Postgres hiccup can block a release with no regression present. The
      # override must be usable WITHOUT a code change, or the maintainer's thirty
      # minutes becomes a day.
      #
      # It is deliberately awkward to reach: dispatch-only, INERT on the release
      # event so the hands-free path can never self-skip, reason REQUIRED, reason
      # echoed to the run summary, and a warning naming it an exception. An
      # override reached for reflexively is a gate that has been removed without
      # anyone recording that it was (D-30).
      skip_core_full_suite_gate:
        description: "EXCEPTION: publish without the Core Full Suite gate. Requires a written reason. Ignored on the automated release event."
        required: false
        type: boolean
        default: false
      core_full_suite_gate_skip_reason:
        description: "Why the Core Full Suite gate is being skipped (write 'n/a' when not skipping). Echoed to the run summary."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mailglass-linked-release-publish
  cancel-in-progress: false

jobs:
  prepublish-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      authorized: ${{ steps.release-target.outputs.authorized }}
      candidate_digest: ${{ steps.release-target.outputs.candidate_digest }}
      tag_sha: ${{ steps.release-target.outputs.tag_sha }}
      core: ${{ steps.release-target.outputs.core }}
      admin: ${{ steps.release-target.outputs.admin }}
      inbound: ${{ steps.release-target.outputs.inbound }}
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Rehearsed fallback contract: checkout the known release tag when
          # using workflow_dispatch so publish runs against the reviewed release
          # commit, not a later `main` SHA.
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
      - name: Set up OTP + Elixir for policy
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Install deps for policy
        run: mix deps.get
      - name: Compile policy runtime
        run: mix compile
      - name: Validate automated release target
        id: release-target
        env:
          RELEASE_REF: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_DIGEST: ${{ github.event.inputs.candidate_digest }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          PACKAGE: ${{ github.event.inputs.package }}
        run: |
          set -euo pipefail
          target=.planning/release-target.json
          digest="${CANDIDATE_DIGEST:-}"

          # A pretag rehearsal accepts only a captured exact candidate. It
          # verifies the proposal tree and all three source versions, but emits
          # no authorization signal and therefore cannot enter live jobs.
          if [ "${EVENT_NAME:-}" = workflow_dispatch ] && [ "${DRY_RUN:-}" = true ] && [ -n "$digest" ]; then
            policy=$(mktemp)
            captured_target=$(mktemp)
            git fetch --no-tags origin main:refs/remotes/origin/main
            git show origin/main:.planning/release-target.json > "$captured_target"
            mix run --no-start --no-compile --no-deps-check --require scripts/release_policy.exs -e 'Mailglass.ReleasePolicy.cli(System.argv())' -- validate-captured-dispatch "$captured_target" "$digest" > "$policy"
            candidate_digest=$(awk -F= '$1 == "candidate_digest" {print $2}' "$policy")
            proposal_head=$(awk -F= '$1 == "proposal_head" {print $2}' "$policy")
            content_digest=$(awk -F= '$1 == "content_digest" {print $2}' "$policy")
            core=$(awk -F= '$1 == "core" {print $2}' "$policy")
            admin=$(awk -F= '$1 == "admin" {print $2}' "$policy")
            inbound=$(awk -F= '$1 == "inbound" {print $2}' "$policy")
            [ "$candidate_digest" = "$digest" ]
            [ "$(git rev-parse HEAD)" = "$proposal_head" ]
            actual_digest=$(scripts/release_policy_content_digest.sh)
            [ "$actual_digest" = "$content_digest" ]
            for version in "$core" "$admin" "$inbound"; do [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; done
            [ "$core" = "$admin" ]
            printf 'active=false\nauthorized=false\npretag=true\ncandidate_digest=%s\ncore=%s\nadmin=%s\ninbound=%s\n' "$digest" "$core" "$admin" "$inbound" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every live path is inert unless a later protected dispatch supplies
          # the exact deterministic candidate digest. Release events, inactive
          # targets, and singly-authorized targets cannot reach secrets.
          if [ "${EVENT_NAME:-}" != "workflow_dispatch" ] || [ -z "$digest" ]; then
            printf 'active=false\nauthorized=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${PACKAGE:-}" != all ]; then
            echo "ERROR: protected release validation requires package=all" >&2
            exit 1
          fi

          policy=$(mktemp)
          if mix run --no-start --no-compile --no-deps-check --require scripts/release_policy.exs -e 'Mailglass.ReleasePolicy.cli(System.argv())' -- validate-protected-dispatch "$target" "$digest" > "$policy"; then
            content_digest=$(awk -F= '$1 == "content_digest" {print $2}' "$policy")
            [[ "$content_digest" =~ ^[0-9a-f]{64}$ ]]
            tag_sha=$(git rev-parse "${RELEASE_REF}^{commit}")
            [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]]
            [ "$(git rev-parse HEAD)" = "$tag_sha" ]
            actual_digest=$(scripts/release_policy_content_digest.sh)
            [ "$actual_digest" = "$content_digest" ]
            printf 'authorized=true\ncandidate_digest=%s\ncontent_digest=%s\ntag_sha=%s\n' "$digest" "$content_digest" "$tag_sha" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: protected candidate digest is invalid or unauthorized" >&2
            exit 1
          fi

          validator=scripts/release_policy_validate_target.sh
          if "$validator" "$target" "$RELEASE_REF" >> "$GITHUB_OUTPUT"; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ERROR: protected candidate source/ref validation failed" >&2
          exit 1
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
      - name: Install deps (root)
        run: mix deps.get
      - name: Wait for postgres + create test DB
        if: ${{ github.event.inputs.package != 'mailglass_admin' }}
        env:
          PGPASSWORD: postgres
        run: |
          while ! pg_isready -h localhost -U postgres; do
            sleep 1
          done
          export MIX_ENV=test
          mix ecto.create -r Mailglass.TestRepo --quiet
      - name: Install deps (admin)
        if: ${{ github.event.inputs.package != 'mailglass' }}
        working-directory: mailglass_admin
        run: mix deps.get
      - name: Pre-publish check for mailglass
        if: ${{ github.event.inputs.package != 'mailglass_admin' }}
        run: |
          echo "## mailglass" >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          mix mailglass.publish.check --package mailglass 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pre-publish check for mailglass_admin
        if: ${{ github.event.inputs.package != 'mailglass' }}
        run: |
          echo "## mailglass_admin" >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          mix mailglass.publish.check --package mailglass_admin 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pre-publish check for mailglass_inbound
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package != 'mailglass' && github.event.inputs.package != 'mailglass_admin' }}
        run: |
          echo "## mailglass_inbound" >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          mix mailglass.publish.check --package mailglass_inbound 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      # This is a deliberately narrow, credential-free release ledger. It proves
      # the focused behavioral suite on the protected release path without
      # retaining test output, environments, package credentials, or message data.
      - name: Run Phase 148 release proof suite
        if: ${{ steps.release-target.outputs.active == 'true' || steps.release-target.outputs.pretag == 'true' }}
        run: |
          mix test test/mailglass/webhook/ingest_auto_suppress_test.exs test/mailglass/suppression_test.exs test/mailglass/docs_contract_test.exs --warnings-as-errors
          (
            cd mailglass_admin
            mix test test/mailglass_admin/operator_live_test.exs --warnings-as-errors
          )
      - name: Write sanitized Phase 148 release proof
        if: ${{ steps.release-target.outputs.active == 'true' || steps.release-target.outputs.pretag == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p tmp/release-proof
          jq -n \
            --arg ref "${{ github.event.release.tag_name || github.event.inputs.tag }}" \
            --arg sha "$(git rev-parse HEAD)" \
            --arg core "${{ steps.release-target.outputs.core }}" \
            --arg admin "${{ steps.release-target.outputs.admin }}" \
            --arg inbound "${{ steps.release-target.outputs.inbound }}" \
            --arg webhook_suppression "passed" \
            --arg transactional_suppression "passed" \
            --arg b2c_docs "passed" \
            --arg operator_live "passed" \
            '{
              ref: $ref,
              sha: $sha,
              packages: {
                mailglass: $core,
                mailglass_admin: $admin,
                mailglass_inbound: $inbound
              },
              commands: {
                "proof-02-webhook-suppression": $webhook_suppression,
                "proof-02-transactional-suppression": $transactional_suppression,
                "proof-03-b2c-docs": $b2c_docs,
                "phase-147-operator-live": $operator_live
              }
            }' > tmp/release-proof/phase-148.json
      - name: Upload Phase 148 release proof
        if: ${{ steps.release-target.outputs.active == 'true' || steps.release-target.outputs.pretag == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: phase-148-release-proof-${{ github.run_id }}
          path: tmp/release-proof/phase-148.json
          if-no-files-found: error
          retention-days: 90

  gate-ci-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepublish-summary]
    # `actions: write` lets this job self-dispatch ci.yml AND advisory-matrix.yml
    # on the tagged SHA when no run exists. That is the anti-recursion dead-end: a
    # release-please PR auto-merged by GITHUB_TOKEN produces a `main` SHA whose
    # `push` event is suppressed, so neither workflow ran on it; release-please then
    # tags that SHA (via RELEASE_PLEASE_PAT) and `release: published` lands here with
    # zero runs of either to gate on. See CONTRIBUTING.md "If a release publishes but
    # the tags/publish never fire". The permission is NOT widened by Phase 143 —
    # `actions: write` already covered exactly this dispatch, for one workflow
    # instead of two.
    permissions:
      contents: read
      actions: write
    # Both override inputs are bound here as ENVIRONMENT VALUES and read as
    # environment values. Neither is ever string-concatenated into a `run:` body or
    # spliced into an inline expression inside one — the reason is free text a
    # dispatcher supplies. The release-event inertness is NOT expressed here; it is
    # enforced once, in each consuming script, as `context.eventName !== 'release'`,
    # so there is exactly one readable place where "the hands-free path can never
    # self-skip" is stated.
    env:
      SKIP_CORE_FULL_SUITE_GATE: ${{ inputs.skip_core_full_suite_gate }}
      CORE_FULL_SUITE_GATE_SKIP_REASON: ${{ inputs.core_full_suite_gate_skip_reason }}
    steps:
      - name: Resolve tagged SHA
        id: resolve-sha
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const ref = context.payload.release?.tag_name || context.payload.inputs?.tag || context.sha;
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref
            });
            core.setOutput('sha', commit.data.sha);
            core.setOutput('ref', ref);
      # DISPATCH IS THE DEFAULT PATH FOR BOTH WORKFLOWS, NOT AN EDGE CASE (D-22).
      #
      # release-please bot-merges the release PR, and GitHub does not trigger
      # workflows for events raised with GITHUB_TOKEN. That suppresses the `push`
      # trigger for ci.yml AND for advisory-matrix.yml, and advisory-matrix.yml has
      # no `release:` trigger at all. So a release SHA has ZERO runs of either
      # workflow, and a gate that merely LOOKS ONE UP would deadlock on every
      # release. The two-SHA comparison that proves it:
      #
      #   SHA        commit                              ci.yml runs   advisory-matrix runs
      #   25c74ca0   `chore: release main (#149)` (bot)  1 (this step) 0
      #   3edc95f0   human-merged                        1 (push)      1 (push)
      #
      # Re-confirmed on 2026-07-31 against `e88daa15` (`chore: release main (#158)`,
      # auto-merged, published mailglass 2.2.2): zero Advisory Matrix runs.
      # See .planning/phases/143-test-harness-truth/143-MAIN-GREEN-EVIDENCE.md.
      #
      # A tag-shaped-ref dispatch of advisory-matrix.yml is rehearsed, not assumed:
      # run 30595564984 dispatched it on a throwaway tag cut from green `main` and
      # both gating legs went green.
      - name: Ensure completed ci.yml and advisory-matrix.yml runs exist on tagged SHA
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          # Bound through env rather than interpolated into the script body: `ref`
          # is a tag name, and a `${{ }}` splice lands inside a JS string literal.
          RESOLVED_SHA: ${{ steps.resolve-sha.outputs.sha }}
          RESOLVED_REF: ${{ steps.resolve-sha.outputs.ref }}
        with:
          script: |
            // Self-heal the anti-recursion case before the green check below, for
            // BOTH workflows the next step reads. If the tagged SHA has no run of a
            // workflow, dispatch that workflow on the tag and wait for it. We do NOT
            // judge pass/fail here — the next step owns the required-vs-advisory and
            // gating-vs-advisory verdicts. Fail-safe: a red dispatched run simply
            // makes "Verify CI is green" block the publish, exactly as a
            // human-triggered red run would.
            //
            // ONE step, ONE shared deadline, both workflows polled in the SAME loop.
            // Not two serial waits: a second 30-minute deadline after the first turns
            // a 30-minute worst case into 60 on a pipeline nobody is watching.
            //
            // The dispatch-only override (D-23) also lifts the WAIT, not just the
            // verdict. Without that, an override could not rescue the case it most
            // needs to: GitHub Actions itself unavailable, no advisory-matrix run
            // obtainable, this step deadlining out 30 minutes later regardless of
            // what the next step would have decided. INERT on the release event —
            // the hands-free path can never self-skip.
            const skipCoreFullSuiteGate =
              process.env.SKIP_CORE_FULL_SUITE_GATE === 'true' && context.eventName !== 'release';

            const WORKFLOWS = ['ci.yml'];
            if (skipCoreFullSuiteGate) {
              core.warning('Core Full Suite gate override is active: not waiting for an advisory-matrix.yml run on this SHA.');
            } else {
              WORKFLOWS.push('advisory-matrix.yml');
            }

            const sha = process.env.RESOLVED_SHA;
            const ref = process.env.RESOLVED_REF;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function latestRun(workflowId) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                head_sha: sha,
                per_page: 10
              });
              return data.workflow_runs[0] || null;
            }

            const runs = {};
            for (const wf of WORKFLOWS) {
              runs[wf] = await latestRun(wf);
            }

            // FAN-OUT SAFETY. One linked-version release train publishes two tags,
            // each firing its own `release: published` event, so two publish-hex runs
            // can reach this step seconds apart. Both resolve to the SAME head SHA
            // (both tags point at the release commit), both would find zero runs, and
            // both would dispatch. Query on head_sha, settle a randomised interval,
            // then RE-CHECK: if the sibling run's dispatch has landed, poll it instead
            // of dispatching again. Worst case is one redundant matrix run.
            //
            // The fix is NOT to key advisory-matrix.yml's concurrency group on the
            // SHA. That group has cancel-in-progress: true, so two same-SHA dispatches
            // would land in one group and cancel each other — and a cancelled run is
            // blocking, so both gates would then read `cancelled` and block the
            // release. That is the exact unattended stall this self-heal exists to
            // prevent. advisory-matrix.yml's own concurrency comment records this too.
            const absent = WORKFLOWS.filter((wf) => !runs[wf]);
            if (absent.length > 0) {
              const settleMs = Math.floor(Math.random() * 15000);
              core.info(`No run on ${sha} for: ${absent.join(', ')}. Settling ${settleMs}ms before dispatch (fan-out safety), then re-checking.`);
              await sleep(settleMs);

              for (const wf of absent) {
                runs[wf] = await latestRun(wf);
                if (runs[wf]) {
                  core.info(`${wf} run ${runs[wf].id} appeared during the settle window; polling it instead of dispatching.`);
                  continue;
                }
                core.info(`Dispatching ${wf} on ${ref} (anti-recursion self-heal).`);
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: wf,
                  ref
                });
              }
            }

            // Wait up to 30 minutes — ONE deadline, shared by both workflows.
            const deadlineMs = Date.now() + 30 * 60 * 1000;
            const pending = () => WORKFLOWS.filter((wf) => !runs[wf] || runs[wf].status !== 'completed');

            while (pending().length > 0) {
              if (Date.now() > deadlineMs) {
                const stalled = pending();
                const recovery = stalled.map((wf) => `gh workflow run ${wf} --ref ${ref}`).join('\n  ');
                core.setFailed(
                  `Delivery blocked: no completed run of ${stalled.join(', ')} for SHA ${sha} within 30 minutes.\n` +
                  `Recovery — dispatch the workflow on the release ref, then re-dispatch this one:\n  ${recovery}\n` +
                  `  gh workflow run publish-hex.yml -f tag=${ref} -f package=all -f dry_run=false`
                );
                return;
              }
              await sleep(20000);
              for (const wf of pending()) {
                runs[wf] = await latestRun(wf);
              }
            }

            for (const wf of WORKFLOWS) {
              core.info(`${wf} run ${runs[wf].id} on ${sha} completed with conclusion: ${runs[wf].conclusion}.`);
            }
      - name: Verify CI is green on tagged SHA
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          # Read as an environment value by the advisory-matrix recovery messages
          # below. A tag name must never be spliced into the script body.
          RESOLVED_REF: ${{ steps.resolve-sha.outputs.ref }}
        with:
          script: |
            // Required lanes: each must be present in the run's jobs AND have
            // conclusion === 'success'. A skipped, missing, failed, or cancelled
            // required lane BLOCKS publish (GATE-02, per LD-6).
            //
            // NOTE: this set must stay identical to ci_green.needs in ci.yml.
            // The canonical Elixir-side source is Mailglass.CILanes
            // (test/support/ci_lanes.ex); its required_lanes/0 is verified against
            // ci_green.needs by the GATE-03 meta-test (LD-10 shared ci_lanes seam,
            // hoisted in Phase 128 MIXCI-03). This YAML copy remains the CI-side
            // declaration that the meta-test checks — kept in lockstep, not deleted.
            const REQUIRED_LANES = [
              'Support Contract Core (Elixir 1.18 / OTP 27)',
              'Support Contract Admin (Elixir 1.18 / OTP 27)',
              'Compile No Optional Deps (Elixir 1.18 / OTP 27)',
              'Trust Lane Repo Head (Elixir 1.18 / OTP 27)',
              'Installer Host Smoke',
              'Hex Audit (Elixir 1.18 / OTP 27)',
              'Deps Audit (Elixir 1.18 / OTP 27)',
              'Mix Task Tests (Elixir 1.18 / OTP 27)'
            ];

            // Classification mirrors Mailglass.CILanes (test/support/ci_lanes.ex),
            // the authoritative registry (TRUTH-07/D-01). The drift meta-test
            // test/scripts/lane_classification_drift_test.exs asserts these four
            // arrays set-equal the Elixir registry, so editing one without the
            // other fails CI.
            //
            // MATCHING RULE — do not "simplify" to === for any array below
            // except REQUIRED_LANES: GitHub appends matrix values to a matrix
            // job's declared name: at runtime — e.g. `Dialyzer (Elixir 1.18 /
            // OTP 27)` reports live as `Dialyzer (Elixir 1.18 / OTP 27) (1.18,
            // 27)`, and Operator Browser Gate / Preview Capture Advisory gain a
            // similar matrix-value suffix. Prefix matching is REQUIRED for any
            // array that may contain a matrix lane. REQUIRED_LANES correctly
            // keeps exact equality because none of its eight lanes declares a
            // matrix, and a required lane must be PRESENT, so the stricter test
            // is right there.
            const ADVISORY_LANES = [
              'Operator Browser Gate (Elixir 1.18 / OTP 27 / Node 22)',
              'Demo Browser Evidence (Docker Compose / Chromium)',
              'Preview Capture Advisory (Elixir 1.18 / OTP 27 / Node 22)'
            ];

            // Lanes that block a Hex publish when red but do NOT block a PR
            // merge. gate-ci-green enumerates these; ci_green.needs (ci.yml)
            // does not.
            const PUBLISH_GATING_LANES = [
              'Format Check (Elixir 1.18 / OTP 27)',
              'Compile Warnings as Errors (Elixir 1.18 / OTP 27)',
              'Inbound Test (Elixir 1.18 / OTP 27)',
              'Inbound Compile No Optional Deps (Elixir 1.18 / OTP 27)',
              'Credo Strict (Elixir 1.18 / OTP 27)',
              'Design System Conformance (shell gates)',
              'Dialyzer (Elixir 1.18 / OTP 27)',
              'Docs Warnings as Errors (Elixir 1.18 / OTP 27)',
              'Installer Golden Gate (Elixir 1.18 / OTP 27)',
              'Trust Lane Clean Baseline (Elixir 1.18 / OTP 27)',
              'Branch Protection Advisory'
            ];

            // Structural jobs — not check lanes (a path filter and an
            // aggregator). Classified so no ci.yml job sits unrecorded
            // (TRUTH-09); their blocking behavior below is identical to
            // PUBLISH_GATING_LANES.
            const STRUCTURAL_LANES = [
              'Detect Non-Doc Changes',
              'CI Green'
            ];

            // ---------------------------------------------------------------
            // THIRD AXIS — .github/workflows/advisory-matrix.yml (Phase 143,
            // D-19/D-23/D-24, HARNESS-04). A DIFFERENT workflow from the four
            // arrays above, which classify ci.yml and nothing else. Mirrors
            // Mailglass.CILanes.advisory_matrix_gating_lanes/0 and
            // .advisory_matrix_advisory_lanes/0; lane_classification_drift_test.exs
            // asserts both by set equality, so editing one without the other
            // fails CI.
            //
            // MATCHING RULE — these two arrays are matched by EXACT equality, not
            // by prefix, and that is deliberate. Unlike ci.yml's statically-named
            // matrix jobs, every advisory-matrix.yml job interpolates each matrix
            // axis into its own `name:`, so GitHub reports the name fully
            // substituted with NO appended ` (<matrix values>)` suffix. This gate
            // only ever reads a release, tag, or push run, where that
            // interpolation has happened — the uninterpolated-template collapse
            // (D-21) occurs on pull_request runs, which this gate never reads.
            // Exact equality is therefore both safe and stricter, which is what a
            // presence check wants.
            const ADVISORY_MATRIX_GATING_LANES = [
              'Core Full Suite (Elixir 1.18 / OTP 27 / schema public)',
              'Core Full Suite (Elixir 1.18 / OTP 27 / schema mailglass)'
            ];

            // Classified, enumerated, warned on, never blocking.
            const ADVISORY_MATRIX_ADVISORY_LANES = [
              'Core Full Suite Next Toolchain Advisory (Elixir 1.19 / OTP 28 / schema public)',
              'Core Full Suite Next Toolchain Advisory (Elixir 1.19 / OTP 28 / schema mailglass)',
              'Provider Compatibility Advisory (Elixir 1.18 / OTP 27)',
              'Inbound Full Suite Advisory (schema public)',
              'Inbound Full Suite Advisory (schema mailglass)'
            ];

            const startsWithAny = (name, lanes) => lanes.some(l => name.startsWith(l));

            const classify = (name) => {
              if (REQUIRED_LANES.includes(name))              return 'required';
              if (startsWithAny(name, ADVISORY_LANES))        return 'advisory';
              if (startsWithAny(name, PUBLISH_GATING_LANES))  return 'publish-gating';
              if (startsWithAny(name, STRUCTURAL_LANES))      return 'structural';
              return 'unclassified';
            };

            // Third-axis classifier. Exact equality on both buckets — see the
            // MATCHING RULE note above the two arrays for why that is safe here
            // and why prefix matching is not needed.
            const classifyAdvisoryMatrix = (name) => {
              if (ADVISORY_MATRIX_GATING_LANES.includes(name))   return 'gating';
              if (ADVISORY_MATRIX_ADVISORY_LANES.includes(name)) return 'advisory';
              return 'unclassified';
            };

            const sha = '${{ steps.resolve-sha.outputs.sha }}';
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: sha,
              per_page: 10
            });

            if (data.total_count === 0) {
              core.setFailed(`Delivery blocked: no ci.yml runs found for SHA ${sha}. Push the tagged commit and let CI complete before publishing.`);
              return;
            }

            const latest = data.workflow_runs[0];

            // Always fetch job-level conclusions to verify required lanes.
            // We do NOT early-return on latest.conclusion === 'success' because
            // a run with a path-skipped required lane can still report overall
            // success — a skipped required lane must block (GATE-02).
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner: context.repo.owner, repo: context.repo.repo, run_id: latest.id, per_page: 100 }
            );

            // Required-lane check: every required lane must be present AND success.
            const requiredBlocking = [];
            for (const lane of REQUIRED_LANES) {
              const job = jobs.find(j => j.name === lane);
              if (!job) {
                requiredBlocking.push(`${lane} (missing)`);
              } else if (job.conclusion !== 'success') {
                requiredBlocking.push(`${lane} (${job.conclusion})`);
              }
            }

            if (requiredBlocking.length > 0) {
              const list = requiredBlocking.map(s => `  - ${s}`).join('\n');
              core.setFailed(`Delivery blocked: required CI lane(s) did not pass on SHA ${sha}:\n${list}\nRun: ${latest.html_url}`);
              return;
            }

            const notGreen = jobs.filter(j => j.conclusion !== 'success' && j.conclusion !== 'skipped');

            // Publish-gating + structural red => block. Identical in effect to
            // today's fall-through blocking behavior for every existing lane.
            const blockingFailures = notGreen.filter(j => {
              const c = classify(j.name);
              return c === 'publish-gating' || c === 'structural';
            });

            if (blockingFailures.length > 0) {
              const detail = blockingFailures.map(j => `  - ${j.name} (${j.conclusion})`).join('\n');
              core.setFailed(`Delivery blocked: ci.yml on SHA ${sha} has non-advisory failures.\n${detail}\nRun: ${latest.html_url}`);
              return;
            }

            // Unclassified red => also block. Today this case blocked silently
            // through the same generic fall-through message; the message now
            // names the fix (TRUTH-09).
            const unclassifiedFailures = notGreen.filter(j => classify(j.name) === 'unclassified');

            if (unclassifiedFailures.length > 0) {
              const detail = unclassifiedFailures.map(j => `  - ${j.name} (${j.conclusion})`).join('\n');
              core.setFailed(`Delivery blocked: ci.yml on SHA ${sha} has unclassified lane failure(s). Add the lane to Mailglass.CILanes and to this step's arrays (TRUTH-09):\n${detail}\nRun: ${latest.html_url}`);
              return;
            }

            // Unclassified green => WARN only, never setFailed. Failing here
            // would change the publish posture D-02 requires preserved
            // byte-for-byte (today, green-but-unrecognized passes silently).
            // The hard failure for this case lives in the meta-test
            // (test/scripts/lane_classification_drift_test.exs), which runs on
            // the PR that adds the lane — the correct place and time.
            const unclassifiedGreen = jobs.filter(
              j => j.conclusion === 'success' && classify(j.name) === 'unclassified'
            );

            if (unclassifiedGreen.length > 0) {
              const detail = unclassifiedGreen.map(j => `  - ${j.name}`).join('\n');
              core.warning(`ci.yml on SHA ${sha} has job(s) with no recorded classification. Add them to Mailglass.CILanes and to this step's arrays (TRUTH-09):\n${detail}\nRun: ${latest.html_url}`);
            }

            const advisoryFailures = notGreen.filter(j => classify(j.name) === 'advisory');

            if (advisoryFailures.length > 0) {
              const detail = advisoryFailures.map(j => `  - ${j.name} (${j.conclusion})`).join('\n');
              core.warning(`ci.yml on SHA ${sha} passed all required lanes; advisory lanes still red:\n${detail}\nRun: ${latest.html_url}`);
            }

            // ===============================================================
            // advisory-matrix.yml verdict (Phase 143 / HARNESS-04, D-19/D-23).
            //
            // Everything ABOVE this line is the pre-existing ci.yml verdict and is
            // unchanged. Everything below is additive and reads a SECOND workflow.
            // The previous step has already guaranteed a COMPLETED run exists on
            // this SHA, dispatching one if the anti-recursion gap left none.
            //
            // The decision table, stated once:
            //   1. A gating leg that is ABSENT is not green. Missing, cancelled and
            //      skipped block with the same weight as failure.
            //   2. Absent is never PERMANENTLY blocking — the previous step
            //      self-heals by dispatch, its deadline is bounded, and every
            //      message below names the exact recovery command.
            //   3. An advisory leg's absence is WARNED, not blocked, and the message
            //      says why.
            //   4. An unclassified advisory-matrix lane that is RED blocks; green
            //      only warns — mirroring the ci.yml posture above. The hard failure
            //      for an unclassified lane belongs in the drift meta-test on the
            //      pull request that adds the lane, not here.
            // ===============================================================
            const ref = process.env.RESOLVED_REF;

            // The dispatch-only override (D-23), inert on the release event so the
            // hands-free path can never self-skip. It suspends ONLY the Core Full
            // Suite verdict: every ci.yml lane verdict above already ran unchanged,
            // and the unclassified-red rule below still blocks.
            const skipCoreFullSuiteGate =
              process.env.SKIP_CORE_FULL_SUITE_GATE === 'true' && context.eventName !== 'release';

            if (skipCoreFullSuiteGate) {
              const rawReason = (process.env.CORE_FULL_SUITE_GATE_SKIP_REASON || '').trim();

              if (rawReason === '') {
                core.setFailed('Delivery blocked: skip_core_full_suite_gate was set with no core_full_suite_gate_skip_reason. The reason is required — an override with no written reason is how an exception becomes a habit.');
                return;
              }

              // Untrusted free text. Collapsed to one line and reduced to a
              // conservative character set BEFORE it reaches the run summary, so it
              // can carry no markdown or HTML construct: no backtick, angle bracket,
              // ampersand, bracket, pipe, hash, asterisk or backslash survives.
              const safeReason = rawReason
                .replace(/[\r\n]+/g, ' ')
                .replace(/[^A-Za-z0-9 .,:;!?()'\/@_-]/g, '?')
                .slice(0, 300);

              core.warning(`Core Full Suite publish gate SKIPPED by dispatch override. This is an EXCEPTION, not a workflow: these two legs are the only lanes that can observe a total core regression before it reaches Hex, and Hex cannot be unpublished after 60 minutes. Reason given: ${safeReason}`);

              await core.summary
                .addHeading('Core Full Suite publish gate: SKIPPED by dispatch override', 3)
                .addRaw('This publish did not wait for, and was not gated on, the two Elixir 1.18 / OTP 27 Core Full Suite legs. The reason supplied by the dispatcher is untrusted free text and is rendered below as a code block, never as markdown:')
                .addCodeBlock(safeReason)
                .write();
            }

            const amRunRecovery =
              `Recovery — re-run the lane, then re-dispatch this workflow:\n` +
              `  gh workflow run advisory-matrix.yml --ref ${ref}\n` +
              `  gh workflow run publish-hex.yml -f tag=${ref} -f package=all -f dry_run=false`;

            const amRuns = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'advisory-matrix.yml',
              head_sha: sha,
              per_page: 10
            });

            // Fail closed on a zero-run API response, exactly as the ci.yml lookup
            // above does. A check that cannot observe its subject must not report
            // success.
            if (amRuns.data.total_count === 0) {
              const msg = `Delivery blocked: no advisory-matrix.yml runs found for SHA ${sha}. The self-heal step should have dispatched one — inspect its log before retrying.\n${amRunRecovery}`;
              if (skipCoreFullSuiteGate) {
                core.warning(`Override active — publishing without this check. It would otherwise have blocked:\n${msg}`);
                return;
              }
              core.setFailed(msg);
              return;
            }

            // Prefer the newest COMPLETED run rather than the newest run outright:
            // the fan-out can leave a second, still-running dispatch on the same
            // SHA, and reading its null conclusions would block a release for a
            // reason that is about timing, not about the tree. Every run on this
            // SHA tests the same tree, so any completed one is a legitimate reading.
            const amCompleted = amRuns.data.workflow_runs.filter(r => r.status === 'completed');

            if (amCompleted.length === 0) {
              const msg = `Delivery blocked: advisory-matrix.yml has runs for SHA ${sha} but none has completed. A run still in progress is not a green run.\n${amRunRecovery}`;
              if (skipCoreFullSuiteGate) {
                core.warning(`Override active — publishing without this check. It would otherwise have blocked:\n${msg}`);
                return;
              }
              core.setFailed(msg);
              return;
            }

            const amLatest = amCompleted[0];

            const amJobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner: context.repo.owner, repo: context.repo.repo, run_id: amLatest.id, per_page: 100 }
            );

            // Rule 3, first half: an advisory leg's ABSENCE is warned, never blocked,
            // and the message says WHY so nobody is left to wonder.
            const amAdvisoryMissing = ADVISORY_MATRIX_ADVISORY_LANES.filter(
              lane => !amJobs.some(j => j.name === lane)
            );

            if (amAdvisoryMissing.length > 0) {
              const detail = amAdvisoryMissing.map(l => `  - ${l} (missing)`).join('\n');
              core.warning(`advisory-matrix.yml run ${amLatest.id} on SHA ${sha} is missing advisory lane(s). Warned, not blocked — their recorded classification says they gate nothing:\n${detail}\nIf the run was triggered by a pull_request event this is a DESIGNED outcome, not a fault: the Core Full Suite Next Toolchain Advisory job carries a job-level "if: github.event_name != 'pull_request'", so it never runs on a PR.\nRun: ${amLatest.html_url}`);
            }

            // Rule 3, second half: a red advisory leg warns.
            const amAdvisoryNotGreen = amJobs.filter(
              j => classifyAdvisoryMatrix(j.name) === 'advisory' && j.conclusion !== 'success' && j.conclusion !== 'skipped'
            );

            if (amAdvisoryNotGreen.length > 0) {
              const detail = amAdvisoryNotGreen.map(j => `  - ${j.name} (${j.conclusion})`).join('\n');
              core.warning(`advisory-matrix.yml on SHA ${sha} has red advisory lane(s). These never block a publish:\n${detail}\nRun: ${amLatest.html_url}`);
            }

            // Rule 4, green half: an unclassified lane that is green warns only,
            // mirroring the ci.yml posture above.
            const amUnclassifiedGreen = amJobs.filter(
              j => j.conclusion === 'success' && classifyAdvisoryMatrix(j.name) === 'unclassified'
            );

            if (amUnclassifiedGreen.length > 0) {
              const detail = amUnclassifiedGreen.map(j => `  - ${j.name}`).join('\n');
              core.warning(`advisory-matrix.yml on SHA ${sha} has job(s) with no recorded classification. Add them to Mailglass.CILanes and to this step's advisory-matrix arrays (TRUTH-09):\n${detail}\nRun: ${amLatest.html_url}`);
            }

            // Rule 1: presence loop over the gating legs, mirroring the required-lane
            // loop above. A missing job, a cancelled conclusion and a skipped
            // conclusion all land here with the same weight as a failure — that is
            // the whole point, and it is why this is a loop over the DECLARED lanes
            // rather than a filter over the jobs the API happened to return.
            const amGatingBlocking = [];
            for (const lane of ADVISORY_MATRIX_GATING_LANES) {
              const job = amJobs.find(j => j.name === lane);
              if (!job) {
                amGatingBlocking.push(`${lane} (missing)`);
              } else if (job.conclusion !== 'success') {
                amGatingBlocking.push(`${lane} (${job.conclusion})`);
              }
            }

            if (amGatingBlocking.length > 0) {
              const detail = amGatingBlocking.map(s => `  - ${s}`).join('\n');
              const overrideRecovery =
                `Recovery — publish anyway (an EXCEPTION; the reason is required and is echoed to the run summary):\n` +
                `  gh workflow run publish-hex.yml -f tag=${ref} -f package=all -f dry_run=false \\\n` +
                `    -f skip_core_full_suite_gate=true -f core_full_suite_gate_skip_reason="<why>"`;
              const msg = `Delivery blocked: Core Full Suite gating lane(s) did not pass on SHA ${sha}:\n${detail}\nRun: ${amLatest.html_url}\n${amRunRecovery}\n${overrideRecovery}`;

              if (!skipCoreFullSuiteGate) {
                core.setFailed(msg);
                return;
              }
              core.warning(`Override active — publishing without this check. It would otherwise have blocked:\n${msg}`);
            }

            // Rule 4, red half: an unclassified advisory-matrix lane that is red
            // blocks. It is not part of the Core Full Suite gate, so it is checked
            // after it and reported on its own terms.
            const amUnclassifiedRed = amJobs.filter(
              j => j.conclusion !== 'success' && j.conclusion !== 'skipped' && classifyAdvisoryMatrix(j.name) === 'unclassified'
            );

            if (amUnclassifiedRed.length > 0) {
              const detail = amUnclassifiedRed.map(j => `  - ${j.name} (${j.conclusion})`).join('\n');
              core.setFailed(`Delivery blocked: advisory-matrix.yml on SHA ${sha} has unclassified lane failure(s). Add the lane to Mailglass.CILanes and to this step's advisory-matrix arrays (TRUTH-09):\n${detail}\nRun: ${amLatest.html_url}`);
              return;
            }

            core.info(`advisory-matrix.yml run ${amLatest.id} on ${sha}: both Core Full Suite gating legs green.`);

  publish-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [gate-ci-green, prepublish-summary]
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.dry_run != 'true' &&
      needs.prepublish-summary.outputs.authorized == 'true' &&
      github.event.inputs.candidate_digest == needs.prepublish-summary.outputs.candidate_digest &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.package == 'all'
    environment: hex-publish
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepublish-summary.outputs.tag_sha }}
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Assert pinned protected release tree
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepublish-summary.outputs.tag_sha }}"
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
      - name: Install deps
        run: mix deps.get
      - name: Read mailglass version from mix.exs
        id: version
        run: |
          VERSION=$(grep -E '@version "[0-9]' mix.exs | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Skip if version already on Hex
        id: idempotency
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$(scripts/release_policy_hex_release_state.sh mailglass "${VERSION}")" = exists ]; then
            echo "Nothing to do: version ${VERSION} of mailglass is already on Hex; skipping publish (idempotency guard)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish mailglass to Hex.pm
        if: steps.idempotency.outputs.skip != 'true'
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            mix hex.publish --dry-run
          else
            mix hex.publish --yes
          fi
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      - name: Wait for Hex.pm to index
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEADLINE=$(( SECONDS + 300 ))
          until mix hex.info mailglass "${VERSION}" 2>/dev/null; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "Delivery blocked: Hex.pm did not index mailglass ${VERSION} within 5 minutes."
              exit 1
            fi
            echo "Waiting for Hex.pm to index mailglass ${VERSION}..."
            sleep 15
          done
          echo "Hex.pm indexed mailglass ${VERSION}."

  publish-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [gate-ci-green, prepublish-summary, publish-core]
    # Linked core/admin releases publish admin only after a successful core
    # publish. Inbound is independently versioned and release-event ineligible;
    # dispatch-only recovery may still publish it or all packages explicitly.
    if: |
      always() &&
      github.event.inputs.dry_run != 'true' &&
      needs.prepublish-summary.outputs.authorized == 'true' &&
      github.event.inputs.candidate_digest == needs.prepublish-summary.outputs.candidate_digest &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.package == 'all' &&
      needs.gate-ci-green.result == 'success' &&
      needs.publish-core.result == 'success'
    environment: hex-publish
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepublish-summary.outputs.tag_sha }}
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Assert pinned protected release tree
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepublish-summary.outputs.tag_sha }}"
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
      - name: Install deps (MIX_PUBLISH=true → resolves :mailglass as Hex package)
        # mailglass_admin/mix.exs has a conditional `mailglass_dep/0`:
        # MIX_PUBLISH=true → {:mailglass, "== 0.1.0"} from Hex
        # otherwise → {:mailglass, path: "..", override: true}
        # `mix deps.get` must run with MIX_PUBLISH=true so the lock + fetch
        # match what `mix hex.publish` will resolve in the next step.
        #
        # Dry-run skips this step: at a release where mailglass's linked
        # version is not yet on Hex (e.g., the v1.0.0 cut, or any future
        # minor/patch where dry-run runs before live core publish), the
        # MIX_PUBLISH=true `mix deps.get` cannot resolve. Tarball-integrity
        # validation for siblings is already covered by `prepublish-summary`
        # via `mix mailglass.publish.check`. Live mode is unaffected — the
        # subsequent `Wait for Hex.pm to index` step blocks until publish-core
        # finishes, then this resolution succeeds normally.
        if: github.event.inputs.dry_run != 'true'
        working-directory: mailglass_admin
        env:
          MIX_PUBLISH: "true"
        # Same stale-registry workaround as publish-inbound: the linked core was
        # just published, so clear the Hex registry cache and retry deps.get until
        # the freshly-published version resolves.
        run: |
          # The just-published linked core (mailglass) can raise transitive
          # requirements that the committed sibling mix.lock still pins to older
          # versions (e.g. mailglass 1.8.0 needs premailex ~> 1.0 while the lock
          # pins premailex 0.3.x) — yielding an offline "the lock is incompatible
          # with mailglass" / "version solving failed". Unlock so deps.get
          # re-resolves the published core and its updated transitive deps. Retry
          # for index/CDN propagation slack right after publish-core.
          for attempt in 1 2 3 4 5 6; do
            mix deps.unlock --all || true
            if mix deps.get; then exit 0; fi
            echo "deps.get attempt ${attempt} failed (linked core not yet resolvable); retrying in 20s"
            sleep 20
          done
          mix deps.unlock --all || true
          mix deps.get
      - name: Read mailglass_admin version from mix.exs
        id: version
        working-directory: mailglass_admin
        run: |
          VERSION=$(grep -E '@version "[0-9]' mix.exs | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Skip if version already on Hex
        id: idempotency
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$(scripts/release_policy_hex_release_state.sh mailglass_admin "${VERSION}")" = exists ]; then
            echo "Nothing to do: version ${VERSION} of mailglass_admin is already on Hex; skipping publish (idempotency guard)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish mailglass_admin to Hex.pm
        # Skipped in dry-run: tarball-integrity is validated upstream by
        # `prepublish-summary`'s `mix mailglass.publish.check`. The per-sibling
        # `mix hex.publish --dry-run` here would require deps to have resolved,
        # which fails when the linked-version pin isn't yet on Hex (see
        # `Install deps (MIX_PUBLISH=true)` step note above).
        if: github.event.inputs.dry_run != 'true' && steps.idempotency.outputs.skip != 'true'
        working-directory: mailglass_admin
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          MIX_PUBLISH: "true"

  publish-inbound:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [gate-ci-green, prepublish-summary, publish-core, publish-admin]
    # Inbound is independently versioned and can only be published by an
    # explicit recovery dispatch. A failed or skipped gate never exposes the
    # protected publishing environment.
    if: |
      always() &&
      github.event.inputs.dry_run != 'true' &&
      needs.prepublish-summary.outputs.authorized == 'true' &&
      github.event.inputs.candidate_digest == needs.prepublish-summary.outputs.candidate_digest &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.package == 'all' &&
      needs.gate-ci-green.result == 'success' &&
      needs.publish-core.result == 'success' &&
      needs.publish-admin.result == 'success'
    environment: hex-publish
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepublish-summary.outputs.tag_sha }}
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Assert pinned protected release tree
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepublish-summary.outputs.tag_sha }}"
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
      - name: Install deps (MIX_PUBLISH=true → resolves :mailglass as Hex package)
        # mailglass_inbound/mix.exs has a conditional dep selector:
        # MIX_PUBLISH=true → {:mailglass, "== <version>"} from Hex
        # otherwise → {:mailglass, path: "..", override: true}
        # `mix deps.get` must run with MIX_PUBLISH=true so the lock + fetch
        # match what `mix hex.publish` will resolve in the next step.
        #
        # Dry-run skips this step: same rationale as the publish-admin job —
        # mailglass's linked version isn't yet on Hex during a dry-run dispatch
        # at a v1.x.0 cut, so MIX_PUBLISH=true `mix deps.get` can't resolve.
        # Tarball validation is upstream in `prepublish-summary`; live mode is
        # unaffected because `Wait for Hex.pm to index` runs first.
        if: github.event.inputs.dry_run != 'true'
        working-directory: mailglass_inbound
        env:
          MIX_PUBLISH: "true"
        # The linked core (mailglass) was published moments ago by publish-core.
        # A stale local Hex registry cache fails to resolve the just-published
        # version — observed as a sub-100ms offline "version solving failed" for
        # `{:mailglass, "== <core>"}`. Drop the registry cache and retry so
        # deps.get re-fetches the live registry (with index/CDN-propagation slack).
        run: |
          # The just-published linked core (mailglass) can raise transitive
          # requirements that the committed sibling mix.lock still pins to older
          # versions (e.g. mailglass 1.8.0 needs premailex ~> 1.0 while the lock
          # pins premailex 0.3.x) — yielding an offline "the lock is incompatible
          # with mailglass" / "version solving failed". Unlock so deps.get
          # re-resolves the published core and its updated transitive deps. Retry
          # for index/CDN propagation slack right after publish-core.
          for attempt in 1 2 3 4 5 6; do
            mix deps.unlock --all || true
            if mix deps.get; then exit 0; fi
            echo "deps.get attempt ${attempt} failed (linked core not yet resolvable); retrying in 20s"
            sleep 20
          done
          mix deps.unlock --all || true
          mix deps.get
      - name: Read mailglass_inbound version from mix.exs
        id: version
        working-directory: mailglass_inbound
        run: |
          VERSION=$(grep -E '@version "[0-9]' mix.exs | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Skip if version already on Hex
        id: idempotency
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$(scripts/release_policy_hex_release_state.sh mailglass_inbound "${VERSION}")" = exists ]; then
            echo "Nothing to do: version ${VERSION} of mailglass_inbound is already on Hex; skipping publish (idempotency guard)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish mailglass_inbound to Hex.pm
        # Skipped in dry-run: tarball-integrity is validated upstream by
        # `prepublish-summary`'s `mix mailglass.publish.check`. Same rationale
        # as publish-admin — the per-sibling `mix hex.publish --dry-run` needs
        # deps to have resolved, which fails when mailglass's linked version
        # isn't yet on Hex.
        if: github.event.inputs.dry_run != 'true' && steps.idempotency.outputs.skip != 'true'
        working-directory: mailglass_inbound
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          MIX_PUBLISH: "true"

  dispatch-post-publish-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepublish-summary, publish-inbound]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true' && github.event.inputs.package == 'all' && needs.prepublish-summary.outputs.authorized == 'true' && needs.publish-inbound.result == 'success' }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch exact post-publish smoke handoff
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          CORE_VERSION: ${{ needs.prepublish-summary.outputs.core }}
          ADMIN_VERSION: ${{ needs.prepublish-summary.outputs.admin }}
          INBOUND_VERSION: ${{ needs.prepublish-summary.outputs.inbound }}
          TARGET_REF: ${{ needs.prepublish-summary.outputs.tag_sha }}
        with:
          script: |
            const inputs = {
              core_version: process.env.CORE_VERSION || '',
              admin_version: process.env.ADMIN_VERSION || '',
              inbound_version: process.env.INBOUND_VERSION || '',
              target_ref: process.env.TARGET_REF || ''
            };
            if (![inputs.core_version, inputs.admin_version, inputs.inbound_version].every(v => /^\d+\.\d+\.\d+$/.test(v)) ||
                inputs.core_version !== inputs.admin_version || !/^[0-9a-f]{40}$/.test(inputs.target_ref)) {
              core.setFailed('Refusing smoke handoff: validated versions or immutable target_ref are malformed.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'post-publish-smoke.yml',
              ref: 'main',
              inputs
            });
