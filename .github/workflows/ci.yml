    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      CI: true
      PREVIEW_CAPTURE_ROOT: mailglass_admin/tmp/preview_capture_advisory
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mailglass_admin/package-lock.json
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            deps
            mailglass_admin/deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Install core deps
        run: mix deps.get
      - name: Install admin deps
        working-directory: mailglass_admin
        run: mix deps.get
      - name: Install browser test deps
        working-directory: mailglass_admin
        run: npm ci
      - name: Wait for postgres + create test DB
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres; do sleep 1; done
          mix ecto.create -r Mailglass.TestRepo --quiet
      - name: Install Playwright browser
        working-directory: mailglass_admin
        run: npx playwright install --with-deps chromium
      - name: Resolve Chromium binary path
        working-directory: mailglass_admin
        run: |
          CHROMIUM_BIN=$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")
          if [ -z "$CHROMIUM_BIN" ] || [ ! -x "$CHROMIUM_BIN" ]; then
            echo "Failed to resolve executable Chromium path from Playwright" >&2
            exit 1
          fi
          echo "MAILGLASS_ADMIN_CHROMIUM_BIN=$CHROMIUM_BIN" >> "$GITHUB_ENV"
      - name: Start deterministic preview capture server
        working-directory: mailglass_admin
        env:
          BROWSER_SERVER_PORT: "4101"
        run: |
          mix run --no-halt -e "MailglassAdmin.TestSupport.OperatorBrowserServer.run!()" > "$RUNNER_TEMP/preview-capture-server.log" 2>&1 &
          echo "PREVIEW_CAPTURE_SERVER_PID=$!" >> "$GITHUB_ENV"
      - name: Wait for preview capture server readiness
        run: |
          for _ in $(seq 1 90); do
            if node -e "fetch('http://127.0.0.1:4101/dev/mail').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          echo "Preview capture server did not become ready in time." >&2
          cat "$RUNNER_TEMP/preview-capture-server.log" || true
          exit 1
      - name: Run advisory preview capture
        working-directory: mailglass_admin
        env:
          MAILGLASS_ADMIN_CHROMIUM_BIN: ${{ env.MAILGLASS_ADMIN_CHROMIUM_BIN }}
        run: |
          mix mailglass_admin.preview.capture \
            --base-url http://127.0.0.1:4101/dev/mail \
            --mailables MailglassAdmin.Fixtures.HappyMailer \
            --output-dir tmp/preview_capture_advisory/screenshots \
            --manifest-out tmp/preview_capture_advisory/manifest.json \
            --checkpoint-out tmp/preview_capture_advisory/checkpoint.json
      - name: Validate preview capture checkpoint contract
        run: |
          bash scripts/check_preview_capture_checkpoint.sh \
            --manifest "${{ env.PREVIEW_CAPTURE_ROOT }}/manifest.json" \
            --checkpoint "${{ env.PREVIEW_CAPTURE_ROOT }}/checkpoint.json" \
            --screenshots-dir "${{ env.PREVIEW_CAPTURE_ROOT }}/screenshots"
      - name: Upload preview capture advisory artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: preview-capture-advisory-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.PREVIEW_CAPTURE_ROOT }}/screenshots
            ${{ env.PREVIEW_CAPTURE_ROOT }}/manifest.json
            ${{ env.PREVIEW_CAPTURE_ROOT }}/checkpoint.json
      - name: Print preview capture server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/preview-capture-server.log" || true
      - name: Stop preview capture server
        if: always()
        run: |
          if [ -n "${PREVIEW_CAPTURE_SERVER_PID:-}" ]; then
            kill "$PREVIEW_CAPTURE_SERVER_PID" || true
          fi

