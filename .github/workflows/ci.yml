          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Install deps
        run: mix deps.get
      - name: Wait for postgres + create test DB
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres; do sleep 1; done
          mix ecto.create -r Mailglass.TestRepo --quiet
      - name: Build published Admin compatibility gate
        # Repo-head trust is explicitly prepublication: core + inbound come
        # from coherent workspace builds, while Admin remains the established
        # published compatibility gate. Plan 160-06 owns exact all-published
        # package-family certification.
        working-directory: reference/host_app
        env:
          MIX_ENV: dev
        run: mix deps.get && mix compile
      - name: Build workspace inbound package
        working-directory: mailglass_inbound
        env:
          MIX_ENV: test
        run: mix deps.get --check-locked && mix compile --warnings-as-errors
      - name: Run reference-host trust journey
        env:
          MAILGLASS_REFERENCE_HOST_PACKAGE_MODE: prepublication
          MAILGLASS_CORE_WORKSPACE_EBIN: ${{ github.workspace }}/_build/test/lib/mailglass/ebin
          MAILGLASS_INBOUND_WORKSPACE_EBIN: ${{ github.workspace }}/mailglass_inbound/_build/test/lib/mailglass_inbound/ebin
        run: mix verify.reference_host.journey
      - name: Validate trust checkpoint contract
        run: bash scripts/check_trust_runner_checkpoint.sh
      - name: Print checkpoint SHA for human-glance evidence
        run: |
          echo "## Trust Runner Checkpoint (repo head)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- schema_version: \(.schema_version)\n- claim_boundary: \(.claim_boundary)\n- checkpoint_count: \(.checkpoint_count)\n- checkpoint_sha256: \(.checkpoint_sha256)"' \
            tmp/mailglass_trust_runner/checkpoint.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload trust-runner repo-head artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trust-runner-repo-head-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: tmp/mailglass_trust_runner/checkpoint.json

  trust_lane_clean_baseline:
    name: Trust Lane Clean Baseline (Elixir 1.18 / OTP 27)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Publish-gate-only: NOT in REQUIRED_CHECKS (D-04/A1 lock) and NOT in
    # ci_green.needs. Gated on changes so docs-only PRs skip it.
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Install deps
        run: mix deps.get
      - name: Wait for postgres + create test DB
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres; do sleep 1; done
          mix ecto.create -r Mailglass.TestRepo --quiet
      - name: Build reference host (dev) so the journey can load sibling beams
        working-directory: reference/host_app
        env:
          MIX_ENV: dev
        run: mix deps.get && mix compile
      - name: Assert clean Hex-first baseline
        working-directory: reference/host_app
        run: bash ../../scripts/check_clean_baseline_hex_only.sh
      - name: Run reference-host trust journey
        env:
          MAILGLASS_REFERENCE_HOST_PACKAGE_MODE: published_siblings
        run: mix verify.reference_host.journey --host-root reference/host_app
      - name: Validate trust checkpoint contract
        run: bash scripts/check_trust_runner_checkpoint.sh
      - name: Print checkpoint SHA for human-glance evidence
        run: |
          echo "## Trust Runner Checkpoint (clean baseline)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- schema_version: \(.schema_version)\n- claim_boundary: \(.claim_boundary)\n- checkpoint_count: \(.checkpoint_count)\n- checkpoint_sha256: \(.checkpoint_sha256)"' \
            tmp/mailglass_trust_runner/checkpoint.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload trust-runner clean-baseline artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trust-runner-clean-baseline-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: tmp/mailglass_trust_runner/checkpoint.json

  branch_protection_advisory:
    name: Branch Protection Advisory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for BRANCH_PROTECTION_PAT secret
        id: check-pat
        env:
          PAT_SET: ${{ secrets.BRANCH_PROTECTION_PAT != '' }}
        run: |
          if [ "$PAT_SET" = "true" ]; then
            echo "pat_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "pat_present=false" >> "$GITHUB_OUTPUT"
            echo "classification=cannot_check" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify branch protection
        if: steps.check-pat.outputs.pat_present == 'true'
        id: verify-protection
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          classification=$(./scripts/branch-protection-outcome.sh probe main)
          echo "classification=$classification" >> "$GITHUB_OUTPUT"

      - name: Report branch protection outcome
        if: always()
        run: |
          ./scripts/branch-protection-outcome.sh report "${{ steps.verify-protection.outputs.classification || steps.check-pat.outputs.classification || 'unknown' }}"

  ci_green:
    name: CI Green
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always()
    needs:
      - changes
      - format_check
      - compile_warnings
      - compile_no_optional_deps
      - inbound_compile_no_optional_deps
      - installer_host_smoke
      - installer_golden_gate
      - mix_task_tests
      - support_contract_core
      - support_contract_admin
      - inbound_test
      - core_deterministic_suite
      - credo_strict
      - conformance_gates
      - docs_warnings_as_errors
      - dialyzer
      - inbound_dialyzer
      - trust_lane_repo_head
      - hex_audit
      - deps_audit_advisory
    steps:
      - name: Evaluate required lane results
        run: |
          bash scripts/ci_green_policy.sh \
            "${{ needs.changes.result }}" \
            "${{ needs.changes.outputs.code }}" \
            "format_check=${{ needs.format_check.result }}" \
            "compile_warnings=${{ needs.compile_warnings.result }}" \
            "compile_no_optional_deps=${{ needs.compile_no_optional_deps.result }}" \
            "inbound_compile_no_optional_deps=${{ needs.inbound_compile_no_optional_deps.result }}" \
            "installer_host_smoke=${{ needs.installer_host_smoke.result }}" \
            "installer_golden_gate=${{ needs.installer_golden_gate.result }}" \
            "mix_task_tests=${{ needs.mix_task_tests.result }}" \
            "support_contract_core=${{ needs.support_contract_core.result }}" \
            "support_contract_admin=${{ needs.support_contract_admin.result }}" \
            "inbound_test=${{ needs.inbound_test.result }}" \
            "core_deterministic_suite=${{ needs.core_deterministic_suite.result }}" \
            "credo_strict=${{ needs.credo_strict.result }}" \
            "conformance_gates=${{ needs.conformance_gates.result }}" \
            "docs_warnings_as_errors=${{ needs.docs_warnings_as_errors.result }}" \
            "dialyzer=${{ needs.dialyzer.result }}" \
            "inbound_dialyzer=${{ needs.inbound_dialyzer.result }}" \
            "trust_lane_repo_head=${{ needs.trust_lane_repo_head.result }}" \
            "hex_audit=${{ needs.hex_audit.result }}" \
            "deps_audit_advisory=${{ needs.deps_audit_advisory.result }}"
