name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Manual dispatch is required for the release-please PR head ref.
    # GITHUB_TOKEN-driven pushes (release-please bot) do NOT trigger
    # `push` or `pull_request` events (GitHub anti-recursion), so
    # `publish-hex.yml`'s `gate-ci-green` job cannot find ci.yml runs
    # on the PR head SHA without an explicit dispatch on the PR ref.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Non-Doc Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - name: Compute changed-path gate
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A dispatched release run must always execute the full matrix.
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="HEAD"
            CHANGED=$(git diff --name-only "${BASE}...${HEAD}" 2>/dev/null || git diff --name-only "${BASE}" "${HEAD}")
            NON_DOC=$(echo "$CHANGED" | grep -v '^\.planning/' | grep -v '^prompts/' || true)
            if [ -z "$NON_DOC" ]; then
              echo "code=false" >> "$GITHUB_OUTPUT"
            else
              echo "code=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # push event: compare against the before SHA
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "code=true" >> "$GITHUB_OUTPUT"
            else
              CHANGED=$(git diff --name-only "${BEFORE}" "${AFTER}" 2>/dev/null || true)
              NON_DOC=$(echo "$CHANGED" | grep -v '^\.planning/' | grep -v '^prompts/' || true)
              if [ -z "$NON_DOC" ]; then
                echo "code=false" >> "$GITHUB_OUTPUT"
              else
                echo "code=true" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

  format_check:
    name: Format Check (Elixir 1.18 / OTP 27)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Install deps
        run: mix deps.get
      - name: Run formatter check
        run: mix format --check-formatted

  compile_warnings:
    name: Compile Warnings as Errors (Elixir 1.18 / OTP 27)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Install deps
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors

  compile_no_optional_deps:
    name: Compile No Optional Deps (Elixir 1.18 / OTP 27)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Required leaf behind CI Green aggregate — keep matrix-free. A 1-combo matrix
    # makes GitHub append " (1.18, 27)" to the check name, which would break any
    # job-name-based mapping. CI Green is the registered branch-protection context.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Install deps
        run: mix deps.get
      - name: Compile without optional deps
        run: mix compile --no-optional-deps --warnings-as-errors

  installer_host_smoke:
    name: Installer Host Smoke
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Shift-left of the post-publish consumer-install smoke: runs the SAME
    # scripts/consumer_install_smoke.sh against the WORKING TREE (local path
    # deps) — phx.new -> install -> OPS-01 guard -> compile --warnings-as-errors
    # -> boot -> GET /dev/mail/. Catches installer codegen / compile / runtime /
    # boot regressions on the PR instead of after publishing (the gap that let
    # the 1.4.3-1.4.5 install bug stack ship). The fast in-process counterpart is
    # test/mailglass/install/install_compile_test.exs.
    #
    # Required (promoted from advisory once proven stable): this is a
    # branch-protection context in scripts/setup_branch_protection.sh. It is
    # network-dependent (phx.new + the sandbox's own deps.get + server boot)
    # and slower than the other required lanes, but guards the install path
    # that the 1.4.3-1.4.5 bug stack shipped through.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Consumer install smoke (working tree, local path deps)
        env:
          DEP_MODE: path
          MAILGLASS_PATH: ${{ github.workspace }}
          WORK_DIR: ${{ runner.temp }}
        run: bash scripts/consumer_install_smoke.sh

  support_contract_core:
    name: Support Contract Core (Elixir 1.18 / OTP 27)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Required leaf behind CI Green aggregate — keep matrix-free (see
    # compile_no_optional_deps): a 1-combo matrix appends " (1.18, 27)" to the name.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Install deps
        run: mix deps.get
      - name: Wait for postgres + create test DB
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres; do sleep 1; done
          mix ecto.create -r Mailglass.TestRepo --quiet
      - name: Run core support contract
        run: mix verify.support_contract.core

  mix_task_tests:
    name: Mix Task Tests (Elixir 1.18 / OTP 27)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Install deps
        run: mix deps.get
      - name: Wait for postgres + create test DB
        # The core test_helper.exs boots Mailglass.TestRepo (runs migrations),
        # so even though the mix.gen.* generator tests run in-memory via
        # Igniter.Test and never touch the DB, the test run requires the DB.
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres; do sleep 1; done
          mix ecto.create -r Mailglass.TestRepo --quiet
      - name: Run mix-task / generator tests
        # Directory-scoped (test/mix/tasks/) so newly-added task tests can't
        # silently escape CI — closes the drift gap that left the Phase-47
        # inbound generators advisory-only. See the verify.mix_tasks alias note.
        run: mix verify.mix_tasks
      - name: Run CI lane-contract meta-tests
        # This job is chosen because it is publish-gating rather than
        # merge-gating (TRUTH-07, Phase 141): registry drift between
        # publish-hex.yml's REQUIRED_LANES and Mailglass.CILanes.required_lanes/0
        # should block a Hex publish, not a PR merge. The job already provisions
        # Postgres and creates the test DB above, which test/test_helper.exs
        # requires even though these meta-tests never touch the database.
        run: mix verify.ci_lane_contract

  inbound_test:
    name: Inbound Test (Elixir 1.18 / OTP 27)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            deps
            mailglass_inbound/deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Install core deps
        run: mix deps.get
      - name: Install inbound deps
        working-directory: mailglass_inbound
        run: mix deps.get
      - name: Wait for postgres + create test DB
        # mailglass_inbound/test/test_helper.exs runs the inbound migrations
        # against MailglassInbound.TestRepo (database "mailglass_inbound_test");
        # the database must exist before tests start. Create it from the inbound
        # project context where MailglassInbound.TestRepo is available.
        working-directory: mailglass_inbound
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres; do sleep 1; done
          mix ecto.create -r MailglassInbound.TestRepo --quiet
      - name: Run inbound tests
        # --exclude property: the 1000-run convergence property is gated
        # separately in the step below; this runs the fast unit subset first.
        working-directory: mailglass_inbound
        run: mix test --exclude property
      - name: Run inbound convergence property (TELE-08)
        # --only property: the TELE-08 1000-run replay-convergence proof runs
        # against the real MailglassInbound.TestRepo Postgres DB created above.
        # It is `timeout: :infinity` (StreamData drives 1000 iterations), so it
        # is gated as its own step after the unit subset rather than folded in.
        working-directory: mailglass_inbound
        run: mix test --only property

  inbound_compile_no_optional_deps:
    name: Inbound Compile No Optional Deps (Elixir 1.18 / OTP 27)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Compile-only gate (no Postgres, no MIX_ENV: test). Exercises the inbound→core
    # cross-package reference (MailglassInbound.Execution.Worker → Mailglass.Oban.TenancyMiddleware)
    # under `--no-optional-deps`, where Oban is stripped from both inbound's dep and
    # the path-dep core. The core `compile_no_optional_deps` lane uses `--only test`
    # and never builds inbound, so it never touches this path — this job is additive.
    # Separate job (not a step in inbound_test) so a compile-gate failure is legible
    # in the checks list and runs in parallel.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            deps
            mailglass_inbound/deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Install core deps
        run: mix deps.get
      - name: Install inbound deps
        working-directory: mailglass_inbound
        run: mix deps.get
      - name: Compile inbound without optional deps
        working-directory: mailglass_inbound
        run: mix compile --no-optional-deps --warnings-as-errors

  credo_strict:
    name: Credo Strict (Elixir 1.18 / OTP 27)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Install deps
        run: mix deps.get
      - name: Verify suppression docs (shell gate)
        # Fails CI if any {Credo.Check..., false} entry is missing
        # a `# Reason:` + `# Tracking:` comment block (D-08-18/D-08-19).
        run: bash scripts/check_credo_suppressions.sh
      - name: Run Credo strict
        run: mix credo --strict

  conformance_gates:
    name: Design System Conformance (shell gates)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Verify motion conformance (shell gate)
        # Fails CI if any banned layout-thrashing or easing token appears
        # in lib/ or app.css per UI-SPEC Motion Rules (Phase 74 FROZEN contract, GAP-19 sev 3).
        run: bash scripts/check_motion_conformance.sh
      - name: Verify design-system conformance (shell gate — hard-fail arms)
        # Wires the previously-DEAD check-conformance.sh (D-06, RATCHET-03).
        # Five hard-closed gates: BADGE / TYPE-base / BOLD / GAP / HEX.
        # Script is BASH_SOURCE-anchored — cwd-independent, run from repo root.
        run: bash mailglass_admin/scripts/check-conformance.sh
      - name: Verify design-system conformance (advisory arms — TYPE-lg/xl + TRACK)
        # Phase 99 hard-fail gate for large type-scale and arbitrary tracking regressions.
        run: bash mailglass_admin/scripts/check-conformance-advisory.sh


  dialyzer:
    name: Dialyzer (Elixir 1.18 / OTP 27)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Cache PLT
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: _build/test/*.plt
          key: plt-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-
      - name: Install deps
        run: mix deps.get
      - name: Verify ignore-file docs (shell gate)
        # Fails CI if any {file, short_description} entry in .dialyzer_ignore.exs
        # is missing a `# Reason:` comment block (D-08-27).
        run: bash scripts/check_dialyzer_ignore.sh
      - name: Run Dialyzer
        id: dialyzer
        continue-on-error: true
        run: mix dialyzer
      - name: Evict stale PLT + rebuild
        if: steps.dialyzer.outcome == 'failure'
        run: rm -rf _build/test/*.plt && mix dialyzer --plt && mix dialyzer

  docs_warnings_as_errors:
    name: Docs Warnings as Errors (Elixir 1.18 / OTP 27)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: deps
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ env.MIX_ENV || 'dev' }}-
      - name: Install deps
        run: mix deps.get
      - name: Build docs
        run: mix docs --warnings-as-errors
      - name: Validate guides have no leaked internal IDs (REL-02)
        run: mix mailglass.docs.check

  hex_audit:
    name: Hex Audit (Elixir 1.18 / OTP 27)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up OTP + Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache deps
