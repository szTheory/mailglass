  branch_protection_advisory:
    name: Branch Protection Advisory
    runs-on: ubuntu-latest
    steps:
      - name: Check for BRANCH_PROTECTION_PAT secret
        id: check-pat
        env:
          PAT_SET: ${{ secrets.BRANCH_PROTECTION_PAT != '' }}
        run: |
          if [ "$PAT_SET" = "true" ]; then
            echo "pat_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "pat_present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Branch Protection Advisory"
              echo ""
              echo "Skipped live verification because BRANCH_PROTECTION_PAT is not set."
              echo "Run \`scripts/verify-branch-protection.sh --print-expected\` locally"
              echo "to inspect the expected ruleset."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.check-pat.outputs.pat_present == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Verify branch protection
        if: steps.check-pat.outputs.pat_present == 'true'
        id: verify-protection
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/verify-branch-protection.sh main

      - name: Write advisory summary
        if: steps.check-pat.outputs.pat_present == 'true'
        run: |
          {
            echo "## Branch Protection Advisory"
            echo ""
            if [ "${{ steps.verify-protection.outcome }}" = "success" ]; then
              echo "Live branch protection matches the expected read-only ruleset."
            else
              echo "Live branch protection drifted from the expected ruleset."
              echo "Review the verifier step log and re-apply with ./scripts/setup_branch_protection.sh main."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ci_green:
    name: CI Green
    runs-on: ubuntu-latest
    if: always()
    needs:
      - compile_no_optional_deps
      - installer_host_smoke
      - support_contract_core
      - support_contract_admin
      - trust_lane_repo_head
    steps:
      - name: Evaluate required lane results
        run: |
          FAILED_LANES=""
          for job_result in \
            "compile_no_optional_deps=${{ needs.compile_no_optional_deps.result }}" \
            "installer_host_smoke=${{ needs.installer_host_smoke.result }}" \
            "support_contract_core=${{ needs.support_contract_core.result }}" \
            "support_contract_admin=${{ needs.support_contract_admin.result }}" \
            "trust_lane_repo_head=${{ needs.trust_lane_repo_head.result }}"
          do
            lane="${job_result%%=*}"
            result="${job_result##*=}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              FAILED_LANES="${FAILED_LANES} ${lane}"
            fi
          done
          if [ -n "$FAILED_LANES" ]; then
            echo "Delivery blocked: required CI lane(s) did not pass:${FAILED_LANES}"
            exit 1
          fi
          echo "All required CI lanes passed or were skipped."
