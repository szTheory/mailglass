<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="mg-palette-title mg-palette-desc">
  <title id="mg-palette-title">Mailglass palette specimen</title>
  <desc id="mg-palette-desc">Mailglass color palette and semantic state examples.</desc>
  <rect width="1200" height="760" fill="#F8FBFD"/>
  <text x="64" y="82" fill="#0D1B2A" font-family="Inter Tight, Inter, sans-serif" font-size="42" font-weight="700">Mailglass palette</text>
  <text x="64" y="116" fill="#5C6B7A" font-family="Inter, sans-serif" font-size="18">Ink, glass, frost, paper, and signal. Glass is an accent, not the whole room.</text>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">
    <g transform="translate(64 168)">
      <rect width="160" height="150" rx="8" fill="#0D1B2A"/>
      <text x="18" y="96" fill="#F8FBFD">Ink</text>
      <text x="18" y="122" fill="#A6EAF2">#0D1B2A</text>
    </g>
    <g transform="translate(244 168)">
      <rect width="160" height="150" rx="8" fill="#277B96"/>
      <text x="18" y="96" fill="#F8FBFD">Glass</text>
      <text x="18" y="122" fill="#F8FBFD">#277B96</text>
    </g>
    <g transform="translate(424 168)">
      <rect width="160" height="150" rx="8" fill="#A6EAF2" stroke="#C7DCE5"/>
      <text x="18" y="96" fill="#0D1B2A">Ice</text>
      <text x="18" y="122" fill="#0D1B2A">#A6EAF2</text>
    </g>
    <g transform="translate(604 168)">
      <rect width="160" height="150" rx="8" fill="#EAF6FB" stroke="#C7DCE5"/>
      <text x="18" y="96" fill="#0D1B2A">Mist</text>
      <text x="18" y="122" fill="#5C6B7A">#EAF6FB</text>
    </g>
    <g transform="translate(784 168)">
      <rect width="160" height="150" rx="8" fill="#F8FBFD" stroke="#C7DCE5"/>
      <text x="18" y="96" fill="#0D1B2A">Paper</text>
      <text x="18" y="122" fill="#5C6B7A">#F8FBFD</text>
    </g>
    <g transform="translate(964 168)">
      <rect width="160" height="150" rx="8" fill="#5C6B7A"/>
      <text x="18" y="96" fill="#F8FBFD">Slate</text>
      <text x="18" y="122" fill="#F8FBFD">#5C6B7A</text>
    </g>
  </g>

  <g transform="translate(64 390)">
    <text x="0" y="0" fill="#0D1B2A" font-family="Inter Tight, Inter, sans-serif" font-size="28" font-weight="700">Semantic states</text>
    <g transform="translate(0 36)" font-family="Inter, sans-serif" font-size="16">
      <rect x="0" y="0" width="252" height="72" rx="8" fill="#E8F3EA" stroke="#166534"/>
      <text x="20" y="30" fill="#166534" font-weight="700">Success</text>
      <text x="20" y="54" fill="#0D1B2A">Preview rendered.</text>
      <rect x="280" y="0" width="252" height="72" rx="8" fill="#FFF8F0" stroke="#A95F10"/>
      <text x="300" y="30" fill="#A95F10" font-weight="700">Warning</text>
      <text x="300" y="54" fill="#0D1B2A">Route matched with caveat.</text>
      <rect x="560" y="0" width="252" height="72" rx="8" fill="#FAE7E5" stroke="#B42318"/>
      <text x="580" y="30" fill="#B42318" font-weight="700">Error</text>
      <text x="580" y="54" fill="#0D1B2A">Delivery blocked.</text>
      <rect x="840" y="0" width="252" height="72" rx="8" fill="#EAF6FB" stroke="#277B96"/>
      <text x="860" y="30" fill="#277B96" font-weight="700">Info</text>
      <text x="860" y="54" fill="#0D1B2A">Headers normalized.</text>
    </g>
  </g>

  <g transform="translate(64 560)">
    <rect width="520" height="116" rx="10" fill="#0D1B2A"/>
    <text x="28" y="44" fill="#EAF6FB" font-family="Inter Tight, Inter, sans-serif" font-size="24" font-weight="700">Dark surface</text>
    <text x="28" y="76" fill="#A6EAF2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">Glass shifts toward Ice on dark backgrounds.</text>
  </g>
  <g transform="translate(636 560)">
    <rect width="500" height="116" rx="10" fill="#EAF6FB" stroke="#C7DCE5"/>
    <text x="28" y="44" fill="#0D1B2A" font-family="Inter Tight, Inter, sans-serif" font-size="24" font-weight="700">Light surface</text>
    <text x="28" y="76" fill="#5C6B7A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">Ink and Paper stay the reading pair.</text>
  </g>
</svg>
