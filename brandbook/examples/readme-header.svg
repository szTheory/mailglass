<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="mg-readme-header-title mg-readme-header-desc">
  <title id="mg-readme-header-title">Mailglass README header specimen</title>
  <desc id="mg-readme-header-desc">A restrained README header composition for Mailglass using the selected logo direction.</desc>
  <defs>
    <linearGradient id="mg-readme-header-pane" x1="14" y1="8" x2="72" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="0.54" stop-color="#EAF6FB" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#A6EAF2" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#F8FBFD"/>
  <rect x="72" y="72" width="1136" height="496" rx="12" fill="#FFFFFF" stroke="#C7DCE5"/>
  <g transform="translate(112 120)">
    <g transform="translate(0 0) scale(0.94)" color="#0D1B2A" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 32h51v33H15z" stroke="currentColor" stroke-width="5"/>
      <path d="M18 36l22.5 15L63 36" stroke="currentColor" stroke-width="4.2"/>
      <path d="M25 9h38c7.2 0 12.5 5.3 12.5 12.5v38c0 7.2-5.3 12.5-12.5 12.5H25c-7.2 0-12.5-5.3-12.5-12.5v-38C12.5 14.3 17.8 9 25 9z" fill="url(#mg-readme-header-pane)" stroke="#277B96" stroke-width="4.2" transform="rotate(-7 44 40.5)"/>
      <path d="M62 16L31 69" stroke="#A6EAF2" stroke-width="4"/>
    </g>
    <text x="78" y="56" fill="#0D1B2A" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="72" font-weight="900" letter-spacing="-1.6">mailglass</text>
  </g>
  <text x="112" y="270" fill="#277B96" font-family="Inter Tight, Inter, sans-serif" font-size="34" font-weight="700">Mail you can see through.</text>
  <text x="112" y="322" fill="#0D1B2A" font-family="Inter, sans-serif" font-size="22">A Phoenix-native framework for composing, previewing, delivering, routing,</text>
  <text x="112" y="356" fill="#0D1B2A" font-family="Inter, sans-serif" font-size="22">and observing email with production-grade feedback.</text>
  <g transform="translate(112 414)" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">
    <rect width="440" height="98" rx="8" fill="#0D1B2A"/>
    <text x="24" y="38" fill="#A6EAF2">mix deps.get</text>
    <text x="24" y="68" fill="#EAF6FB">mix mailglass.install</text>
  </g>
  <g transform="translate(600 414)" font-family="Inter, sans-serif">
    <rect width="188" height="48" rx="6" fill="#277B96"/>
    <text x="52" y="31" fill="#F8FBFD" font-size="16" font-weight="700">Read docs</text>
    <rect x="208" width="184" height="48" rx="6" fill="#FFFFFF" stroke="#C7DCE5"/>
    <text x="253" y="31" fill="#0D1B2A" font-size="16" font-weight="700">GitHub</text>
  </g>
  <text x="112" y="546" fill="#5C6B7A" font-family="Inter, sans-serif" font-size="16">Use this framing for README and package visuals: selected logo first, promise second, concrete workflow third.</text>
</svg>
