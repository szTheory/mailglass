<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Mailglass docs page specimen</title>
  <desc id="desc">A docs page layout specimen using Mailglass brand tokens.</desc>
  <rect width="1280" height="760" fill="#F8FBFD"/>
  <rect x="0" y="0" width="280" height="760" fill="#EAF6FB"/>
  <rect x="280" y="0" width="1" height="760" fill="#C7DCE5"/>
  <text x="48" y="64" fill="#0D1B2A" font-family="Inter Tight, Inter, sans-serif" font-size="28" font-weight="700">mailglass</text>
  <g font-family="Inter, sans-serif" font-size="15">
    <text x="48" y="132" fill="#277B96" font-weight="700">Getting started</text>
    <text x="48" y="176" fill="#0D1B2A">Compose a message</text>
    <text x="48" y="220" fill="#0D1B2A">Preview locally</text>
    <text x="48" y="264" fill="#0D1B2A">Delivery events</text>
    <text x="48" y="308" fill="#0D1B2A">Inbound routing</text>
    <text x="48" y="352" fill="#0D1B2A">Troubleshooting</text>
  </g>
  <g transform="translate(344 72)">
    <text x="0" y="0" fill="#0D1B2A" font-family="Inter Tight, Inter, sans-serif" font-size="44" font-weight="700">Preview a message locally</text>
    <text x="0" y="44" fill="#5C6B7A" font-family="Inter, sans-serif" font-size="18">Render the actual HTML and text parts before they reach a provider.</text>
    <rect x="0" y="96" width="760" height="160" rx="8" fill="#0D1B2A"/>
    <text x="28" y="140" fill="#A6EAF2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">def preview(assigns) do</text>
    <text x="28" y="176" fill="#EAF6FB" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">  user = fixture_user()</text>
    <text x="28" y="212" fill="#8BB77F" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">  welcome(user)</text>
    <rect x="0" y="300" width="760" height="92" rx="8" fill="#EAF6FB" stroke="#277B96"/>
    <text x="28" y="334" fill="#0D1B2A" font-family="Inter, sans-serif" font-size="16" font-weight="700">Why this matters</text>
    <text x="28" y="364" fill="#0D1B2A" font-family="Inter, sans-serif" font-size="16">A preview should show the message that will actually ship, not a fake marketing mock.</text>
    <text x="0" y="466" fill="#0D1B2A" font-family="Inter Tight, Inter, sans-serif" font-size="28" font-weight="700">Next steps</text>
    <rect x="0" y="500" width="232" height="80" rx="8" fill="#FFFFFF" stroke="#C7DCE5"/>
    <text x="24" y="536" fill="#0D1B2A" font-family="Inter, sans-serif" font-size="16" font-weight="700">Inspect headers</text>
    <text x="24" y="562" fill="#5C6B7A" font-family="Inter, sans-serif" font-size="14">Verify provider output.</text>
    <rect x="264" y="500" width="232" height="80" rx="8" fill="#FFFFFF" stroke="#C7DCE5"/>
    <text x="288" y="536" fill="#0D1B2A" font-family="Inter, sans-serif" font-size="16" font-weight="700">Send safely</text>
    <text x="288" y="562" fill="#5C6B7A" font-family="Inter, sans-serif" font-size="14">Respect suppression state.</text>
  </g>
</svg>
