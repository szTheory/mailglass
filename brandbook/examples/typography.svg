<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="mg-typography-title mg-typography-desc">
  <title id="mg-typography-title">Mailglass typography specimen</title>
  <desc id="mg-typography-desc">Mailglass typography hierarchy using Inter Tight, Inter, and IBM Plex Mono fallbacks.</desc>
  <rect width="1200" height="760" fill="#F8FBFD"/>
  <g transform="translate(72 86)">
    <text x="0" y="0" fill="#0D1B2A" font-family="Inter Tight, Inter, sans-serif" font-size="52" font-weight="700" letter-spacing="0">Mailglass</text>
    <text x="0" y="46" fill="#277B96" font-family="Inter Tight, Inter, sans-serif" font-size="36" font-weight="700" letter-spacing="0">Email, made visible.</text>
    <text x="0" y="96" fill="#0D1B2A" font-family="Inter, sans-serif" font-size="20">Compose, preview, deliver, and inspect email in a Phoenix-native workflow.</text>
  </g>
  <g transform="translate(72 260)" font-family="Inter, sans-serif">
    <text x="0" y="0" fill="#0D1B2A" font-size="24" font-weight="700">Docs explanation style</text>
    <text x="0" y="42" fill="#0D1B2A" font-size="17">Start with the concrete action. Use short paragraphs. Explain recovery paths.</text>
    <text x="0" y="76" fill="#5C6B7A" font-size="15">Avoid theatrical product claims. Let the API and examples carry confidence.</text>
  </g>
  <g transform="translate(72 410)">
    <rect width="500" height="180" rx="8" fill="#0D1B2A"/>
    <text x="26" y="42" fill="#A6EAF2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">$ mix mailglass.doctor</text>
    <text x="26" y="78" fill="#EAF6FB" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">checking dns records...</text>
    <text x="26" y="112" fill="#8BB77F" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">ok: dkim selector verified</text>
    <text x="26" y="146" fill="#E0A955" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">warn: bounce webhook not configured</text>
  </g>
  <g transform="translate(640 410)">
    <rect width="420" height="180" rx="8" fill="#EAF6FB" stroke="#C7DCE5"/>
    <text x="26" y="44" fill="#0D1B2A" font-family="Inter Tight, Inter, sans-serif" font-size="26" font-weight="700">Type rules</text>
    <text x="26" y="82" fill="#0D1B2A" font-family="Inter, sans-serif" font-size="16">Use 400 and 700 weights.</text>
    <text x="26" y="114" fill="#0D1B2A" font-family="Inter, sans-serif" font-size="16">Keep letter spacing at 0.</text>
    <text x="26" y="146" fill="#0D1B2A" font-family="Inter, sans-serif" font-size="16">Use mono for structured values.</text>
  </g>
</svg>
