<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 32 164 156" role="img" aria-labelledby="mg-fable-mark-title mg-fable-mark-desc">
  <title id="mg-fable-mark-title">mailglass mark</title>
  <desc id="mg-fable-mark-desc">The mailglass mark on its own: an envelope suggested entirely by light — a landscape pane, a lit fold, and a round seal of light crossing the lower edge. For light surfaces.</desc>
  <g>
    <!-- pane 140x96 at (0,44); fold (14,58)-(126,58)-(70,92) voided; seal r36 centered on the lower edge at (70,140) -->
    <path data-part="mark" fill="#0D1B2A" fill-rule="evenodd" d="M 0 44 L 140 44 L 140 140 L 106 140 A 36 36 0 0 0 34 140 L 0 140 Z M 14 58 L 126 58 L 70 92 Z"/>
    <path data-part="mark" fill="#277B96" d="M 106 140 A 36 36 0 0 1 34 140 Z"/>
  </g>
</svg>
