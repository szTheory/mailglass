- banner:
  - img "mailglass"
  - group "Appearance":
    - radio "System"
    - text: System
    - radio "Light" [checked]
    - text: Light
    - radio "Dark"
    - text: Dark
- complementary:
  - navigation "Mailglass sections":
    - group "Account":
      - group: Account Northstar Logistics
      - text: northstar
      - link "Health":
        - /url: /ops/mail?tenant_id=northstar
      - link "Deliveries":
        - /url: /ops/mail?tenant_id=northstar&view=deliveries
      - link "Inbound":
        - /url: /ops/mail/inbound?tenant_id=northstar
      - text: Applies to Health, Deliveries and Inbound.
    - link "Preview":
      - /url: /dev/mail?return_surface=deliveries&return_tenant_id=northstar
    - paragraph: Not tied to an Account
- main:
  - heading "Deliveries" [level=1]
  - paragraph: Trace each delivery through its event history.
  - status: 2 deliveries match
  - group "Filters":
    - text: Filters Search
    - button "Help for Search"
    - text: Find deliveries by recipient email address or subject.
    - textbox "Search":
      - /placeholder: Subject or recipient
      - text: billing@northstar.example
    - text: Time window
    - button "Help for Time window"
    - text: Show deliveries with activity during this period.
    - combobox "Time window":
      - option "Last 24 hours"
      - option "Last 7 days" [selected]
      - option "Last 30 days"
    - text: Latest recorded event
    - button "Help for Latest recorded event"
    - text: Filter by the latest event recorded for each delivery.
    - combobox "Latest recorded event":
      - option "Any status" [selected]
      - option "Queued"
      - option "Sent"
      - option "Rejected"
      - option "Failed"
      - option "Bounced"
      - option "Deferred"
      - option "Delivered"
      - option "Autoresponded"
      - option "Opened"
      - option "Clicked"
      - option "Complained"
      - option "Unsubscribed"
      - option "Subscribed"
      - option "Unknown"
      - option "Dispatched"
      - option "Suppressed"
    - text: Provider
    - button "Help for Provider"
    - text: Filter by the sending provider recorded for this account.
    - combobox "Provider":
      - option "Any provider" [selected]
      - option "Postmark"
      - option "SendGrid"
  - button "Clear filters"
  - article:
    - paragraph:
      - text: Delivered
      - button "Help for Delivered"
      - text: Messages with delivery confirmation or an open or click event, unless a later delivery problem was recorded. Counts include all results for the applied provider, time window, and search.
    - paragraph: "1"
    - paragraph: Tracked
  - article:
    - paragraph:
      - text: Needs attention
      - button "Help for Needs attention"
      - text: Failed, bounced, rejected, deferred, suppressed, complained, or unsubscribed deliveries. Open a delivery to inspect what happened. Counts include all matching results.
    - paragraph: "1"
    - paragraph: Needs attention
  - article:
    - paragraph:
      - text: Awaiting confirmation
      - button "Help for Awaiting confirmation"
      - text: Messages are queued or have been sent to the provider, but no delivery result has been recorded. A missing result does not mean delivery failed. Counts include all matching results.
    - paragraph: "0"
    - paragraph: Tracked
  - complementary:
    - heading "Deliveries 2 deliveries" [level=2]: Deliveries (2)
    - region "Delivery records":
      - table:
        - rowgroup:
          - row "Recipient / Subject Outcome Provider Updated":
            - columnheader "Recipient / Subject"
            - columnheader "Outcome"
            - columnheader "Provider"
            - columnheader "Updated"
        - rowgroup:
          - 'row "Open delivery for billing@northstar.example Bounced The provider reported that this message could not be delivered. Open the delivery to inspect the bounce reason. POSTMARK Copy timestamp as UTC: 2026-11-15 02:01:33.000000 UTC"':
            - cell "Open delivery for billing@northstar.example":
              - button "Open delivery for billing@northstar.example": billing@northstar.example Payment action needed for Northstar Logistics
            - cell "Bounced The provider reported that this message could not be delivered. Open the delivery to inspect the bounce reason.":
              - button "Bounced"
              - text: The provider reported that this message could not be delivered. Open the delivery to inspect the bounce reason.
            - cell "POSTMARK"
            - 'cell "Copy timestamp as UTC: 2026-11-15 02:01:33.000000 UTC"':
              - 'button "Copy timestamp as UTC: 2026-11-15 02:01:33.000000 UTC"':
                - time: Nov 15, 2026, 2:01 AM
          - 'row "Open delivery for billing@northstar.example Delivered The provider reported that the recipient''s mail server accepted this message. This does not confirm it reached the inbox or was read. POSTMARK Copy timestamp as UTC: 2026-11-15 01:37:33.000000 UTC"':
            - cell "Open delivery for billing@northstar.example":
              - button "Open delivery for billing@northstar.example": billing@northstar.example Receipt INV-2026-0601 for Northstar Logistics
            - cell "Delivered The provider reported that the recipient's mail server accepted this message. This does not confirm it reached the inbox or was read.":
              - button "Delivered"
              - text: The provider reported that the recipient's mail server accepted this message. This does not confirm it reached the inbox or was read.
            - cell "POSTMARK"
            - 'cell "Copy timestamp as UTC: 2026-11-15 01:37:33.000000 UTC"':
              - 'button "Copy timestamp as UTC: 2026-11-15 01:37:33.000000 UTC"':
                - time: Nov 15, 2026, 1:37 AM
