- main:
  - heading "Deliveries" [level=1]
  - paragraph: Trace each delivery through its event history.
  - status: 2 deliveries match
  - button "Filters (1 applied)"
  - article:
    - paragraph:
      - text: Delivered
      - button "Help for Delivered"
      - text: Messages with delivery confirmation or an open or click event, unless a later delivery problem was recorded. Counts include all results for the applied provider, time window, and search.
    - paragraph: "1"
    - paragraph: Tracked
  - article:
    - paragraph:
      - text: Needs attention
      - button "Help for Needs attention"
      - text: Failed, bounced, rejected, deferred, suppressed, complained, or unsubscribed deliveries. Open a delivery to inspect what happened. Counts include all matching results.
    - paragraph: "1"
    - paragraph: Needs attention
  - article:
    - paragraph:
      - text: Awaiting confirmation
      - button "Help for Awaiting confirmation"
      - text: Messages are queued or have been sent to the provider, but no delivery result has been recorded. A missing result does not mean delivery failed. Counts include all matching results.
    - paragraph: "0"
    - paragraph: Tracked
  - complementary:
    - heading "Deliveries 2 deliveries" [level=2]: Deliveries (2)
