- banner:
  - img "mailglass"
  - group "Appearance":
    - radio "System"
    - text: System
    - radio "Light" [checked]
    - text: Light
    - radio "Dark"
    - text: Dark
- complementary:
  - navigation "Mailglass sections":
    - group "Account":
      - group: Account Northstar Logistics
      - text: northstar
      - link "Health":
        - /url: /ops/mail?tenant_id=northstar
      - link "Deliveries":
        - /url: /ops/mail?tenant_id=northstar&view=deliveries
      - link "Inbound":
        - /url: /ops/mail/inbound?tenant_id=northstar
      - text: Applies to Health, Deliveries and Inbound.
    - link "Preview":
      - /url: /dev/mail?return_surface=inbound&return_tenant_id=northstar
    - paragraph: Not tied to an Account
- main:
  - heading "Inbound records" [level=1]
  - paragraph: Follow each received message through routing and mailbox processing.
  - status: 6 messages match
  - group "Filters":
    - text: Filters Search
    - button "Help for Search"
    - text: Find by subject, recipient, or provider message id.
    - textbox "Search":
      - /placeholder: Subject or recipient
    - text: Time window
    - button "Help for Time window"
    - text: Limit results to recently received messages.
    - combobox "Time window":
      - option "Last 24 hours"
      - option "Last 7 days" [selected]
      - option "Last 30 days"
    - text: Mailbox outcome
    - button "Help for Mailbox outcome"
    - text: Filter by the latest fresh mailbox outcome, including unrouted messages and no change. The summary is hidden while this filter is applied.
    - combobox "Mailbox outcome":
      - option "Any outcome" [selected]
      - option "Unrouted"
      - option "Accepted"
      - option "Ignored"
      - option "No change"
      - option "Rejected"
      - option "Bounced"
      - option "Failed"
    - text: Provider
    - button "Help for Provider"
    - text: Filter by the inbound provider recorded for this account.
    - combobox "Provider":
      - option "Any provider" [selected]
      - option "Mailgun"
      - option "Postmark"
  - button "Clear filters"
  - article:
    - paragraph:
      - text: Accepted
      - button "Help for Accepted"
      - text: Messages whose latest fresh run was accepted by a mailbox.
    - paragraph: "1"
    - paragraph: All clear
  - article:
    - paragraph:
      - text: Unrouted
      - button "Help for Unrouted"
      - text: No mailbox routing rule matched these messages. Open a message to inspect the routes that were checked.
    - paragraph: "1"
    - paragraph: All clear
  - article:
    - paragraph:
      - text: Failed
      - button "Help for Failed"
      - text: Mailbox processing ended in failure. Open a message to inspect the recorded error.
    - paragraph: "1"
    - paragraph: All clear
  - complementary:
    - heading "Received messages 6 messages" [level=2]: Received messages (6)
    - region "Inbound records":
      - table:
        - rowgroup:
          - row "Recipient / Subject Outcome Mailbox Provider Received":
            - columnheader "Recipient / Subject"
            - columnheader "Outcome"
            - columnheader "Mailbox"
            - columnheader "Provider"
            - columnheader "Received"
        - rowgroup:
          - 'row "Open inbound message 01a1dd02-8a78-7820-b86f-8bbc7937c73b Unrouted No routing rule matched, so this message was not sent to a mailbox. Unrouted None of the routing rules matched this email, so it wasn''t sent to a mailbox. Open the message to see which rules were checked. POSTMARK Copy timestamp as UTC: 2026-11-15 02:16:33.000000 UTC"':
            - cell "Open inbound message 01a1dd02-8a78-7820-b86f-8bbc7937c73b":
              - button "Open inbound message 01a1dd02-8a78-7820-b86f-8bbc7937c73b": unknown@demo.mailglass.local Unrouted vendor notice
            - cell "Unrouted No routing rule matched, so this message was not sent to a mailbox.":
              - button "Unrouted"
              - text: No routing rule matched, so this message was not sent to a mailbox.
            - cell "Unrouted None of the routing rules matched this email, so it wasn't sent to a mailbox. Open the message to see which rules were checked.":
              - button "Unrouted"
              - text: None of the routing rules matched this email, so it wasn't sent to a mailbox. Open the message to see which rules were checked.
            - cell "POSTMARK"
            - 'cell "Copy timestamp as UTC: 2026-11-15 02:16:33.000000 UTC"':
