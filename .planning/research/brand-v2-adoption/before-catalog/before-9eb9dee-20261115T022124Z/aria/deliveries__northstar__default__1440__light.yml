- banner:
  - img "mailglass"
  - group "Appearance":
    - radio "System"
    - text: System
    - radio "Light" [checked]
    - text: Light
    - radio "Dark"
    - text: Dark
- complementary:
  - navigation "Mailglass sections":
    - group "Account":
      - group: Account Northstar Logistics
      - text: northstar
      - link "Health":
        - /url: /ops/mail?tenant_id=northstar
      - link "Deliveries":
        - /url: /ops/mail?tenant_id=northstar&view=deliveries
      - link "Inbound":
        - /url: /ops/mail/inbound?tenant_id=northstar
      - text: Applies to Health, Deliveries and Inbound.
    - link "Preview":
      - /url: /dev/mail?return_surface=deliveries&return_tenant_id=northstar
    - paragraph: Not tied to an Account
- main:
  - heading "Deliveries" [level=1]
  - paragraph: Trace each delivery through its event history.
  - status: 20 deliveries match
  - group "Filters":
    - text: Filters Search
    - button "Help for Search"
    - text: Find deliveries by recipient email address or subject.
    - textbox "Search":
      - /placeholder: Subject or recipient
    - text: Time window
    - button "Help for Time window"
    - text: Show deliveries with activity during this period.
    - combobox "Time window":
      - option "Last 24 hours"
      - option "Last 7 days" [selected]
      - option "Last 30 days"
    - text: Latest recorded event
    - button "Help for Latest recorded event"
    - text: Filter by the latest event recorded for each delivery.
    - combobox "Latest recorded event":
      - option "Any status" [selected]
      - option "Queued"
      - option "Sent"
      - option "Rejected"
      - option "Failed"
      - option "Bounced"
      - option "Deferred"
      - option "Delivered"
      - option "Autoresponded"
      - option "Opened"
      - option "Clicked"
      - option "Complained"
      - option "Unsubscribed"
      - option "Subscribed"
      - option "Unknown"
      - option "Dispatched"
      - option "Suppressed"
    - text: Provider
    - button "Help for Provider"
    - text: Filter by the sending provider recorded for this account.
    - combobox "Provider":
      - option "Any provider" [selected]
      - option "Postmark"
      - option "SendGrid"
  - button "Clear filters"
  - article:
    - paragraph:
      - text: Delivered
      - button "Help for Delivered"
      - text: Messages with delivery confirmation or an open or click event, unless a later delivery problem was recorded. Counts include all results for the applied provider, time window, and search.
    - paragraph: "8"
    - paragraph: Tracked
  - article:
    - paragraph:
      - text: Needs attention
      - button "Help for Needs attention"
      - text: Failed, bounced, rejected, deferred, suppressed, complained, or unsubscribed deliveries. Open a delivery to inspect what happened. Counts include all matching results.
    - paragraph: "9"
    - paragraph: Needs attention
  - article:
    - paragraph:
      - text: Awaiting confirmation
      - button "Help for Awaiting confirmation"
      - text: Messages are queued or have been sent to the provider, but no delivery result has been recorded. A missing result does not mean delivery failed. Counts include all matching results.
    - paragraph: "3"
    - paragraph: Tracked
  - complementary:
    - heading "Deliveries 20 deliveries" [level=2]: Deliveries (20)
