- banner:
  - img "mailglass"
  - group "Appearance":
    - radio "System"
    - radio "Light"
    - radio "Dark" [checked]
- navigation "Mailglass sections":
  - group "Account":
    - group: Account Northstar Logistics
    - text: northstar
    - link "Health":
      - /url: /ops/mail?tenant_id=northstar
    - link "Activity":
      - /url: /ops/mail?tenant_id=northstar&view=deliveries
    - link "Inbound":
      - /url: /ops/mail/inbound?tenant_id=northstar
    - text: Applies to Health, Activity and Inbound.
  - link "Preview":
    - /url: /dev/mail?return_surface=deliveries&return_tenant_id=northstar
  - paragraph: Not tied to an Account
- main:
  - heading "Activity" [level=1]
  - paragraph: Every email your app sent, one row per delivery.
  - status: 1 email matches
  - text: Email address
  - searchbox "Email address": pw-typo-bounce@northstar.example
  - paragraph: Also matches subjects.
  - button "Filters (1 applied)"
  - article:
    - paragraph:
      - text: Delivered
      - button "Help for Delivered"
      - text: Emails with a delivery report from the receiving server. Counts include all results for the applied provider, time window, and search.
    - paragraph: "0"
    - paragraph: Tracked
  - article:
    - paragraph:
      - text: Needs attention
      - button "Help for Needs attention"
      - text: Emails that failed, were delayed, or were not sent because the address is suppressed. Open a delivery to see what was recorded. Counts include all matching results.
    - paragraph: "1"
    - paragraph: Needs attention
  - article:
    - paragraph:
      - text: Awaiting confirmation
      - button "Help for Awaiting confirmation"
      - text: Emails are queued or have been sent to the provider, but no delivery result has been recorded. A missing result does not mean delivery failed. Counts include all matching results.
    - paragraph: "0"
    - paragraph: Tracked
  - complementary:
    - heading "Activity 1 email" [level=2]: Activity (1)
    - list:
      - listitem:
        - button "pw-typo-bounce@northstar.example Reset your password Password reset":
          - paragraph: pw-typo-bounce@northstar.example
          - paragraph: Reset your password
          - paragraph: Password reset
        - text: Failed ID
        - paragraph: 01a1e1cc-628b-79ed-99a5-563efc91e751
        - text: Latest event
        - paragraph: Bounced
        - text: Provider
        - paragraph: POSTMARK
        - text: Updated
        - button "Copy Nov 16, 2026, 12:05 AM UTC (copies the exact UTC value 2026-11-16 00:05:30.000000 UTC)":
          - time: Nov 16, 2026, 12:05 AM UTC
