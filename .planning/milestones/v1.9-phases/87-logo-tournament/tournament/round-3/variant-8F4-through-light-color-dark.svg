  <title id="r38f4d-title">mailglass lockup, candidate 8F-4, color on dark</title>
  <desc id="r38f4d-desc">The 8F mark with a second, smaller light leaving the pane's opposite corner: the corner lens unchanged and a small echo lens at the top-left corner, beside the mailglass wordmark. Brand-token fills for dark surfaces; same geometry as the mono master.</desc>
